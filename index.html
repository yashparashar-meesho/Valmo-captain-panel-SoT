  function getVpCss() {
    var tags = document.querySelectorAll("style");
    for (var i = 0; i < tags.length; i++) {
      var all = tags[i].textContent || "";
      var idx = all.indexOf("/* ============ vp- component kit");
      if (idx > -1) return all.slice(idx);
    }
    return "";
  }

  function expandIcons(html) {
    if (!html) return html;
    return html.replace(/data-icon="([^"]+)"/g, function (m, key) {
      var uri = state.icons && state.icons[key];
      return uri ? 'src="' + uri + '"' : m;
    });
  }

  function screenIframeDoc(screen) {
    var protoScript =
      '<script>document.addEventListener("click",function(e){' +
      'var el=e.target.closest("[data-goto]");' +
      'if(el){window.parent.postMessage({source:"flow-ledger-proto",goto:el.getAttribute("data-goto")},"*");}' +
      '});<' + '/script>';
    var body = expandIcons(screen.code) || '<div style="padding:40px;font-family:sans-serif;color:#888;">No markup saved for this screen yet.</div>';
    // Map screens get the real Leaflet map here too, exactly as the exported pages do.
    // Relative paths inside a srcdoc resolve against this page, so assets/vendor/*
    // works the same locally and hosted. No webfont link: Mier ships with the kit.
    var mapHead = "", mapTail = "";
    if (body.indexOf('class="vp-maparea"') > -1) {
      mapHead = '<link rel="stylesheet" href="assets/vendor/leaflet.css">' +
                '<script src="assets/vendor/leaflet.js"><' + '/script>';
      mapTail = '<script src="assets/vendor/sa-map.js"><' + '/script>';
    }
    return '<!doctype html><html><head><meta charset="utf-8"><base href="' + location.href + '">' +
      mapHead +
      '<style>body{margin:0;background:#eaeaf2;}[data-goto]{cursor:pointer;}</style>' +
      '<style>' + getVpCss() + '</style>' +
      '</head><body>' + body + protoScript + mapTail + '</body></html>';
  }

  window.addEventListener("message", function (e) {
    var d = e.data;
    if (!d || d.source !== "flow-ledger-proto" || !d.goto) return;
    var target = state.screens.find(function (s) { return s.id === d.goto; });
    if (!target) { toast("No screen wired up for that link yet"); return; }
    if (!state.activeFlow || state.activeFlow.id !== target.flowId) {
      var f = state.flows.find(function (x) { return x.id === target.flowId; });
      if (f) {
        state.activeFlow = f;
        state.view = "flows";
        syncViewSwitch();
        renderRail();
      }
    }
    var screensInFlow = state.screens
      .filter(function (s) { return s.flowId === target.flowId; })
      .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    var i = screensInFlow.findIndex(function (s) { return s.id === target.id; });
    state.activeScreenIndex = i > -1 ? i : 0;
    renderMain();
    if (document.getElementById("fsOverlay").classList.contains("show") && state._currentScreen) {
      openFullscreen(state._currentScreen);
    }
  });

  function openFullscreen(screen) {
    document.getElementById("fsName").textContent = screen.name;
    document.getElementById("fsFrame").srcdoc = screenIframeDoc(screen);
    document.getElementById("fsOverlay").classList.add("show");
  }
  function closeFullscreen() {
    document.getElementById("fsOverlay").classList.remove("show");
    document.getElementById("fsFrame").srcdoc = "";
  }
  document.getElementById("fsCloseBtn").addEventListener("click", closeFullscreen);

  // The rail belongs to whichever view is open: flows for Flows, the component names
  // for Components, the foundation sections for Foundations. "All" always comes first.
  /* ---- spine: one tree for flows, components and foundations ----
     v1 had a header view-switcher plus a rail whose contents changed with it -
     two things to understand before you could find anything. Here every section
     is on screen at once, a flow opens to reveal its screens, and picking a
     screen is one click from anywhere in the catalog. The section headings carry
     data-view, so the existing #viewSwitch delegate still drives the view. */
  function railRow(id, num, name, count, active) {
    return '<li class="spine-item' + (active ? " active" : "") + '" data-rail="' + id + '">' +
      '<span class="n">' + num + '</span>' +
      '<span class="name">' + esc(name) + '</span>' +
      '<span class="count">' + (count == null ? "" : count) + '</span>' +
      '</li>';
  }

  function bindRail(onPick) {
    var nav = document.getElementById("spineTree");
    Array.prototype.forEach.call(nav.querySelectorAll("[data-rail]"), function (el) {
      el.addEventListener("click", function () { onPick(el.getAttribute("data-rail")); });
    });
  }

  var SECTIONS = [
    { view: "flows", label: "Flows",
      ic: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2.5" width="12" height="4" rx="1"/><rect x="2" y="9.5" width="12" height="4" rx="1"/></svg>' },
    { view: "components", label: "Components",
      ic: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>' },
    { view: "foundations", label: "Foundations",
      ic: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8 14.5 5 8 8.2 1.5 5 8 1.8Z"/><path d="M1.5 8.5 8 11.7l6.5-3.2"/><path d="M1.5 11.8 8 15l6.5-3.2"/></svg>' },
    { view: "learn", label: "Learn",
      ic: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.2h4.2A1.8 1.8 0 0 1 8 5v8a1.5 1.5 0 0 0-1.5-1.3H2Z"/><path d="M14 3.2H9.8A1.8 1.8 0 0 0 8 5v8a1.5 1.5 0 0 1 1.5-1.3H14Z"/></svg>' }
  ];

  function renderSections() {
    var counts = {
      flows: state.flows.length,
      components: state.components.length,
      foundations: 3,
      learn: (state.learn || []).length
    };
    document.getElementById("viewSwitch").innerHTML = SECTIONS.map(function (sec) {
      return '<button data-view="' + sec.view + '"' + (state.view === sec.view ? ' class="active"' : '') + '>' +
        '<span class="ic">' + sec.ic + '</span>' +
        '<span class="lbl">' + sec.label + '</span>' +
        '<span class="n">' + counts[sec.view] + '</span>' +
        '</button>';
    }).join("");
  }

  function renderRail() {
    renderSections();
    var tree = document.getElementById("spineTree");
    var html = "";

    if (state.view === "flows") {
      html += '<div class="spine-kicker">' + state.flows.length + ' module' + (state.flows.length === 1 ? '' : 's') + '</div><ul class="spine-list">';
      if (!state.flows.length) {
        html += '<li class="rail-empty">No flows yet.</li>';
      } else {
        state.flows.forEach(function (f, i) {
          var open = state.activeFlow && state.activeFlow.id === f.id;
          var scr = state.screens
            .filter(function (x) { return x.flowId === f.id; })
            .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
          html += '<li class="spine-item' + (open ? " active" : "") + '" data-flow="' + f.id + '">' +
            '<span class="n">' + String(i + 1).padStart(2, "0") + '</span>' +
            '<span class="name">' + esc(f.name) + '</span>' +
            '<span class="count">' + scr.length + '</span>' +
            '</li>';
          if (open && scr.length) {
            html += '<ul class="spine-screens">';
            scr.forEach(function (sc, j) {
              html += '<li class="spine-screen' + (j === state.activeScreenIndex ? " active" : "") +
                '" data-flow="' + f.id + '" data-screen="' + j + '">' +
                '<span class="name">' + esc(sc.name) + '</span></li>';
            });
            html += '</ul>';
          }
        });
      }
      html += '</ul>';
    } else if (state.view === "components") {
      html += '<div class="spine-kicker">' + state.components.length + ' components</div><ul class="spine-list">';
      html += railRow("__all", "", "All", state.components.length, !state.compFilter);
      state.components.forEach(function (c, i) {
        html += railRow(c.id, String(i + 1).padStart(2, "0"), c.name, null, state.compFilter === c.id);
      });
      html += '</ul>';
    } else if (state.view === "learn") {
      var arts = state.learn || [];
      html += '<div class="spine-kicker">' + arts.length + ' guides</div><ul class="spine-list">';
      html += railRow("__all", "", "All", arts.length, !learnId);
      arts.forEach(function (a, i) {
        html += railRow(a.id, String(i + 1).padStart(2, "0"), a.name, null, learnId === a.id);
      });
      html += '</ul>';
    } else {
      html += '<div class="spine-kicker">3 foundations</div><ul class="spine-list">';
      [["all", "All"], ["type", "Typography"], ["color", "Colour"], ["space", "Spacing"]]
        .forEach(function (t, i) {
          html += railRow(t[0], i === 0 ? "" : String(i).padStart(2, "0"), t[1], null, foundTab === t[0]);
        });
      html += '</ul>';
    }

    tree.innerHTML = html;

    Array.prototype.forEach.call(tree.querySelectorAll("[data-flow]"), function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        var f = state.flows.find(function (x) { return x.id === el.getAttribute("data-flow"); });
        var si = el.getAttribute("data-screen");
        state.activeFlow = f;
        state.activeScreenIndex = si == null ? 0 : Number(si);
        state.atVersion = null;
        state.view = "flows";
        renderRail();
        renderMain();
      });
    });

    if (state.view === "components") {
      bindRail(function (id) { state.compFilter = (id === "__all") ? null : id; renderMain(); renderRail(); });
    } else if (state.view === "learn") {
      bindRail(function (id) { learnId = (id === "__all") ? null : id; renderMain(); renderRail(); });
    } else if (state.view === "foundations") {
      bindRail(function (id) { foundTab = id; renderMain(); renderRail(); });
    }
  }

  /* renderFlowList stays for callers that predate the tree */
  function renderFlowList() { renderRail(); }

  /* ---- top bar: breadcrumb + the actions for whatever is open ---- */
  function renderTopbar(parts, actions) {
    var c = document.getElementById("crumb");
    c.innerHTML = parts.map(function (p, i) {
      return (i ? '<span class="sep">/</span>' : "") + p;
    }).join("");
    document.getElementById("topActions").innerHTML = actions || "";
  }

  /* ---- command palette ---- */
  var palItems = [], palSel = 0;

  function palBuild() {
    var out = [];
    state.flows.forEach(function (f) {
      state.screens
        .filter(function (s) { return s.flowId === f.id; })
        .sort(function (a, b) { return (a.order || 0) - (b.order || 0); })
        .forEach(function (s, i) {
          out.push({ kind: "screen", name: s.name, ctx: f.name, go: function () {
            state.activeFlow = f; state.activeScreenIndex = i; state.view = "flows";
            state.atVersion = null;
            renderRail(); renderMain();
          } });
        });
    });
    state.components.forEach(function (c) {
      out.push({ kind: "component", name: c.name, ctx: c.category || "", go: function () {
        state.view = "components"; state.compFilter = c.id; renderRail(); renderMain();
      } });
    });
    [["type", "Typography"], ["color", "Colour"], ["space", "Spacing"]].forEach(function (t) {
      out.push({ kind: "foundation", name: t[1], ctx: "", go: function () {
        state.view = "foundations"; foundTab = t[0]; renderRail(); renderMain();
      } });
    });
    (state.learn || []).forEach(function (a) {
      out.push({ kind: "learn", name: a.name,
        ctx: a.audience === "everyone" ? "" : a.audience,
        extra: [a.summary, a.badge, a.track].join(" "),
        go: function () {
          state.view = "learn"; learnId = a.id; renderRail(); renderMain();
        } });
    });
    palItems = out;
  }

  function palRender(q) {
    var list = document.getElementById("palList");
    q = (q || "").trim().toLowerCase();
    var hits = q
      ? palItems.filter(function (it) {
          return (it.name + " " + it.ctx + " " + it.kind + " " + (it.extra || ""))
            .toLowerCase().indexOf(q) > -1;
        })
      : palItems.slice(0, 12);
    if (palSel >= hits.length) palSel = 0;
    if (!hits.length) {
      list.innerHTML = '<div class="pal-empty">Nothing matches &ldquo;' + esc(q) + '&rdquo;</div>';
      return;
    }
    /* The name is evocative, so the line beside it is literal. It shows only
       on the browsing state - once you are typing you know what this is. */
    var lead = q ? "" :
      '<div class="pal-lead">Slipstream \u2014 Start where the last person finished.</div>';
    list.innerHTML = lead + hits.map(function (it, i) {
      return '<div class="pal-row' + (i === palSel ? " sel" : "") + '" data-i="' + i + '">' +

            .then(function (r) { return r.ok ? r.text() : ""; })
            .then(function (css) {
              return "<style>" + css.replace(/url\("fonts\//g, 'url("assets/fonts/') + "</style>" + body;
            });
        }
        var s0 = page.indexOf("<style>", page.indexOf("</title>"));
        var s1 = page.lastIndexOf("</style>");
        return (s0 > -1 ? page.slice(s0, s1 + 8) : "") + body;
      })
      .then(function (inner) {
        return '<!doctype html><html><head><meta charset="utf-8">' +
          '<base href="' + location.origin + location.pathname.replace(/[^/]*$/, "") + '">' +
          '<style>body{margin:0;background:#eaeaf2;}</style>' + inner +
          '</body></html>';
      });
  }

  /* ---- Learn ----------------------------------------------------------- */
  var learnId = null;

  /* The card index. Fourteen undifferentiated cards is a wall, so they are grouped
     by what you would be doing when you reach for them. */
  /* Anything a reader has to retype is a chance to mistype it. Every code block in
     Learn gets its own copy button with quiet, local feedback - the big centred
     confirmation is for the pull commands, where what happens next matters; here
     it would be in the way. */
  function attachCodeCopy(root) {
    Array.prototype.forEach.call(root.querySelectorAll(".learn-code"), function (pre) {
      if (pre.querySelector(".code-copy")) return;
      var text = pre.textContent;
      var btn = document.createElement("button");
      btn.className = "code-copy";
      btn.type = "button";
      btn.setAttribute("aria-label", "Copy to clipboard");
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
        'stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/>' +
        '<path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg><span>Copy</span>';
      btn.addEventListener("click", function () {
        var done = function () {
          btn.classList.add("ok");
          btn.querySelector("span").textContent = "Copied";
          clearTimeout(btn._t);
          btn._t = setTimeout(function () {
            btn.classList.remove("ok");
            btn.querySelector("span").textContent = "Copy";
          }, 1400);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
        } else { fallbackCopy(text); done(); }
      });
      pre.appendChild(btn);
    });
  }

  /* A guide that states a count is a guide that becomes wrong the first time
     someone adds a component. Prose writes {{screens}}, {{colours}} and so on,
     and they are filled from the same tables the catalog itself renders from -
     so a number in a sentence cannot disagree with the thing it describes. */
  function learnCounts() {
    /* Counted from the very tables the Foundations pages render, so a number in a
       sentence and the grid it describes cannot disagree.
         TYPO_STYLES   flat list of styles
         COLOR_GROUPS  [group, [swatch, …]]
         SPACE_ROLES   [role, description, [token, …]]
         SPACE_EXTRA   { role: [token, …] }  — the Valmo additions  */
    function sum(list, pick) {
      var n = 0;
      (list || []).forEach(function (row) { n += (pick(row) || []).length; });
      return n;
    }
    var colours = 0, spacing = 0, roles = 0;
    try { colours = sum(COLOR_GROUPS, function (g) { return g[1]; }); } catch (e) {}
    try {
      spacing = sum(SPACE_ROLES, function (r) { return r[2]; });
      roles = (SPACE_ROLES || []).length;
      Object.keys(SPACE_EXTRA).forEach(function (k) { spacing += SPACE_EXTRA[k].length; });
    } catch (e) {}
    return {
      flows: (state.flows || []).length,
      screens: (state.screens || []).length,
      components: (state.components || []).length,
      guides: (state.learn || []).length,
      typeStyles: (typeof TYPO_STYLES !== "undefined" ? TYPO_STYLES.length : 0),
      colours: colours,
      spacingTokens: spacing,
      spacingRoles: roles
    };
  }

  function fillCounts(html) {
    var c = learnCounts();
    return html.replace(/\{\{(\w+)\}\}/g, function (m, k) {
      return c[k] === undefined ? m : String(c[k]);
    });
  }

  /* The catalog's own history. An old index.html is self-contained - it embeds
     its catalog and its stylesheet - so it is fetched from git and run in the
     full-screen frame rather than stored anywhere. A <base> is injected so its
     icon paths resolve against today's site; a raw git URL serves an SVG as
     plain text, which a browser will not draw. */
  function openLedgerHistory() {
    var list = (state.versions && state.versions.ledger) || [];
    closePanel();
    var ov = document.createElement("div");
    ov.className = "overlay"; ov.id = "overlay";
    var body = !list.length
      ? '<p class="sub">No history recorded yet \u2014 run scripts/build_versions.py.</p>'
      : '<ol class="evo">' + list.map(function (v, i) {
      return '<li class="evo-row">' +
        '<span class="evo-dot"></span>' +
        '<span class="evo-meta">' +
          '<b>' + esc(v.subject) + '</b>' +
          '<em>' + v.date + ' &middot; ' + v.short + (i === 0 ? ' &middot; current' : '') + '</em>' +
        '</span>' +
        (i === 0 ? '<span class="evo-now">you are here</span>'
                 : '<button class="btn small evo-open" data-sha="' + v.sha + '" ' +
                   'data-label="' + esc(v.date + " · " + v.short) + '">Open this version</button>') +
        '</li>';
      }).join("") + '</ol>';

    ov.innerHTML = '<div class="panel">' +
      '<h3>Version history</h3>' +
      '<p class="sub">' + list.length + ' version' + (list.length === 1 ? '' : 's') +
      '. Nothing is stored \u2014 an old build is self-contained, so it is fetched from git ' +
      'and run exactly as it was. Needs the repository to be reachable.</p>' +
      body +
      '<div class="panel-actions"><button class="btn" id="evoClose">Close</button></div></div>';
    document.body.appendChild(ov);
    ov.classList.add("show");
    document.getElementById("evoClose").addEventListener("click", closePanel);
    ov.addEventListener("click", function (e) { if (e.target === ov) closePanel(); });
    Array.prototype.forEach.call(ov.querySelectorAll(".evo-open"), function (b) {
      b.addEventListener("click", function () { closePanel(); openLedgerVersion(b.dataset.sha, b.dataset.label); });
    });
  }

  function openLedgerVersion(sha, label) {
    var ov = document.getElementById("fsOverlay");
    var frame = document.getElementById("fsFrame");
    document.getElementById("fsName").textContent = "Slipstream as of " + label;
    frame.srcdoc = '<!doctype html><body style="margin:0;font:400 13px system-ui;color:#6B7C96;' +
      'display:grid;place-items:center;height:100vh">Fetching that version\u2026</body>';
    ov.classList.add("show");
    fetch(RAW + sha + "/index.html")
      .then(function (r) { if (!r.ok) throw new Error("not reachable"); return r.text(); })
      .then(function (page) {
        var base = '<base href="' + location.origin +
          location.pathname.replace(/[^/]*$/, "") + '">';
        frame.srcdoc = page.replace(/<head>/i, "<head>" + base);
      })
      .catch(function (e) {
        frame.srcdoc = '<!doctype html><body style="margin:0;font:400 13px system-ui;color:#B3462C;' +
          'display:grid;place-items:center;height:100vh">Could not load that version \u2014 ' +
          'the repository may be unreachable.</body>';
      });
  }

  function renderLearnIndex(arts) {
    var main = document.getElementById("main");
    renderTopbar(['<strong>Learn</strong>', "All guides"], "");

    var order = ["Orientation", "Working with it", "The craft", "Reference"];
    var blurb = {
      "Orientation": "What this is, and why it is built the way it is.",
      "Working with it": "Getting changes in, and adding to the catalogue.",
      "The craft": "How to do the work well enough that the result can be trusted.",
      "Reference": "Look things up, or go deeper."
    };
    var by = {};
    arts.forEach(function (a) { (by[a.track] = by[a.track] || []).push(a); });

    var html = '<div class="learn-index">' +
      '<div class="learn-index-head"><h1>Learn</h1>' +
      '<p>Slipstream: start where the last person finished. ' + learnCounts().guides +
      ' guides on using it \u2014 start at the top if you are new, the first gets you set up in about ten minutes.</p></div>';

    order.forEach(function (t) {
      if (!by[t]) return;
      html += '<section class="learn-track">' +
        '<div class="learn-track-head"><h2>' + esc(t) + '</h2><span>' + esc(blurb[t]) + '</span></div>' +
        '<div class="learn-cards">';
      by[t].forEach(function (a) {
        html += '<button class="learn-card" data-go="' + a.id + '">' +
          '<span class="lc-top">' +
            '<span class="lc-ic">' + a.icon + '</span>' +
            '<span class="lc-n">' + String(a.order + 1).padStart(2, "0") + '</span>' +
          '</span>' +
          '<span class="lc-title">' + esc(a.name) +
            (a.badge ? '<span class="lc-badge shimmer">' + esc(a.badge) + '</span>' : '') +
          '</span>' +
          '<span class="lc-sum">' + esc(a.summary) + '</span>' +
          '<span class="lc-foot">' +
            '<span class="lc-tags">' +
              (a.audience && a.audience !== "everyone"
                ? '<span class="lc-aud">' + esc(a.audience) + '</span>' : '') +
              (a.flag ? '<span class="lc-flag">' + esc(a.flag) + '</span>' : '') +
            '</span>' +
            '<span class="lc-go">Read &#8250;</span>' +
          '</span></button>';
      });
      html += '</div></section>';
    });
    main.innerHTML = html + '</div>';

    Array.prototype.forEach.call(main.querySelectorAll("[data-go]"), function (b) {
      b.addEventListener("click", function () {

        document.getElementById("main").scrollTop = 0;
      });

  function renderLearn() {
    var main = document.getElementById("main");
    var arts = state.learn || [];
    if (!arts.length) {
      renderTopbar(['<strong>Learn</strong>'], "");
      main.innerHTML = '<div class="empty-state"><h2>Nothing written yet</h2></div>';
      return;
    }
    if (learnId && !arts.some(function (x) { return x.id === learnId; })) learnId = null;
    if (!learnId) { renderLearnIndex(arts); return; }
    var a = arts.filter(function (x) { return x.id === learnId; })[0];
    var i = arts.indexOf(a);

    /* The rail's "All" does return here, but it sits above the numbered list
       where it reads as a heading. The crumb is where people actually click. */
    renderTopbar(['<button type="button" class="crumb-up" data-learn-all>Learn</button>',
                  esc(a.name)], "");
    main.innerHTML =
      '<article class="learn">' +
      '<div class="learn-head">' +
      (a.audience && a.audience !== "everyone"
        ? '<span class="learn-aud">for ' + esc(a.audience) + '</span>' : '') +
      '<h1>' + esc(a.title || a.name) +
        (a.badge ? '<span class="learn-badge shimmer">' + esc(a.badge) + '</span>' : '') +
      '</h1>' +
      '</div>' +
      fillCounts(a.html) +
      '<nav class="learn-next">' +
      (i > 0 ? '<button class="btn" data-go="' + arts[i - 1].id + '">&#8249; ' + esc(arts[i - 1].name) + '</button>' : '<span></span>') +
      (i < arts.length - 1 ? '<button class="btn primary" data-go="' + arts[i + 1].id + '">' + esc(arts[i + 1].name) + ' &#8250;</button>' : '<span></span>') +
      '</nav></article>';

    attachCodeCopy(main);
    attachScopeFilter(main);

    /* The way back out of a guide is the "Learn" crumb, which is where people
       click anyway. A separate back control above the title was tried and
       removed - it competed with the title for the top of the column. */
    Array.prototype.forEach.call(
      document.querySelectorAll("#crumb [data-learn-all]"),
      function (up) {
        up.addEventListener("click", function () {
          learnId = null; renderMain(); renderRail();
          document.getElementById("main").scrollTop = 0;
        });

    Array.prototype.forEach.call(main.querySelectorAll("[data-go]"), function (b) {
      b.addEventListener("click", function () {

  /* Some guides carry lessons from both products at once. A guide opts in by
     putting an empty <div id="vkFilter"> in its prose and tagging the blocks
     that belong to one product with data-scope. Anything left untagged is
     common to both and stays visible under every choice, which is why the
     control says what it will and will not hide. */
  var SCOPES = [
    ["all", "All"],
    ["design", "Design calls"],
    ["tech", "Technical traps"]
  ];
  function attachScopeFilter(root) {
    var host = root.querySelector("#vkFilter");
    if (!host) return;
    var tagged = root.querySelectorAll("[data-scope]");
    if (!tagged.length) return;

    host.className = "vk-filter";
    host.innerHTML = SCOPES.map(function (sc) {
      return '<button type="button" class="vk-chip" data-scope-pick="' + sc[0] + '">' +
        esc(sc[1]) + '</button>';
    }).join("");

    function apply(pick) {
      Array.prototype.forEach.call(tagged, function (el) {
        el.hidden = pick !== "all" && el.getAttribute("data-scope") !== pick;
      });
      Array.prototype.forEach.call(host.querySelectorAll("[data-scope-pick]"), function (b) {
        b.classList.toggle("on", b.getAttribute("data-scope-pick") === pick);
      });
    }
    Array.prototype.forEach.call(host.querySelectorAll("[data-scope-pick]"), function (b) {
      b.addEventListener("click", function () { apply(b.getAttribute("data-scope-pick")); });
    });
    apply("all");
  }

  /* These screens are built for a 1456px-wide panel. Given a narrower stage they
     reflow, so a 13" laptop sees a different layout, taller than its frame, and
     has to scroll inside the prototype. Below the design width the screen is
     rendered at 1456 and scaled down instead: the same layout on every machine,
     whole and in proportion, just smaller. Full screen is there when the detail
     matters. At or above the design width nothing is scaled. */
  var DESIGN_W = 1456;

  function fitStage() {
    var wrap = document.getElementById("stageCanvas");
    var frame = document.getElementById("screenFrame");
    if (!wrap || !frame) return;
    var w = wrap.clientWidth, h = wrap.clientHeight;
    if (!w || !h) return;
    if (w >= DESIGN_W) {
      frame.style.width = w + "px";
      frame.style.height = h + "px";
      frame.style.transform = "none";
    } else {
      var k = w / DESIGN_W;
      frame.style.width = DESIGN_W + "px";
      frame.style.height = Math.round(h / k) + "px";
      frame.style.transform = "scale(" + k + ")";
    }
  }

  window.addEventListener("resize", function () {
    clearTimeout(window.__fitT);
    window.__fitT = setTimeout(fitStage, 80);
  });

  function renderMain() {
    var main = document.getElementById("main");

    main.classList.toggle("stage-view", false);

    if (state.view === "components") {
      var one = state.compFilter && state.components.find(function (c) { return c.id === state.compFilter; });
      renderTopbar(
        ['<strong>Components</strong>'].concat(one ? [esc(one.name), '<span class="id">' + esc(one.id) + '</span>'] : []),
        one ? '<button class="btn small primary copy-comp-cmd" data-id="' + one.id + '">Copy pull command</button>' +
              '<button class="btn small copy-comp-code" data-id="' + one.id + '">Copy code</button>' : ''
      );
      renderComponents();
      bindCompCopy(document.getElementById("topActions"));
      return;
    }

    if (state.view === "learn") {
      renderLearn();
      return;
    }

    if (state.view === "foundations") {
      var names = { all: "All", type: "Typography", color: "Colour", space: "Spacing" };
      renderTopbar(['<strong>Foundations</strong>', esc(names[foundTab] || "All")], '');
      renderFoundations();
      return;
    }

    if (!state.activeFlow) {
      renderTopbar(['<strong>Flows</strong>'], "");
      main.innerHTML =
        '<div class="empty-state">' +
        '<h2>' + (state.flows.length ? "Pick a flow" : "Nothing here yet") + '</h2>' +
        '<p>' + (state.flows.length
          ? "Choose a flow on the left to walk its screens end to end, or press ⌘K to jump straight to one."
          : "This ledger holds your product's flows and the screens inside them.") +
        '</p></div>';
      return;
    }

    var screens = state.screens
      .filter(function (s) { return s.flowId === state.activeFlow.id; })
      .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });

    if (!screens.length) {
      renderTopbar(['<strong>' + esc(state.activeFlow.name) + '</strong>'], "");
      main.innerHTML = '<div class="empty-state"><h2>No screens in this flow yet</h2>' +
        '<p>Add the first screen — its entry point, its states, and its real markup.</p></div>';
      return;
    }

    if (state.activeScreenIndex >= screens.length) state.activeScreenIndex = 0;
    var idx = state.activeScreenIndex;
    var s = screens[idx];

    renderTopbar(
      ['<strong>' + esc(state.activeFlow.name) + '</strong>',
       esc(s.name),
       '<span class="id">' + esc(s.id) + '</span>'],
      '<button class="btn small primary" id="pullFlowBtn">Copy entire flow</button>' +
      '<button class="btn small copy-cmd" data-id="' + s.id + '">Copy current screen</button>' +
      '<button class="btn small ghost js-fullscreen">&#10530; Full screen</button>'
    );

    /* The strip and the summary come first: how many screens this module has, and
       what this one is, read before the screen itself. Everything sits in one
       left-aligned 70% column so the three share an edge. */
    var html = '<div class="work-col">';

    html += '<div class="filmstrip">';
    screens.forEach(function (sc, i) {
      html += '<div class="film' + (i === idx ? " active" : "") + '" data-idx="' + i + '">' +
        '<span class="n">' + (i + 1) + '</span>' + esc(sc.name) + '</div>';
    });
    html += '</div>';

    /* Just the facts that are not already on screen: the states this screen can be
       in, and the components it is built from. The name is in the breadcrumb and
       the strip, and the step count is the strip itself - repeating them here only
       pushed the prototype below the fold. */
    /* `states` stays in data-seed.json - it is an accurate note about the real
       product - but it is not shown. Only some of those states are reachable in
       the screen we render (the map layer toggles, the collapsed panel); the rest
       (loading, empty, "AWB not found") have nothing behind them, so the pills
       promised screens that do not exist. Bring this back when the variants do. */
    var facts = "";
    if (s.components && s.components.length) {
      facts += '<div><span class="k">Components used</span><div class="pillrow">' +
        s.components.map(function (x) { return '<span class="pill">' + esc(x) + '</span>'; }).join("") +
        '</div></div>';
    }
    if (facts) html += '<div class="metacard"><div class="inner"><div class="rows">' + facts + '</div></div></div>';

    /* the stage: the live screen, floating. The walk controls live in its own bar
       so nothing flanks it and the left edge stays true. */
    html += '<div class="stage-outer"><div class="stage">' +
        '<div class="stage-bar">' +
          '<span class="stage-dots"><i></i><i></i><i></i></span>' +
          '<span class="title">' + (state.atVersion
            ? '<span class="vpast">viewing ' + state.atVersion.slice(0, 7) + ' &mdash; ' +
              '<button class="vback">back to current</button></span>'
            : esc(s.id)) + '</span>' +
          '<span class="walk">' +
            '<button class="stage-nav" id="prevScreenBtn" ' + (idx === 0 ? "disabled" : "") + ' title="Previous screen" aria-label="Previous screen">&#8249;</button>' +
            '<button class="stage-nav" id="nextScreenBtn" ' + (idx === screens.length - 1 ? "disabled" : "") + ' title="Next screen" aria-label="Next screen">&#8250;</button>' +
            (versionsFor("screens", s.id).length
              ? '<button class="stage-fs js-history" title="Version history">&#8635; History <span class="vcount">' +
                  versionsFor("screens", s.id).length + '</span></button>'
              : '') +
            '<button class="stage-fs js-fullscreen" title="Full screen">&#10530; Full screen</button>' +
          '</span>' +
        '</div>' +
        '<div class="stage-canvas" id="stageCanvas">' +
          '<iframe class="stage-frame" id="screenFrame" title="' + esc(s.name) + '"></iframe>' +
        '</div>' +
      '</div></div>';

    html += '</div>';

    main.classList.add("stage-view");
    main.innerHTML = html;

    var frame = document.getElementById("screenFrame");
    if (frame) {
      if (state.atVersion) {
        frame.srcdoc = '<!doctype html><body style="margin:0;font:400 13px system-ui;color:#6B7C96;' +
          'display:grid;place-items:center;height:100vh">Loading that revision\u2026</body>';
        oldScreenDoc(s, state.atVersion).then(function (doc) {
          if (state.atVersion) frame.srcdoc = doc;
        }).catch(function (e) {
          toast("Couldn't load that revision", { sub: String(e.message || e) });
          state.atVersion = null;
          renderMain();
        });
      } else {
        frame.srcdoc = screenIframeDoc(s);
      }
    }
    state._currentScreen = s;
    fitStage();

    // the same control sits on the stage and in the top bar, so bind both
    Array.prototype.forEach.call(document.querySelectorAll(".js-fullscreen"), function (b) {
      b.addEventListener("click", function () { openFullscreen(s); });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".js-history"), function (b) {
      b.addEventListener("click", function () { openHistory("screens", s.id, s.name); });
    });
    var vb = document.querySelector(".vback");
    if (vb) vb.addEventListener("click", function () { state.atVersion = null; renderMain(); });

    Array.prototype.forEach.call(main.querySelectorAll(".film"), function (el) {
      el.addEventListener("click", function () {
        state.activeScreenIndex = Number(el.dataset.idx);
        state.atVersion = null;
        renderMain(); renderRail();
      });
    });

    var prevBtn = document.getElementById("prevScreenBtn");
    var nextBtn = document.getElementById("nextScreenBtn");
    // any move to a different screen lands you on its current version, not on
    // whatever revision you were reading of the previous one
    if (prevBtn) prevBtn.addEventListener("click", function () { state.activeScreenIndex = Math.max(0, idx - 1); state.atVersion = null; renderMain(); renderRail(); });
    if (nextBtn) nextBtn.addEventListener("click", function () { state.activeScreenIndex = Math.min(screens.length - 1, idx + 1); state.atVersion = null; renderMain(); renderRail(); });

    var pullFlowBtn = document.getElementById("pullFlowBtn");
    if (pullFlowBtn) pullFlowBtn.addEventListener("click", function () { copyText(pinToVersion(flowPullCommand(state.activeFlow, screens))); });

    Array.prototype.forEach.call(document.querySelectorAll(".copy-cmd"), function (btn) {
      btn.addEventListener("click", function () {
        var sc = screens.find(function (x) { return x.id === btn.dataset.id; });
        copyText(pinToVersion(pullCommand(sc)));
      });
    });
  }

  function selectFlow(f) {
    state.activeFlow = f;
    state.activeScreenIndex = 0;
    state.view = "flows";
    syncViewSwitch();
    renderRail();
    renderMain();
  }

  function syncViewSwitch() {
    Array.prototype.forEach.call(document.querySelectorAll("#viewSwitch button"), function (b) {
      b.classList.toggle("active", b.dataset.view === state.view);
    });
  }

  document.getElementById("viewSwitch").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-view]");
    if (!btn) return;
    state.view = btn.dataset.view;
    syncViewSwitch();
    renderMain();
    renderRail();
  });

  // ---- command palette wiring ----
  document.getElementById("palOpen").addEventListener("click", palOpen);
  document.getElementById("evoBtn").addEventListener("click", openLedgerHistory);
  document.getElementById("palInput").addEventListener("input", function (e) { palSel = 0; palRender(e.target.value); });
  document.addEventListener("keydown", function (e) {
    var open = document.getElementById("pal").classList.contains("show");
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); open ? palClose() : palOpen(); return; }
    if (!open) {
      if (e.key === "ArrowLeft") { var p = document.getElementById("prevScreenBtn"); if (p && !p.disabled) p.click(); }
      if (e.key === "ArrowRight") { var n = document.getElementById("nextScreenBtn"); if (n && !n.disabled) n.click(); }
      return;
    }
    var list = document.getElementById("palList");
    var hits = list._hits || [];
    if (e.key === "Escape") { palClose(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); palSel = Math.min(hits.length - 1, palSel + 1); palRender(document.getElementById("palInput").value); }
    else if (e.key === "ArrowUp") { e.preventDefault(); palSel = Math.max(0, palSel - 1); palRender(document.getElementById("palInput").value); }
    else if (e.key === "Enter" && hits[palSel]) { hits[palSel].go(); palClose(); }
  });
  document.getElementById("pal").addEventListener("click", function (e) { if (e.target.id === "pal") palClose(); });
  if (!/Mac|iPhone|iPad/.test(navigator.platform)) document.getElementById("palHint").textContent = "Ctrl K";

  // ---- panels ----
  function closePanel() {
    var ov = document.getElementById("overlay");
    if (ov) ov.remove();
  }

  function openFlowPanel(existing) {
    var ov = document.createElement("div");
    ov.className = "overlay";
    ov.id = "overlay";
    ov.innerHTML =
      '<div class="panel">' +
      '<h3>' + (existing ? "Edit flow" : "New flow") + '</h3>' +
      '<div class="sub">A flow is one user journey — checkout, onboarding, seller payouts.</div>' +
      '<div class="field"><label>Name</label><input id="fName" value="' + (existing ? esc(existing.name) : "") + '" placeholder="e.g. Seller payout"></div>' +
      '<div class="field"><label>Description</label><textarea id="fDesc" placeholder="What this journey covers, start to end">' + (existing ? esc(existing.description || "") : "") + '</textarea></div>' +
      '<div class="panel-actions">' +
      '<button class="btn" id="fCancel">Cancel</button>' +
      '<button class="btn primary" id="fSave">' + (existing ? "Save" : "Create flow") + '</button>' +
      '</div></div>';
    document.body.appendChild(ov);
    ov.addEventListener("click", function (e) { if (e.target === ov) closePanel(); });
    document.getElementById("fCancel").addEventListener("click", closePanel);
    document.getElementById("fSave").addEventListener("click", function () {
      var name = document.getElementById("fName").value.trim();
      if (!name) { toast("Give the flow a name"); return; }
      var desc = document.getElementById("fDesc").value.trim();
      if (existing) {
        state.db.doc("flows/" + existing.id).update({ name: name, description: desc })
          .then(closePanel).catch(function () { toast("Save failed — try again"); });
      } else {
        var order = state.flows.length;
        state.db.collection("flows").add({ name: name, description: desc, order: order })
          .then(function (ref) { closePanel(); return ref.get(); })
          .then(function (snap) { selectFlow({ id: snap.id, name: name, description: desc, order: order }); })
          .catch(function () { toast("Create failed — try again"); });
      }
    });
  }

  function openScreenPanel(flowId) {
    var ov = document.createElement("div");
    ov.className = "overlay";
    ov.id = "overlay";
    ov.innerHTML =
      '<div class="panel">' +
      '<h3>New screen</h3>' +
      '<div class="sub">This becomes the spec anyone pulls into a Claude chat.</div>' +
      '<div class="row">' +
      '<div class="field"><label>Name</label><input id="sName" placeholder="e.g. Payout confirmation"></div>' +
      '<div class="field"><label>Order in flow</label><input id="sOrder" type="number" placeholder="1"></div>' +
      '</div>' +
      '<div class="field"><label>Description</label><textarea id="sDesc" placeholder="What this screen is for, key content, why it exists"></textarea></div>' +
      '<div class="field"><label>States</label><input id="sStates" placeholder="empty, loading, error, success"><span class="hint">comma-separated</span></div>' +
      '<div class="field"><label>Key components</label><input id="sComp" placeholder="Header, AmountCard, CTAButton"><span class="hint">comma-separated</span></div>' +
      '<div class="field"><label>Code / markup (optional)</label><textarea id="sCode" placeholder="Paste real HTML/JSX if you have it — kept verbatim" style="min-height:110px;font-family:'
      + "'IBM Plex Mono', monospace" + ';font-size:11.5px;"></textarea></div>' +
      '<div class="field"><label>Tags (optional)</label><input id="sTags" placeholder="checkout, mobile, v2"><span class="hint">comma-separated</span></div>' +
      '<div class="panel-actions">' +
      '<button class="btn" id="sCancel">Cancel</button>' +
      '<button class="btn primary" id="sSave">Add screen</button>' +
      '</div></div>';
    document.body.appendChild(ov);
    ov.addEventListener("click", function (e) { if (e.target === ov) closePanel(); });
    document.getElementById("sCancel").addEventListener("click", closePanel);
    document.getElementById("sSave").addEventListener("click", function () {
      var name = document.getElementById("sName").value.trim();
      if (!name) { toast("Give the screen a name"); return; }
      var split = function (id) {
        var v = document.getElementById(id).value.trim();
        return v ? v.split(",").map(function (x) { return x.trim(); }).filter(Boolean) : [];
      };
      var orderVal = parseInt(document.getElementById("sOrder").value, 10);
      var existingCount = state.screens.filter(function (s) { return s.flowId === flowId; }).length;
      var body = {
        flowId: flowId,
        name: name,
        order: isNaN(orderVal) ? existingCount : orderVal,
        description: document.getElementById("sDesc").value.trim(),
        states: split("sStates"),
        components: split("sComp"),
        code: document.getElementById("sCode").value,
        tags: split("sTags"),
        updatedAt: new Date().toISOString()
      };
      state.db.collection("screens").add(body)
        .then(closePanel)
        .catch(function () { toast("Add failed — try again"); });
    });
  }

  // ---- local (file://) fallback db ----
  // This is the only mode this page runs in now — it's hosted as a plain static
  // site (Vercel), not a claude.ai Artifact, so window.claude.use('db') never
  // resolves. Backed by the seed data embedded below — edits here are in-memory
  // only. Update data-seed.json and redeploy to persist real changes.
  function makeLocalDb(seed) {
    function idOf(path) { return path.split("/").pop(); }
    function collOf(path) {
      var name = path.split("/")[0];
      if (name === "flows") return state.flows;
      if (name === "screens") return state.screens;
      if (name === "components") return state.components;
      return [];
    }
    function localNotice() { toast("Read-only hosted catalog — not saved. Edit data-seed.json and redeploy instead."); }
    return {
      doc: function (path) {
        return {
          update: function (data) {
            var arr = collOf(path), id = idOf(path);
            var item = arr.find(function (x) { return x.id === id; });
            if (item) Object.assign(item, data);
            renderRail(); renderMain(); localNotice();
            return Promise.resolve();
          },
          delete: function () {
            var arr = collOf(path), id = idOf(path);
            var i = arr.findIndex(function (x) { return x.id === id; });
            if (i > -1) arr.splice(i, 1);
            renderRail(); renderMain(); localNotice();
            return Promise.resolve();
          }
        };
      },
      collection: function (name) {
        return {
          add: function (data) {
            var id = "local-" + Date.now() + "-" + Math.floor(Math.random() * 1e6);
            var doc = Object.assign({ id: id }, data);
            (name === "flows" ? state.flows : name === "screens" ? state.screens : state.components).push(doc);
            renderRail(); renderMain(); localNotice();
            return Promise.resolve({ id: id, get: function () { return Promise.resolve({ id: id, data: function () { return data; } }); } });
          }
        };
      }
    };
  }

  // ---- db wiring ----
  /* The arrival.

     Two paths. Without the splash the shell simply lands and the rail lockup
     animates in place - `landing` on <html> starts it. With the splash, the
     name is read at full size first and then flown onto the real rail heading:
     the transform is measured from both elements at run time, so it lands on
     the heading exactly rather than near it, at any window size or zoom.

     It never blocks. The catalogue is rendered underneath before any of this
     runs, Skip and any key or click end it immediately, and if anything at all
     throws, `finish()` still runs from a timer. The worst case is the tool
     appearing instantly, which is the normal case anyway. */
  var SPLASH_KEY = "slipstream.seen";

  /* The arrival sunsets itself. It plays on a person's first three visits and
     then never again - once is too few to take in properly, and a tool people
     open all day should not keep introducing itself forever.

     The count lives in this browser only. If localStorage cannot be read the
     answer is "already seen": better that someone misses the introduction than
     that it replays on every single load with no way to stop it.

     `?splash` always plays it and never spends one of the three, so it can be
     shown to someone without using up their allowance. `?nosplash` skips it. */
  var SPLASH_TIMES = 3;

  function splashCount() {
    try {
      return parseInt(localStorage.getItem(SPLASH_KEY) || "0", 10) || 0;
    } catch (e) { return SPLASH_TIMES; }
  }

  function splashForced() { return /[?&]splash\b/.test(location.search); }

  function wantsSplash() {
    if (splashForced()) return true;
    if (/[?&]nosplash\b/.test(location.search)) return false;
    return splashCount() < SPLASH_TIMES;
  }

  /* Only ever run on the no-splash path. Coming out of the splash the shell has
     been on screen the whole time, just out of focus - animating it in after
     the name lands made the rail blink out and back, which is the thing that
     looked broken. */
  function land() {
    document.documentElement.classList.add("landing");
  }

  function runSplash() {
    var el = document.getElementById("splash");
    if (!el) { land(); return; }
    if (!splashForced()) {
      try { localStorage.setItem(SPLASH_KEY, String(splashCount() + 1)); } catch (e) {}
    }

    var name = document.getElementById("spName");
    var tag = document.getElementById("spTag");
    var done = false;

    function finish() {
      if (done) return;
      done = true;
      /* remove it, do not just hide it: `.splash` sets `display: flex`, which
         outranks the [hidden] attribute, so hiding leaves a full-screen layer
         sitting over the tool - harmless once it is transparent, fatal if Skip
         is pressed while it is still opaque. */
      /* same frame: the flown copy leaves and the real heading appears in the
         spot it just reached */
      if (el.parentNode) el.parentNode.removeChild(el);
      document.documentElement.classList.remove("splash-on", "handoff");
    }

    /* Measured, not guessed: where the rail lockup's *glyphs* actually are.

       A heading is a block, so its bounding box is the width of whatever
       contains it, not the width of the word inside it. Scaling by that ratio
       shrank 56px type by a factor of 0.92 instead of 0.35 and the name landed
       on the rail still enormous. A Range over the text node gives the real
       glyph box, which is what has to match. */
    function textRect(el) {
      var r = document.createRange();
      r.selectNodeContents(el);
      return r.getBoundingClientRect();
    }

    /* Put one piece of text exactly on another.

       Two things make it more than a subtraction. The scale happens about the
       element's border box corner, not about the glyphs, and the glyph box
       sits at an offset inside that border box - so the offset scales too. And
       a splash line and its rail twin have different line-heights, so their
       line boxes shrink by different amounts; matching tops leaves the words
       sitting low. Match the glyph centres instead.

         glyph left   after = box.left + (a.left - box.left) * k + dx
         glyph top    after = box.top  + (a.top  - box.top ) * k + dy
         glyph height after = a.height * k

       Setting those equal to the target's gives dx and dy. Measured
       afterwards, left, width and centre deltas all come out at 0.00. */
    function settleOnto(el, target) {
      if (!target) return false;
      var box = el.getBoundingClientRect();
      var a = textRect(el), b = textRect(target);
      if (!a.width || !b.width) return false;
      var k = b.width / a.width;
      var dx = b.left - box.left - (a.left - box.left) * k;
      var dy = b.top + b.height / 2 - (a.height * k) / 2
               - box.top - (a.top - box.top) * k;
      el.classList.add("fly");
      el.style.transform = "translate(" + dx + "px," + dy + "px) scale(" + k + ")";
      return true;
    }

    function flyHome() {
      if (done) return;
      /* Both arrival classes come off before the flight, and `draft` has to go
         with `sweep` rather than be left on.

         `.sp-tag.sweep` declares its own `animation`, which overrides the one
         `.sp-tag.draft` declares. Removing only `sweep` therefore makes the
         draft animation newly-applied - so the browser starts it again, from
         the top, with its half-second delay and `backwards` fill. A running
         animation outranks an inline transform, so the line sat at the draft's
         start offset and then snapped into place instead of travelling. With
         no animation declared on either element, the inline transform is free
         to transition. */
      name.classList.remove("draft");
      tag.classList.remove("draft", "sweep");

      /* Together, not staggered. Giving the name a lead made the line look
         like it was lagging behind rather than belonging to it - they are one
         lockup, so they move as one and land as one. */
      var okName = settleOnto(name, document.querySelector(".spine-brand h1"));
      settleOnto(tag, document.getElementById("spineTag"));
      if (!okName) { finish(); return; }
      el.classList.add("clearing");
      el.classList.add("gone");
      /* focus returns as the name travels - one movement, not two */
      document.documentElement.classList.remove("splash-on");
      name.addEventListener("transitionend", function (e) {
        if (e.propertyName === "transform") finish();
      });
      setTimeout(finish, 1000);
    }

    name.classList.add("draft");
    tag.classList.add("draft");
    tag.addEventListener("animationend", function (e) {
      if (e.animationName !== "sp-draft" || done) return;
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { if (!done) tag.classList.add("sweep"); });
      });
    });
    tag.addEventListener("animationend", function (e) {
      if (e.animationName === "tag-sweep" && !done) flyHome();
    });

    document.getElementById("spSkip").addEventListener("click", finish);
    document.addEventListener("keydown", function k(e) {
      document.removeEventListener("keydown", k); finish();
    });
    el.addEventListener("click", function (e) {
      if (e.target.id !== "spSkip") finish();
    });

    /* backstop: if any animation never fires, the tool still appears */
    setTimeout(finish, 5200);
    document.documentElement.classList.add("splash-on", "handoff");
    el.hidden = false;
  }

  async function boot() {
    var db = (window.claude && typeof window.claude.use === "function") ? await window.claude.use("db") : null;

    if (!db) {
      var seedEl = document.getElementById("seed-data");
      var seed = seedEl ? JSON.parse(seedEl.textContent) : { flows: [], screens: [], components: [] };
      state.flows = seed.flows || [];
      state.screens = seed.screens || [];
      state.components = seed.components || [];
      state.learn = seed.learn || [];
      state.icons = seed.icons || {};
      if (!state.activeFlow && state.flows.length) state.activeFlow = state.flows[0];
      var counts = {};
      state.screens.forEach(function (s) { counts[s.flowId] = (counts[s.flowId] || 0) + 1; });
      state._counts = counts;
      state.db = makeLocalDb(seed);
      renderRail();
      renderMain();
      loadVersions();
      return;
    }
    state.db = db;

    db.doc("assets/icons").get().then(function (d) {
      state.icons = (d && d.exists && d.data() && d.data().map) || {};
      renderMain();
    }).catch(function () { });

    db.collection("flows").orderBy("order").onSnapshot(function (snap) {
      state.flows = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      if (!state.activeFlow && state.flows.length) state.activeFlow = state.flows[0];
      if (state.activeFlow) {
        var still = state.flows.find(function (f) { return f.id === state.activeFlow.id; });
        state.activeFlow = still || (state.flows[0] || null);
      }
      renderRail();
      renderMain();
    }, function () { toast("Couldn't load flows"); });

    db.collection("screens").onSnapshot(function (snap) {
      state.screens = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      var counts = {};
      state.screens.forEach(function (s) { counts[s.flowId] = (counts[s.flowId] || 0) + 1; });
      state._counts = counts;
      renderRail();
      renderMain();
    }, function () { toast("Couldn't load screens"); });

    db.collection("components").orderBy("order").onSnapshot(function (snap) {
      state.components = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      renderMain();
    }, function () { toast("Couldn't load components"); });
  }

  boot().then(function () {
    if (wantsSplash()) runSplash(); else land();
  }, function () { land(); });
})();
</script>
