" stroke-linejoin=\"round\"><path d=\"M4 12h11\"/><path d=\"M11 8l4 4-4 4\"/><rect x=\"17\" y=\"4\" width=\"3.5\" height=\"16\" rx=\"1.2\"/></svg>", "track": "Working with it"}, {"id": "adding-a-module", "name": "Adding a new module", "audience": "designers", "summary": "The bigger job: a whole new flow, in the order that avoids rework.", "order": 6, "html": "<p class=\"lead\">The catalogue holds three of the panel's eight modules. Adding the next one is the main way this grows \u2014 and it is a bigger job than editing an existing screen, so it gets its own page.</p>\n\n<h3>Before you start</h3>\n<p>You need the setup from <b>Start here</b>, and you need to have read <b>Using the foundations</b> and <b>How to match a screen to live</b>. Adding a module is mostly the second of those, repeated.</p>\n<p>Budget roughly: a day for a simple two-screen module, considerably more if it contains a map, a chart, or anything with its own rendering engine.</p>\n\n<h3>The order that works</h3>\n<p>Do these in sequence. Doing screens before foundations means redoing the screens once the tokens exist.</p>\n\n<ol class=\"learn-ol\">\n  <li><b>Walk the module in the live product first.</b> Every screen, every tab, every state you can reach. Note what is genuinely new \u2014 a component that does not exist yet, a spacing value nothing else uses, a colour outside the palette. That list is your real scope.</li>\n  <li><b>Extend the foundations, if needed.</b> Add the tokens with a note on why, and the <code>Valmo</code> suffix if the design system does not cover them. Do this before building anything.</li>\n  <li><b>Build the new components.</b> Each one on its own, from foundation values, added to the catalogue so it appears under Components. Reuse aggressively \u2014 most \u201cnew\u201d components turn out to be an existing one with a variant.</li>\n  <li><b>Build the first screen completely.</b> Measure, build, superimpose, run the checks. Do not start a second screen until the first passes \u2014 the first is where you discover the scale is missing a step.</li>\n  <li><b>Build the rest of the screens.</b> Faster, because the components now exist.</li>\n  <li><b>Wire the flow.</b> Give the clickable elements a <code>data-goto</code> pointing at the next screen's id, so the module can be walked end to end.</li>\n  <li><b>Add the sidebar entry to every screen in the catalogue</b>, not only your own \u2014 the nav is part of each screen's markup, so a new module has to appear in all of them.</li>\n</ol>\n\n<h3>What goes in the catalogue</h3>\n<p>A flow and its screens are entries in <code>source/data-seed.json</code>. You do not usually type these by hand \u2014 ask Claude in the chat where you built the screens \u2014 but it helps to know the shape:</p>\n<pre class=\"learn-code\">flows[]    { id, name, order, description }\nscreens[]  { id, flowId, order, name, description,\n             states[], components[], tags[], code }</pre>\n<div class=\"learn-defs\">\n  <div><b>id</b><span>lowercase with hyphens, and it becomes the filename: <code>service-area-my-area</code>. Stable forever \u2014 links and version history depend on it.</span></div>\n  <div><b>order</b><span>position within the flow, starting at 0. This drives the strip above the prototype.</span></div>\n  <div><b>description</b><span>one sentence on what the screen is. It appears in the ledger, so write it for a reader who has not seen the screen.</span></div>\n  <div><b>components</b><span>which components the screen uses. Keep it honest \u2014 it is how someone finds where a component is used.</span></div>\n</div>\n\n<h3>Before you open the pull request</h3>\n<ul class=\"learn-rules\">\n  <li>Every screen in the flow reachable by clicking, start to finish.</li>\n  <li>The new module appears in the sidebar of <b>every</b> screen, not just its own.</li>\n  <li>The eight fidelity checks pass on each new screen.</li>\n  <li>No new colour, type or spacing value outside the foundations \u2014 or if there is, it is a token with a written reason.</li>\n  <li>Components you added appear under Components and render correctly on their own.</li>\n  <li>Anything you deliberately did not match is written into <b>Deliberate differences from live</b>.</li>\n</ul>\n\n<h3>Things that will cost you time</h3>\n<ul class=\"learn-rules\">\n  <li><b>Maps, charts and canvases.</b> Anything with its own rendering engine needs a decision up front: reproduce it, or approximate it convincingly and say so. Do not discover this halfway.</li>\n  <li><b>The sidebar is duplicated in every screen.</b> Adding a nav entry touches all of them. It is a known wart, not something you are doing wrong.</li>\n  <li><b>Real data.</b> Decide early what you are willing to put in a public repository. Names, phone numbers and transaction IDs are easy to capture and hard to remove later.</li>\n  <li><b>Scope creep through states.</b> A screen has one rendering here. Resist building six variants before the module exists at all.</li>\n</ul>\n", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3.5\" y=\"3.5\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"3.5\" y=\"13.5\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"13.5\" y=\"3.5\" width=\"7\" height=\"7\" rx=\"1.5\"/><path d=\"M17 14v6.5M13.75 17.25h6.5\"/></svg>", "track": "Working with it"}, {"id": "using-foundations", "name": "Using the foundations", "audience": "designers", "summary": "The two-layer token model, the naming rule, the six spacing roles, and the exemptions.", "order": 7, "html": "<p class=\"lead\">Foundations are the rules every screen and component obeys. This explains how to use them \u2014 the model, the naming, and what to do when you need something that is not there.</p>\n\n<h3>Two layers, and why</h3>\n<p>Every value exists twice, deliberately.</p>\n<div class=\"learn-two\">\n  <div class=\"learn-cell\"><b>Palette \u2014 what a value <em>is</em></b><span><code>--vpValmoBlue: #2A67FF</code><br>A fact about the product's colours. Rarely changes.</span></div>\n  <div class=\"learn-cell good\"><b>Semantic \u2014 what it is <em>for</em></b><span><code>--vpBrand: var(--vpValmoBlue)</code><br>A decision about usage. This is what screens and components use.</span></div>\n</div>\n<p>The point is that you can change what \u201cbrand\u201d means without hunting through fifty files, and you can read a rule and understand the intent. <code>color: var(--vpBrand)</code> says something; <code>color: #2A67FF</code> says nothing.</p>\n<p><b>The rule:</b> a component or screen should reach for a <em>semantic</em> token. Palette tokens are for defining semantic ones.</p>\n\n<h3>Typography: the category follows the weight</h3>\n<p>This trips people up, so it is worth stating plainly. A style's name tells you its <em>weight</em>, not where to use it.</p>\n<div class=\"learn-defs\">\n  <div><b>Body\u2026</b><span>Mier Book, weight 400 \u2014 regardless of size or role</span></div>\n  <div><b>ButtonText\u2026</b><span>Mier Demi or Bold, 600 or 700 \u2014 including table headers and links, not only buttons</span></div>\n  <div><b>Display\u2026</b><span>Its own category, for large figures</span></div>\n  <div><b>\u2026Valmo suffix</b><span>An addition the product needed that the design system does not cover</span></div>\n</div>\n<p>So a bold 14px table header is <code>ButtonText14BoldValmo</code> even though it is not a button. Naming by weight keeps the library from sprawling into one entry per usage.</p>\n<p><b>Applying it:</b> always the <code>font</code> shorthand, never the parts.</p>\n<pre class=\"learn-code\">font: var(--vpBody2);        /* family, size, weight, line-height in one */\n/* not: font-size: 13px; font-weight: 400; \u2026 */</pre>\n<p>One declaration is one thing to get right and one thing to check. Nothing outside the library may declare <code>font-family</code>, <code>font-size</code>, <code>font-weight</code> or <code>line-height</code>.</p>\n\n<h3>Spacing: six roles, not one scale</h3>\n<p>Most systems give you a scale of numbers. This one, taken from the Figma foundation, also gives every number a <em>role</em> \u2014 what kind of gap it is. That is unusual and genuinely useful, because it makes a rule self-describing.</p>\n<div class=\"learn-defs\">\n  <div><b>margin</b><span>space outside an element, pushing neighbours away</span></div>\n  <div><b>inline</b><span>between items sitting side by side, in a row</span></div>\n  <div><b>stack</b><span>between items sitting one above another, in a column</span></div>\n  <div><b>verPad</b><span>padding above and below, inside an element</span></div>\n  <div><b>horPad</b><span>padding left and right, inside an element</span></div>\n  <div><b>secGap</b><span>between whole sections of a page</span></div>\n</div>\n<p>Shorthands split by role, which is the part to remember:</p>\n<pre class=\"learn-code\">padding: 12px 16px\n  \u2192  var(--vpSpacingVerPad12) var(--vpSpacingHorPad16)\n\ngap: 8px   in a row     \u2192  var(--vpSpacingInline08)\ngap: 8px   in a column  \u2192  var(--vpSpacingStack08)</pre>\n<p>The same 8px carries a different token depending on direction. That is intentional: it means you can read a stylesheet and know what a gap is <em>doing</em>.</p>\n\n<h3>What is deliberately outside the rules</h3>\n<p>Three exemptions, so you do not go looking for tokens that should not exist:</p>\n<ul class=\"learn-rules\">\n  <li><b>Glyphs.</b> A chevron, a tick, a plus sign \u2014 <code>\u25be \u2039 \u203a + \u2212 \u2713</code>. These are symbols sized to fit, not language. A text style would be the wrong tool.</li>\n  <li><b>Artwork and alpha.</b> Map pins, shipment dots, legend keys, shadows and scrims. These are illustration, not interface colour.</li>\n  <li><b>The hero banner.</b> Exempt from the palette entirely \u2014 product may choose its own colours there.</li>\n</ul>\n\n<h3>When you need a value that does not exist</h3>\n<p>This is the important part, and the answer is not \u201cadd it quietly\u201d.</p>\n<p>First check whether an existing token is close enough \u2014 most new values turn out to be a rounding of one already there. If it is genuinely new, it goes into the foundation with a note saying why, and the <code>Valmo</code> suffix if the design system does not cover it. What it must <em>not</em> do is appear as a literal in a component.</p>\n<p>Two things that look like values but are not: <b>weight 500 does nothing</b> \u2014 Mier is registered at 400, 600 and 700 only, so live's 500 renders as 400. And an <b>undefined token is not a small bug</b> \u2014 CSS discards the entire declaration it appears in, silently.</p>\n\n<h3>Where to look them up</h3>\n<p>Foundations in the left rail renders all of it live: {{typeStyles}} text styles set in Mier at their real sizes, {{colours}} colours as swatches with hex and token name, {{spacingTokens}} spacing tokens drawn to scale. It is generated from the same file the screens use, so it cannot be out of date.</p>\n", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3.5\" y=\"15\" width=\"17\" height=\"5\" rx=\"1.5\"/><rect x=\"5.5\" y=\"9.5\" width=\"13\" height=\"4\" rx=\"1.4\"/><rect x=\"8\" y=\"4\" width=\"8\" height=\"4\" rx=\"1.3\"/></svg>", "track": "The craft"}, {"id": "matching-live", "name": "How to match a screen to live", "audience": "designers", "summary": "The core skill: measure, build, superimpose, check. Not a drawing job.", "order": 8, "html": "<p class=\"lead\">This is the core skill the catalogue depends on: taking a screen in the live product and reproducing it accurately enough that the copy can be trusted. It is a measuring job, not a drawing job.</p>\n\n<h3>The method</h3>\n<figure class=\"learn-fig\">\n<svg viewBox=\"0 0 680 150\" role=\"img\" aria-label=\"measure live, build, superimpose, check, verify deployed\">\n  <defs><marker id=\"b3a\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0,1 L7,4 L0,7 Z\" fill=\"#93A1B8\"/></marker></defs>\n  <rect x=\"10\" y=\"40\" width=\"118\" height=\"62\" rx=\"10\" fill=\"#EDF2FF\" stroke=\"#C7DCFF\"/>\n  <text x=\"69\" y=\"68\" class=\"dg-t\">Measure live</text><text x=\"69\" y=\"86\" class=\"dg-s\">computed styles</text>\n  <line x1=\"132\" y1=\"71\" x2=\"154\" y2=\"71\" stroke=\"#93A1B8\" stroke-width=\"1.5\" marker-end=\"url(#b3a)\"/>\n  <rect x=\"160\" y=\"40\" width=\"118\" height=\"62\" rx=\"10\" fill=\"#fff\" stroke=\"#DDE3ED\"/>\n  <text x=\"219\" y=\"68\" class=\"dg-t\">Build</text><text x=\"219\" y=\"86\" class=\"dg-s\">from foundations</text>\n  <line x1=\"282\" y1=\"71\" x2=\"304\" y2=\"71\" stroke=\"#93A1B8\" stroke-width=\"1.5\" marker-end=\"url(#b3a)\"/>\n  <rect x=\"310\" y=\"40\" width=\"118\" height=\"62\" rx=\"10\" fill=\"#fff\" stroke=\"#DDE3ED\"/>\n  <text x=\"369\" y=\"68\" class=\"dg-t\">Superimpose</text><text x=\"369\" y=\"86\" class=\"dg-s\">their boxes on ours</text>\n  <line x1=\"432\" y1=\"71\" x2=\"454\" y2=\"71\" stroke=\"#93A1B8\" stroke-width=\"1.5\" marker-end=\"url(#b3a)\"/>\n  <rect x=\"460\" y=\"40\" width=\"118\" height=\"62\" rx=\"10\" fill=\"#fff\" stroke=\"#DDE3ED\"/>\n  <text x=\"519\" y=\"68\" class=\"dg-t\">Run the checks</text><text x=\"519\" y=\"86\" class=\"dg-s\">eight of them</text>\n  <line x1=\"582\" y1=\"71\" x2=\"604\" y2=\"71\" stroke=\"#93A1B8\" stroke-width=\"1.5\" marker-end=\"url(#b3a)\"/>\n  <rect x=\"610\" y=\"40\" width=\"60\" height=\"62\" rx=\"10\" fill=\"#092D5E\"/>\n  <text x=\"640\" y=\"68\" class=\"dg-t inv\">Verify</text><text x=\"640\" y=\"86\" class=\"dg-s inv\">deployed</text>\n</svg>\n</figure>\n\n<h3>1. Measure, do not look</h3>\n<p>Open the live screen and read <b>computed styles</b> off the real element. Not a screenshot, not an eyedropper. A screenshot gives you a composite: a colour at 20% opacity over a background is neither of the two colours involved, and no amount of squinting recovers the real value.</p>\n<p>Collect, for every element that matters: font size, weight, line-height, colour, background, border width and colour, radius, padding, margin, gap, width and height. Record the box as x / y / width / height so you can compare positions later, not just properties.</p>\n<p>Two specifics worth knowing. When live states a tint in <code>oklab()</code>, convert the <b>opaque</b> colour to get the exact hex \u2014 sampling the composited pixel gives a different number. And a stated <code>font-weight: 500</code> is rendering as 400, because the typeface is registered only at 400, 600 and 700.</p>\n\n<h3>2. Build it from the foundations</h3>\n<p>Every value you measured should resolve to a token. If it does not, that is information: either the token is missing, or live has drifted from its own system. Both are worth writing down rather than silently absorbing.</p>\n<p>Do not hard-code the measured number to make it match. A screen full of literals looks right today and is unmaintainable tomorrow \u2014 and it breaks the one property that makes the catalogue valuable, that a foundation change moves everything together.</p>\n\n<h3>3. Superimpose</h3>\n<p>Take the boxes you measured from live and draw them as outlines over your rendered screen \u2014 absolutely positioned, one-pixel borders. Then look.</p>\n<p>This catches what numbers do not. Two elements can each be correct while the gap between them is wrong, because the error lives in something you did not think to measure. Superimposition shows you the thing you were not looking for.</p>\n\n<h3>4. The checks before calling it done</h3>\n<ol class=\"learn-ol\">\n  <li>Inventory live and ours exhaustively \u2014 including every component's <b>inner</b> elements \u2014 and compare programmatically, not by eye.</li>\n  <li>Superimpose live's measured boxes over the render.</li>\n  <li>Every <code>var(--vp\u2026)</code> referenced is actually defined. Run this <b>after</b> your last CSS edit, not before.</li>\n  <li>Tags balance: <code>&lt;div&gt;</code> against <code>&lt;/div&gt;</code>, <code>/*</code> against <code>*/</code>, on every exported page.</li>\n  <li>No raw pixel values in padding, margin or gap; no colour outside the palette; no type outside the library \u2014 except the documented exemptions.</li>\n  <li>Every image loads, and no <code>&lt;img&gt;</code> is missing its source.</li>\n  <li>All pages render with no console errors.</li>\n  <li>Re-verify on the <b>deployed</b> page after merging, not only locally.</li>\n</ol>\n\n<h3>Where measuring goes wrong</h3>\n<ul class=\"learn-rules\">\n  <li><b>Measuring containers only.</b> The banner matched live on all six outer measurements while the padding inside it was wrong. Measure the children.</li>\n  <li><b>Trusting a property that reports oddly.</b> A rotation once reported as identity while the render was plainly rotated. When a value contradicts your eyes, verify by pixels.</li>\n  <li><b>Assuming a difference is a mistake.</b> A grey radio can mean disabled rather than unselected. Work out what state live is expressing before correcting it.</li>\n  <li><b>Fixing one screen's detail as a special case.</b> Check whether it is a rule that belongs to the component before you make it an exception.</li>\n</ul>\n\n<h3>When live disagrees with the design system</h3>\n<p>It will. The default is to <b>reproduce live faithfully and write the disagreement down</b> \u2014 those notes are among the most valuable output here, because they are a list of inconsistencies nobody had collected.</p>\n<p>Deviating from live is allowed, but it must be deliberate and recorded. See <b>Deliberate differences from live</b> for the ones already agreed.</p>\n", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3.5\" y=\"3.5\" width=\"12\" height=\"12\" rx=\"1.6\"/><rect x=\"8.5\" y=\"8.5\" width=\"12\" height=\"12\" rx=\"1.6\" stroke-dasharray=\"3 2.5\"/></svg>", "track": "The craft"}, {"id": "deliberate-differences", "name": "Deliberate differences from live", "audience": "everyone", "summary": "What does not match the live product on purpose, and why \u2014 so nobody 'fixes' it.", "order": 9, "html": "<p class=\"lead\">Some things here do not match the live product, on purpose. Without this page they look like bugs, and someone helpfully \u201cfixes\u201d one. Each entry says what differs and why.</p>\n\n<h3>Deliberate deviations</h3>\n\n<div class=\"learn-trap\">\n  <h4>The hero banner ignores the colour palette</h4>\n  <p><b>Live:</b> a gradient that is not in the design system. <b>Ours:</b> the same gradient, exempt from the palette rules everything else obeys.</p>\n  <p class=\"fix\"><b>Why:</b> product may choose its own colours for banner artwork. Forcing it into the palette would misrepresent how the product actually works.</p>\n</div>\n\n<div class=\"learn-trap\">\n  <h4>The Service Area panel is content-sized, live fixes its height</h4>\n  <p><b>Live:</b> a fixed height, so the panel has empty space or clips. <b>Ours:</b> the panel is as tall as its contents.</p>\n  <p class=\"fix\"><b>Why:</b> judged a wrong implementation in live rather than a decision worth reproducing.</p>\n</div>\n\n<div class=\"learn-trap\">\n  <h4>The map is OpenStreetMap, not Google Maps</h4>\n  <p><b>Live:</b> Google Maps. <b>Ours:</b> Leaflet with OpenStreetMap tiles, and a baked raster underneath as an offline fallback.</p>\n  <p class=\"fix\"><b>Why:</b> every closer-styled tile provider requires an API key. Map <em>rendering</em> is explicitly out of scope; the overlays, boundaries, pins and layer toggles on top of it are what was matched.</p>\n</div>\n\n<div class=\"learn-trap\">\n  <h4>Numbers, names and dates are stale on purpose</h4>\n  <p><b>Live:</b> whatever the hub shows today. <b>Ours:</b> the values captured when the screen was built.</p>\n  <p class=\"fix\"><b>Why:</b> the catalogue records structure and styling, not data. Chasing live figures would mean rebuilding screens forever and would tell you nothing about the design.</p>\n</div>\n\n<div class=\"learn-trap\">\n  <h4>The hub is not the same hub</h4>\n  <p>Screens were built against one hub and later checked against another. Hub name, pincodes, order counts and boundary shapes differ.</p>\n  <p class=\"fix\"><b>Why:</b> irrelevant to what the catalogue is for. Ignore hub-specific values when comparing.</p>\n</div>\n\n<div class=\"learn-trap\">\n  <h4>States are recorded but not shown</h4>\n  <p>Each screen lists the states it can be in, but the ledger does not display them.</p>\n  <p class=\"fix\"><b>Why:</b> only some are reachable in what we render; the rest had nothing behind them. Showing them promised screens that do not exist. The data stays for when the variants are built.</p>\n</div>\n\n<div class=\"learn-trap ok\">\n  <h4>The catalogue's own chrome is not the product</h4>\n  <p>The ledger's interface \u2014 this page, the rail, the stage \u2014 uses Valmo's colours and typeface deliberately, but it is <em>not</em> part of the panel and is not held to live fidelity. Do not measure it against anything.</p>\n</div>\n\n<h3>Things that look like differences and are not</h3>\n<ul class=\"learn-rules\">\n  <li><b>Weight 500 renders as 400.</b> Live writes 500 in many places; the typeface has no 500. Not a difference \u2014 the same pixels.</li>\n  <li><b>Active sub-tabs are not bolder.</b> Colour alone marks them, in live and here. If ours looks lighter than you expect, that is correct.</li>\n  <li><b>Tables are 14px.</b> Not 15px. This surprises people who know the design system.</li>\n  <li><b>The notice fill is one step off.</b> Live uses <code>#FFEFDE</code>; the palette has <code>#FFEDDE</code>. A difference of 2/255 in green, using the palette token rather than adding a near-duplicate.</li>\n</ul>\n\n<h3>Adding to this list</h3>\n<p>If you decide not to match something, record it here in the same shape: what live does, what we do, and why. An undocumented deviation is indistinguishable from a mistake, and the next person will spend an afternoon \u201cfixing\u201d it.</p>\n", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"12\" r=\"5.5\"/><circle cx=\"15\" cy=\"12\" r=\"5.5\"/><path d=\"M19 5 5 19\"/></svg>", "track": "The craft"}, {"id": "valuable-knowns", "name": "Valuable knowns", "audience": "everyone", "summary": "Design calls that had to be corrected, and the technical traps that cost real time.", "order": 10, "html": "<p class=\"lead\">Every entry here came from something being built wrong first. Some were caught in review, some by a check that ran after the change. None were avoided by being careful, which is the point of writing them down.</p>\n\n<div id=\"vkFilter\"></div>\n\n<h3 data-scope=\"design\">Valmo panel \u2014 design calls that had to be corrected</h3>\n<p class=\"learn-note\" data-scope=\"design\">These came out of review. Each was built, looked at, found wanting, and changed. Worth reading because the same instincts produce the same misses.</p>\n\n<div class=\"learn-trap\" data-scope=\"design\">\n  <h4>The banner's inner padding was missed while everything around it was right</h4>\n  <p>The Pilot Management banner matched live on 6 of 6 outer measurements \u2014 and the gap between the image and the text was still wrong. The check had compared containers only, never the elements inside them.</p>\n  <p class=\"fix\"><b>The lesson:</b> a container can be correct to the pixel while everything inside it is wrong. Measure the children.</p>\n</div>\n\n<div class=\"learn-trap\" data-scope=\"design\">\n  <h4>A grey radio meant \u201cdisabled\u201d, not \u201cunselected\u201d</h4>\n  <p>The current area in Area Update History renders grey. Read as an ordinary selection that looks like a mistake, so it was \u201cfixed\u201d to navy. It was not a mistake: it is a <em>disabled, already-checked</em> radio \u2014 the reference area, which can never be cleared. Navy promised a choice that was not there.</p>\n  <p class=\"fix\"><b>The lesson:</b> before correcting live, work out what state it is actually expressing.</p>\n</div>\n\n<div class=\"learn-trap\" data-scope=\"design\">\n  <h4>Table dividers were treated as one table's quirk</h4>\n  <p>Vertical cell dividers were added as a variant for the Pilot Management table. Live rules <em>every</em> table it has \u2014 the dividers belong to the table component, not to a special case. Payments went without them for weeks.</p>\n  <p class=\"fix\"><b>The lesson:</b> when you find a detail on one screen, check whether it is a rule before you make it an exception.</p>\n</div>\n\n<div class=\"learn-trap\" data-scope=\"design\">\n  <h4>The footer looked wrong and the asset was innocent</h4>\n  <p>The sidebar logo read too bright against live. The instinct was to fix the image. The image was byte-identical \u2014 live applies <code>opacity: .6</code> to the whole row.</p>\n  <p class=\"fix\"><b>The lesson:</b> check the treatment before blaming the asset.</p>\n</div>\n\n<div class=\"learn-trap\" data-scope=\"design\">\n  <h4>Padding was matched at the component and missed at the edges</h4>\n  <p>The sidebar footer needed more room below the last item and above the logo than ours had. The component itself was right; the space around it inside the rail was not.</p>\n  <p class=\"fix\"><b>The lesson:</b> measure the gaps, not only the boxes.</p>\n</div>\n\n<div class=\"learn-trap\" data-scope=\"design\">\n  <h4>The spacing library was built to the design system, not to the product</h4>\n  <p>Live uses padding values the published scale does not offer. The first instinct was to snap each one to the nearest published step, which would have quietly changed every screen. The library was extended instead, with the additions marked as the product's own.</p>\n  <p class=\"fix\"><b>The lesson:</b> a token library has to cover what the product actually does, or people will bypass it.</p>\n</div>\n\n<div class=\"learn-trap\" data-scope=\"design\">\n  <h4>Tokens were nearly retired because nothing seemed to use them</h4>\n  <p>Two colours looked unused and were queued for removal. They were in use \u2014 just not where the search looked.</p>\n  <p class=\"fix\"><b>The lesson:</b> \"I could not find a usage\" is not \"there is no usage\". Keep it unless you can prove otherwise.</p>\n</div>\n\n<div class=\"learn-trap\" data-scope=\"design\">\n  <h4>States were shown that had no screens behind them</h4>\n  <p>Each screen listed its states as pills \u2014 loading, empty, AWB not found. Only some were reachable in what we render; the rest were labels with nothing behind them. The catalogue was promising screens that did not exist.</p>\n  <p class=\"fix\"><b>The lesson:</b> do not display information the tool cannot honour. Archive it until it is true.</p>\n</div>\n\n<div class=\"learn-trap ok\" data-scope=\"design\">\n  <h4>Not everything in live should be copied</h4>\n  <p>Some things were deliberately <em>not</em> matched: the hero banner is exempt from the palette because product may choose its own colours; a fixed panel height in live was judged wrong and ours stays content-sized.</p>\n  <p class=\"fix\"><b>The lesson:</b> deviate deliberately, and write it down \u2014 see <b>Deliberate differences from live</b>. An undocumented deviation is indistinguishable from a bug.</p>\n</div>\n\n<h3 data-scope=\"design\">Slipstream \u2014 design calls that had to be corrected</h3>\n<p class=\"learn-note\" data-scope=\"design\">The catalogue's own interface, corrected the same way the screens were.</p>\n\n<div class=\"learn-trap\" data-scope=\"design\">\n  <h4>The copy confirmation was put where things get missed</h4>\n  <p>It sat at the bottom of the window as a small toast \u2014 the position you use for something you do not mind being missed. It is the one message in the tool that matters, because the whole point is what you do next with what was copied. It is now a centred card, and centred on the <em>work area</em> rather than the window: centring across the rail threw it visibly left of the thing it was talking about.</p>\n  <p class=\"fix\"><b>The lesson:</b> place feedback according to how much it matters, and centre it on the region it belongs to.</p>\n</div>\n\n<div class=\"learn-trap\" data-scope=\"design\">\n  <h4>Full screen lived furthest from the thing it acts on</h4>\n  <p>The control for enlarging the prototype was in the top bar, the far corner of the page. It now also sits on the prototype's own frame \u2014 spelled out, because next to two round arrow buttons another icon reads as decoration.</p>\n  <p class=\"fix\"><b>The lesson:</b> put a control next to its object, and label it when its neighbours are already icons.</p>\n</div>\n\n<div class=\"learn-trap\" data-scope=\"design\">\n  <h4>Hierarchy was flattened in the navigation</h4>\n  <p>Modules and the screens inside them rendered at nearly the same weight, four pixels apart, with grey index numbers. Service Area read as a sibling of Payment Details. Everything was present and nothing was legible as structure.</p>\n  <p class=\"fix\"><b>The lesson:</b> if two things are different kinds of thing, they must look like different kinds of thing. Give the index colour and weight rather than letting it recede.</p>\n</div>\n\n<div class=\"learn-trap\" data-scope=\"design\">\n  <h4>Two sections were sinking out of sight as the catalogue grew</h4>\n  <p>Components and Foundations sat below the list of modules. Every module added pushed them further down, and eventually off the bottom. They now sit in a fixed menu above the scrolling tree \u2014 forty extra modules move them zero pixels.</p>\n  <p class=\"fix\"><b>The lesson:</b> anything that must stay reachable cannot live below something that grows.</p>\n</div>\n\n<div class=\"learn-trap\" data-scope=\"design\">\n  <h4>Timeline markers were centred on rows of different heights</h4>\n  <p>Markers were positioned with <code>top: 50%</code>. Rows differ in height when a title wraps, so every marker sat at a different offset from its own text and the column read as random. They are anchored to the first line now, with the connector drawn per row as two segments meeting at the marker.</p>\n  <p class=\"fix\"><b>The lesson:</b> anchor a marker to the first line of its text, never to the middle of a variable-height row. Verify by measuring each marker against its own first line \u2014 every row must return the same number.</p>\n</div>\n\n<div class=\"learn-trap\" data-scope=\"design\">\n  <h4>A pill inside a box left a white wedge</h4>\n  <p>The \u201cCurrent\u201d pill had a 16px-radius fill inside a 4px-radius outline. At the corners the fill pulled away from the outline and it read as two shapes rather than one.</p>\n  <p class=\"fix\"><b>The lesson:</b> nested radii have to agree, or the eye sees the gap before it sees the component.</p>\n</div>\n\n<div class=\"learn-trap\" data-scope=\"design\">\n  <h4>The summary repeated what was already on screen</h4>\n  <p>Above the prototype sat the screen's name, its description and a step counter \u2014 all three already visible in the breadcrumb and the strip. They pushed the prototype below the fold to say nothing new.</p>\n  <p class=\"fix\"><b>The lesson:</b> a summary should carry what is <em>not</em> visible. Repeating costs space, and space above the fold is the most expensive space you have.</p>\n</div>\n\n<div class=\"learn-trap\" data-scope=\"design\">\n  <h4>The prototype was stranded in the middle of the page</h4>\n  <p>It was centred with a fixed maximum width, so on a wide monitor it shrank as a proportion and left a dead gutter. It now runs to the edge of the work area, left-aligned with the strip and summary above it, and scales to the design width on smaller laptops rather than reflowing into a different layout.</p>\n  <p class=\"fix\"><b>The lesson:</b> size the important thing against the space available, not against a number chosen once.</p>\n</div>\n\n<div class=\"learn-trap\" data-scope=\"design\">\n  <h4>What you copied did not match what you were looking at</h4>\n  <p>Reading an old revision and pressing copy produced instructions that fetched the latest. You would look at one screen and receive another, with nothing to tell you. Every fetch is now pinned to the revision on screen.</p>\n  <p class=\"fix\"><b>The lesson:</b> when a view has state, every action taken from it must carry that state.</p>\n</div>\n\n<div class=\"learn-trap\" data-scope=\"design\">\n  <h4>Walking to the next screen left you in the past</h4>\n  <p>Selecting an old revision and then pressing next moved to a different screen while still claiming to show the old version.</p>\n  <p class=\"fix\"><b>The lesson:</b> when you add a mode, find every route out of it. Prev, next, the strip, the tree and the palette all needed the same reset.</p>\n</div>\n\n<div class=\"learn-trap\" data-scope=\"design\">\n  <h4>Numbers inside diagram blocks said nothing</h4>\n  <p>Each step in a flow diagram carried a numbered circle. The steps are already in order, left to right, so the numbers were decoration competing with the label.</p>\n  <p class=\"fix\"><b>The lesson:</b> if position already carries the information, the label is noise.</p>\n</div>\n\n<div class=\"learn-trap ok\" data-scope=\"design\">\n  <h4>The catalogue's own interface is not part of the product</h4>\n  <p>The ledger uses Valmo's colours and typeface deliberately, but nothing built only for the catalogue belongs in the Valmo library. The two share values; they do not share a system.</p>\n  <p class=\"fix\"><b>The lesson:</b> borrowing a value is fine. Adding your tool's own components to the product's design system is not.</p>\n</div>\n\n<h3 data-scope=\"design\">Valmo panel \u2014 facts about the product that surprised us</h3>\n<ul class=\"learn-rules\" data-scope=\"design\">\n  <li><b>Weight 500 does nothing.</b> Live writes it in many places, but Mier is registered only at 400, 600 and 700. The same string measures identically at 400 and 500 \u2014 treat live's 500 as 400.</li>\n  <li><b>Active sub-tabs are not bolder.</b> All three Service Area tabs are 15px Book; the active one is marked by <em>colour alone</em>.</li>\n  <li><b>Tables are 14px, not 15px.</b> Cells 400, headers 600, action links 700. The single biggest typographic fact about the panel, and not what the design system predicts.</li>\n  <li><b>Routes are not guessable.</b> <code>/captain/BEU/pilot-management</code> works; <code>/captain/BEU/service-area</code> returns 403 while <code>/captain/service-area/\u2026</code> does not. Navigate through the app's own menu rather than typing a URL you inferred.</li>\n  <li><b>Live fails sometimes, and that is not the screen.</b> The pilot table first rendered \u201chaving trouble showing this data\u201d. One retry loaded it. Retry before you record a state.</li>\n</ul>\n\n<h3 data-scope=\"design\">Valmo panel \u2014 how to measure live properly</h3>\n<ul class=\"learn-rules\" data-scope=\"design\">\n  <li>Read <b>computed styles</b>, not screenshots \u2014 and read them <em>before</em> the frame is destroyed. <code>CSSStyleDeclaration</code> is live; once the frame is gone every value reads back empty.</li>\n  <li>Measure <b>before</b> implementing, not after. The card radius was assumed 4px and is 8px; the footer rows were assumed to reuse the 48px nav metrics and are 65 and 68.</li>\n  <li>When live states a tint in <code>oklab()</code>, convert the <b>opaque</b> colour for the exact hex. Sampling the composited pixel gives a different number \u2014 <code>#C3C8D2</code> off a canvas against <code>#C3C9D4</code> converted.</li>\n  <li>Don't trust <code>getComputedStyle</code> mid-transition \u2014 it reported a chevron unrotated while the render was correct. For anything animated, check pixels.</li>\n  <li>Walk the <b>full DOM depth</b>. A segmented filter's outer stroke was missed because the check stopped at three levels and live's container sits at the fourth.</li>\n  <li>Wait for map tiles to actually paint before capturing. Called out twice.</li>\n  <li>Superimpose live's measured boxes over the render and <b>look</b>. Numbers agreeing is not the same as it looking right.</li>\n  <li>Verify the <b>deployed</b> page after merging, not only the local one.</li>\n</ul>\n\n<h3 data-scope=\"tech\">The technical traps</h3>\n<p data-scope=\"tech\" class=\"learn-note\">These are not specific to either product: they are the ways HTML, CSS and tooling lie to you quietly. None of them produced an error message, and none were avoided by being careful \u2014 each was found by a check that ran afterwards.</p>\n\n<div data-scope=\"tech\" class=\"learn-trap\">\n  <h4>An unterminated CSS comment ate the entire spacing scale</h4>\n  <p>A generated token block was missing its <code>*/</code>. Every <code>var()</code> after it became invalid, so padding collapsed to zero \u2014 a button went 36px to 22px, a tab bar 38px to 20px \u2014 and the page still looked <em>plausible</em>. Nothing errored.</p>\n  <p class=\"fix\"><b>Do this:</b> after any CSS edit, check that every <code>var(--vp\u2026)</code> used is defined and that <code>/*</code> and <code>*/</code> balance. Run it <em>after</em> the edit \u2014 running it before is what let this through.</p>\n</div>\n\n<div data-scope=\"tech\" class=\"learn-trap\">\n  <h4>A spacing token that did not exist deleted a whole declaration</h4>\n  <p><code>--vpSpacingInline20</code> was used but never defined. CSS does not warn; it discards the entire <code>gap</code> line. The banner copy sat 20px off with no sign of why.</p>\n  <p class=\"fix\"><b>Do this:</b> an undefined custom property is not a small bug \u2014 it removes the whole declaration. Now that every distance routes through tokens, this is the most likely failure mode, and it fails invisibly.</p>\n</div>\n\n<div data-scope=\"tech\" class=\"learn-trap\">\n  <h4>Writing one file and reading the other reverted three icons</h4>\n  <p>The catalogue exists as <code>data-seed.json</code> <em>and</em> as a copy embedded in the ledger. Updating one and then reading the other silently restored old values.</p>\n  <p class=\"fix\"><b>Do this:</b> never write one without the other. <code>import_screen.py</code> does both; <code>check_v2_sync.py</code> fails if they drift.</p>\n</div>\n\n<div data-scope=\"tech\" class=\"learn-trap\">\n  <h4>Inline styles quietly beat the component</h4>\n  <p>Twice: a <code>height:14px</code> capping the footer logo, and <code>width/height: fit-content</code> on the search field. The component CSS was correct; something more specific was winning.</p>\n  <p class=\"fix\"><b>Do this:</b> when a property refuses to take, grep the markup for an inline override before touching the stylesheet.</p>\n</div>\n\n<div data-scope=\"tech\" class=\"learn-trap\">\n  <h4>A class name collision made the later rule win</h4>\n  <p><code>.vp-downloadbtn</code> already existed elsewhere and was defined further down the sheet, so it beat the new button that reused the name. Specificity bites the same way: <code>.vp-pageheader h3</code> outranks a bare <code>.vp-heading1</code>, which is why the type utilities are scoped.</p>\n  <p class=\"fix\"><b>Do this:</b> grep for a class name before you invent it, and scope utilities so intent is not decided by source order.</p>\n</div>\n\n<div data-scope=\"tech\" class=\"learn-trap\">\n  <h4>Stroke width multiplied for no reason</h4>\n  <p>The map polygons carry <code>vector-effect=\"non-scaling-stroke\"</code>, which means the width is <em>already</em> in screen pixels. Scaling it made every boundary four times too heavy. Separately, geometry clipped to a fixed viewport looked fine as a static image and became a hard rectangle the moment the map could be panned.</p>\n  <p class=\"fix\"><b>Do this:</b> read the attributes on the element before transforming its numbers, and test drawn geometry in the interaction it will actually live in.</p>\n</div>\n\n<div data-scope=\"tech\" class=\"learn-trap\">\n  <h4>A 50-marker splice dropped one closing tag</h4>\n  <p>The entire side panel ended up nested inside a hidden layer and vanished. Eyeballing it was fooled by the last marker's own closing tag; counting found it \u2014 193 opens against 192 closes.</p>\n  <p class=\"fix\"><b>Do this:</b> after generated-markup edits, count tags programmatically and assert. Balance <code>&lt;div&gt;</code> against <code>&lt;/div&gt;</code>, and <code>/*</code> against <code>*/</code>.</p>\n</div>\n\n<div data-scope=\"tech\" class=\"learn-trap\">\n  <h4>Hiding with <code>!important</code> broke the layer toggles</h4>\n  <p>A map layer was hidden with <code>display: none !important</code> \u2014 but <code>display</code> was also what the checkbox used to carry its state. The boxes flipped and the map never changed.</p>\n  <p class=\"fix\"><b>Do this:</b> never style the property that is also holding the state.</p>\n</div>\n\n<div data-scope=\"tech\" class=\"learn-trap\">\n  <h4>A CSS fill beat the element's own attribute</h4>\n  <p>Diagram labels written <code>fill=\"#fff\"</code> rendered navy-on-navy, because a stylesheet rule setting <code>fill</code> outranks a presentation attribute. Unreadable, with nothing in the console.</p>\n  <p class=\"fix\"><b>Do this:</b> presentation attributes lose to CSS. Use a class \u2014 and verify contrast by reading back the rendered colour, not the markup you wrote.</p>\n</div>\n\n<div data-scope=\"tech\" class=\"learn-trap\">\n  <h4>Two megabytes of the same stylesheet, twice over</h4>\n  <p>Every screen inlined its own copy of the design system, and 62% of the catalogue file was 27 identical copies of the same CSS. A one-line change rewrote 34 files, and <b>53% of the commits touching a screen never changed that screen</b> \u2014 which is what made per-screen version history unusable until it was fixed.</p>\n  <p class=\"fix\"><b>Do this:</b> when a diff is suspiciously wide, ask what is being duplicated. Deduplicating is not only tidiness \u2014 it is what made history readable.</p>\n</div>\n\n<div data-scope=\"tech\" class=\"learn-trap\">\n  <h4>A change was made and what it orphaned was left behind</h4>\n  <p>A replaced page band left <code>.vp-pageheader</code> and <code>.vp-sa-title</code> as dead CSS, and a whole component no screen used sat next to its replacement with the wrong title size. Screens also went on naming the retired component in their metadata \u2014 which is what the catalogue reads, so a stale name there is worse than a stale file.</p>\n  <p class=\"fix\"><b>Do this:</b> after a replacement, search for the old name in CSS, in markup <em>and</em> in metadata. The export prunes what the catalogue no longer has, and fails on an <code>&lt;img&gt;</code> with no <code>src</code>.</p>\n</div>\n\n<div data-scope=\"tech\" class=\"learn-trap\">\n  <h4>Squash-merging a stacked pull request closed its child</h4>\n  <p>Squashing deletes the base branch, which auto-closes the PR built on top of it \u2014 and a closed PR's base cannot be retargeted, so the work has to be reopened somewhere new.</p>\n  <p class=\"fix\"><b>Do this:</b> merge the base, rebase the child onto <code>main</code>, then merge. Or use a merge commit.</p>\n</div>\n\n<div data-scope=\"tech\" class=\"learn-trap\">\n  <h4>A structural check run against a JavaScript application reported nonsense</h4>\n  <p>The ledger deliberately writes <code>'&lt;' + '/script&gt;'</code>, sets <code>src</code> at runtime, and has <code>/*</code> inside strings. An HTML-shaped regex flagged all of it.</p>\n  <p class=\"fix\"><b>Do this:</b> verify a running application by running it, not by pattern-matching its source.</p>\n</div>\n\n<h3 data-scope=\"tech\">The one process lesson</h3>\n<p data-scope=\"tech\">Almost every technical item above was found by a check that ran <em>after</em> the change, not by care taken before it. Writing carefully does not catch a missing <code>*/</code>. Running the guard does. And almost every design item was found by someone else looking \u2014 which is the argument for the review step, not against it.</p>", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3 21.5 19.5H2.5L12 3Z\"/><path d=\"M12 10v4\"/><circle cx=\"12\" cy=\"16.8\" r=\".7\" fill=\"currentColor\"/></svg>", "track": "The craft", "title": "Valuable knowns to avoid mistakes!", "flag": "Important"}, {"id": "scaleable", "name": "How this is scaleable", "audience": "everyone", "summary": "Nothing here is Valmo-specific. What transfers, in what order, and where it is not worth it.", "order": 11, "html": "<p class=\"lead\">Nothing in the machinery is specific to Valmo. The screens are, the tokens are \u2014 but the arrangement that produces them is a method, and it transfers to any panel you can open in a browser.</p>\n\n<p>What makes it portable is that the ledger never assumes a design tool, a component framework, or access to the original source. It only assumes the product exists somewhere you can look at it.</p>\n\n<h3>What is reusable, and what you replace</h3>\n<div class=\"learn-two\">\n  <div class=\"learn-cell good\"><b>Reuse as-is</b><span>The export pipeline, the importer, the CI check, the pull commands, the ledger UI itself, the version history, the whole contribution loop. None of it knows what product it is holding.</span></div>\n  <div class=\"learn-cell warn\"><b>Replace per product</b><span>The foundations (that product's type, colour, spacing), its components, its screens, its fonts. That is the work \u2014 and it is the only work.</span></div>\n</div>\n\n<h3>The order that works</h3>\n<p>This sequence matters. Doing it the other way round \u2014 screens first, foundations later \u2014 means going back and re-doing every screen once the tokens exist.</p>\n\n<figure class=\"learn-fig\">\n<svg viewBox=\"0 0 680 210\" role=\"img\" aria-label=\"five steps: measure foundations, build components, build one screen, wire the flow, then repeat per module\">\n  <defs><marker id=\"a5arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\">\n    <path d=\"M0,1 L7,4 L0,7 Z\" fill=\"#93A1B8\"/></marker></defs>\n  <g>\n    <rect x=\"10\" y=\"40\" width=\"116\" height=\"86\" rx=\"10\" fill=\"#EDF2FF\" stroke=\"#C7DCFF\"/>\n    <text x=\"68\" y=\"86\" class=\"dg-t\">Foundations</text>\n    <text x=\"68\" y=\"105\" class=\"dg-s\">measure the real</text>\n    <text x=\"68\" y=\"120\" class=\"dg-s\">type, colour, spacing</text>\n  </g>\n  <line x1=\"130\" y1=\"83\" x2=\"152\" y2=\"83\" stroke=\"#93A1B8\" stroke-width=\"1.5\" marker-end=\"url(#a5arrow)\"/>\n  <g>\n    <rect x=\"158\" y=\"40\" width=\"116\" height=\"86\" rx=\"10\" fill=\"#fff\" stroke=\"#DDE3ED\"/>\n    <text x=\"216\" y=\"86\" class=\"dg-t\">Components</text>\n    <text x=\"216\" y=\"105\" class=\"dg-s\">built only from</text>\n    <text x=\"216\" y=\"120\" class=\"dg-s\">step 1's values</text>\n  </g>\n  <line x1=\"278\" y1=\"83\" x2=\"300\" y2=\"83\" stroke=\"#93A1B8\" stroke-width=\"1.5\" marker-end=\"url(#a5arrow)\"/>\n  <g>\n    <rect x=\"306\" y=\"40\" width=\"116\" height=\"86\" rx=\"10\" fill=\"#fff\" stroke=\"#DDE3ED\"/>\n    <text x=\"364\" y=\"86\" class=\"dg-t\">One screen</text>\n    <text x=\"364\" y=\"105\" class=\"dg-s\">prove the loop</text>\n    <text x=\"364\" y=\"120\" class=\"dg-s\">end to end</text>\n  </g>\n  <line x1=\"426\" y1=\"83\" x2=\"448\" y2=\"83\" stroke=\"#93A1B8\" stroke-width=\"1.5\" marker-end=\"url(#a5arrow)\"/>\n  <g>\n    <rect x=\"454\" y=\"40\" width=\"116\" height=\"86\" rx=\"10\" fill=\"#fff\" stroke=\"#DDE3ED\"/>\n    <text x=\"512\" y=\"86\" class=\"dg-t\">The flow</text>\n    <text x=\"512\" y=\"105\" class=\"dg-s\">wire click-through</text>\n    <text x=\"512\" y=\"120\" class=\"dg-s\">between screens</text>\n  </g>\n  <line x1=\"574\" y1=\"83\" x2=\"596\" y2=\"83\" stroke=\"#93A1B8\" stroke-width=\"1.5\" marker-end=\"url(#a5arrow)\"/>\n  <g>\n    <rect x=\"602\" y=\"40\" width=\"68\" height=\"86\" rx=\"10\" fill=\"#092D5E\"/>\n    <text x=\"636\" y=\"86\" class=\"dg-t inv\">Repeat</text>\n    <text x=\"636\" y=\"105\" class=\"dg-s inv\">per module</text>\n  </g>\n  <rect x=\"158\" y=\"156\" width=\"412\" height=\"36\" rx=\"8\" fill=\"#FFEDDE\" stroke=\"#EC7600\"/>\n  <text x=\"364\" y=\"179\" class=\"dg-s\" fill=\"#8a4a00\">screens first, foundations later = every screen re-done once the tokens arrive</text>\n</svg>\n</figure>\n\n<h3>Getting started on a new panel</h3>\n\n<p><b>1. Fork the machinery, empty the contents.</b> Take <code>scripts/</code>, the ledger shell, and the CI check. Empty <code>data-seed.json</code> down to <code>{\"flows\": [], \"screens\": [], \"components\": [], \"icons\": {}}</code>. You now have a working, empty ledger.</p>\n\n<p><b>2. Find the real values before drawing anything.</b> Open the product, read computed styles off the live pages \u2014 not screenshots. Group what you find: how many distinct font sizes are actually in use? How many greys? Most products have fewer real values than they think, and a handful of accidents. Write the accidents down; do not silently fix them.</p>\n\n<p><b>3. Check whether the company already has a design system.</b> If it does, reproduce it faithfully and record every place the live product disagrees with it. Those disagreements are the most valuable output of the whole exercise \u2014 they are the backlog nobody had written down.</p>\n\n<p><b>4. Do one screen completely before starting a second.</b> The first screen is where you discover that your spacing scale is missing a step, that the typeface has no 500 weight, that a component needs a variant. Finding that once is cheap; finding it after six screens means redoing six screens.</p>\n\n<p><b>5. Wire the flow, then hand it to someone else.</b> The test of a ledger is not whether it looks right to the person who built it. It is whether a second person can copy a screen and start working without asking a question.</p>\n\n<h3>What to expect</h3>\n<ul class=\"learn-rules\">\n  <li><b>Foundations take longer than you think, and everything after is faster than you think.</b> The first module is mostly foundation work wearing a screen's clothes.</li>\n  <li><b>Maps, charts and canvases are the expensive parts.</b> Plain pages are quick. Anything with its own rendering engine needs a decision: reproduce it, or fake it convincingly and say so.</li>\n  <li><b>Real data is a liability.</b> Decide early whether the catalogue carries real names and numbers, because it determines whether the repo can be public.</li>\n  <li><b>The value shows up at the second module, not the first.</b> One screen in a catalogue is a screenshot with extra steps. The compounding starts when a foundation change moves twenty screens at once.</li>\n</ul>\n\n<h3>Where it would not be worth it</h3>\n<p>If the product already has a maintained, trusted component library that engineering actually builds from, a ledger is duplicated effort \u2014 point people at the library instead. This is worth doing when the gap between the design system and the shipped product is real, unmeasured, and costing people time.</p>\n", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20V9M4 9h11\"/><path d=\"M8.5 5.5 4 9l4.5 3.5\" transform=\"rotate(-45 4 9)\"/><rect x=\"12\" y=\"12\" width=\"4\" height=\"4\" rx=\"1\"/><rect x=\"17\" y=\"7\" width=\"4\" height=\"4\" rx=\"1\"/><rect x=\"17\" y=\"17\" width=\"4\" height=\"4\" rx=\"1\"/></svg>", "track": "Reference"}, {"id": "for-engineers", "name": "For engineers", "audience": "engineers", "summary": "Data model, build, CSS contract, version history, CI, and what will bite you.", "order": 12, "html": "<p class=\"lead\">The short version: a static site generated from one JSON file by one Python script, with no framework, no build step beyond that script, and no runtime dependencies on the screens themselves.</p>\n\n<h3>Data model</h3>\n<pre class=\"learn-code\">source/data-seed.json\n\u251c\u2500 flows[]       { id, name, order, description }\n\u251c\u2500 screens[]     { id, flowId, order, name, description,\n\u2502                  states[], components[], tags[], code }   \u2190 code is the markup\n\u251c\u2500 components[]  { id, name, category, description, sizing, html }\n\u2514\u2500 icons{}       { key: \"data:image/svg+xml;base64,\u2026\" }</pre>\n<p><code>screens[].code</code> is the whole payload \u2014 a screen is its markup. Icons are referenced inside it as <code>data-icon=\"key\"</code> and resolved at export time to real files under <code>assets/icons/</code>, or at runtime to data URIs when the ledger renders a preview.</p>\n\n<h3>Build</h3>\n<p><code>scripts/export_to_github.py</code> is the only build step. It is pure and idempotent \u2014 same input, same bytes out \u2014 which is what lets CI assert reproducibility. It writes <code>index.html</code>, <code>screens/</code>, <code>components/</code>, <code>assets/</code> and <code>manifest.json</code>, and prunes anything the catalogue no longer lists.</p>\n<p>Two hard failures worth knowing: an <code>&lt;img&gt;</code> exported without a <code>src</code> aborts the build, and a literal closing script tag anywhere in the seed aborts it too \u2014 that would terminate the <code>&lt;script id=\"seed-data\"&gt;</code> element and break every embedding page.</p>\n\n<h3>The CSS contract</h3>\n<p>One stylesheet, <code>assets/kit.css</code>, extracted verbatim from the <code>&lt;style&gt;</code> block in <code>source/flow-ledger.html</code>. Screens and components link it; nothing inlines it. Its font URLs are relative to <code>assets/</code>, which is where it lives, so they resolve from any depth \u2014 do not \"fix\" them to <code>../assets/fonts/</code>.</p>\n<p>Inside it, three token layers:</p>\n<pre class=\"learn-code\">--vpValmoBlue: #2A67FF;          /* palette: what a value IS   */\n--vpBrand: var(--vpValmoPrimaryDark);  /* semantic: what it is FOR */\n.vp-btn { font: var(--vpButtonText2); }  /* usage: never a literal */</pre>\n<p>Type is applied with the <code>font</code> shorthand so family, size, weight and line-height arrive as one checkable declaration. Utilities are scoped <code>.vp-scope .vp-&lt;name&gt;</code> because a bare class loses to <code>.vp-pageheader h3</code> on specificity.</p>\n\n<h3>Screens are inert</h3>\n<p>No framework, no bundler, no hydration. Interactions are inline <code>onclick</code> handlers, deliberately: a literal <code>&lt;/script&gt;</code> in screen markup would close the seed element, so screens carry no script tags at all. Click-through between screens is a <code>data-goto</code> attribute plus one delegated listener injected at export time.</p>\n<p>Map screens are the exception: they get vendored Leaflet from <code>assets/vendor/</code> and <code>sa-map.js</code>, which reads the SVG overlays already in the page, projects them back to lat/lng, and hands them to Leaflet. If tiles cannot load, the baked raster underneath stays visible.</p>\n\n<h3>Version history</h3>\n<p><code>scripts/build_versions.py</code> walks git and writes <code>versions.json</code>. A commit counts as a version of a screen only if it changed that screen's own content region \u2014 everything from <code>&lt;div class=\"vp-content</code> onward \u2014 which excludes the sidebar every screen duplicates. Entries are labelled <code>screen</code> / <code>module</code> / <code>sweep</code> by how many screen files the commit touched.</p>\n<p>It is baked rather than queried at runtime because the unauthenticated GitHub API allows 60 requests an hour and answering the question costs one call per commit. It is fetched rather than embedded so it does not churn the seed, and it is deliberately <em>not</em> part of the export \u2014 it changes with every commit and would fight the CI reproducibility check. Regenerate it when you want history refreshed.</p>\n\n<h3>CI</h3>\n<pre class=\"learn-code\">.github/workflows/verify.yml\n  1. rebuild from source/\n  2. fail if the committed output differs   \u2190 the drift guard\n  3. check_v2_sync.py: embedded seed == data-seed.json\n  4. every page links the stylesheet, no img without src,\n     no missing asset, no component carrying a kit copy</pre>\n<p>Step 2 is the one that matters. Without it the site can silently disagree with the thing people edit, and the Vercel preview on a pull request shows the previous build while the diff claims otherwise.</p>\n\n<h3>Things that will bite you</h3>\n<ul class=\"learn-rules\">\n  <li><b>The seed exists twice</b> \u2014 as <code>data-seed.json</code> and as a copy embedded in <code>flow-ledger.html</code> so the file opens by double-click. Write both or neither. <code>check_v2_sync.py</code> enforces it.</li>\n  <li><b>The embedded copy is pretty-printed on purpose.</b> It used to be one 2.7-million-character line, which made every diff unreviewable.</li>\n  <li><b>Per-component CSS copies are gone and should stay gone.</b> They were 62% of the seed \u2014 27 identical copies of the same kit. CI fails if one comes back.</li>\n  <li><b>Structural regexes produce false positives on <code>index.html</code></b> \u2014 it writes <code>'&lt;' + '/script&gt;'</code>, sets <code>src</code> at runtime, and has <code>/*</code> inside strings. Verify it functionally instead.</li>\n</ul>\n", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8.5 8.5 4.5 12l4 3.5\"/><path d=\"M15.5 8.5 19.5 12l-4 3.5\"/><path d=\"M13.3 5.5 10.7 18.5\"/></svg>", "track": "Reference"}, {"id": "glossary", "name": "Glossary", "audience": "everyone", "summary": "Every term used in these guides, including the Valmo domain words.", "order": 13, "html": "<p class=\"lead\">Terms used across these guides and in the repo. Roughly half are about this tool; the rest are Valmo domain words that a designer joining the team will not have met.</p>\n\n<h3>The catalogue</h3>\n<div class=\"learn-defs\">\n  <div><b>Flow</b><span>One journey through the product, as a sequence of screens \u2014 Captain Payments, Service Area, Pilot Management. Also called a module.</span></div>\n  <div><b>Screen</b><span>One page of the product, reproduced as live HTML. The unit you copy.</span></div>\n  <div><b>Component</b><span>A reusable part a screen is built from \u2014 the sidebar, a data table, a map panel. 27 of them.</span></div>\n  <div><b>Foundation</b><span>The rules everything obeys: typography, colour, spacing.</span></div>\n  <div><b>Stage</b><span>The framed area in the middle of the ledger where the live screen runs.</span></div>\n  <div><b>Pull command</b><span>The block of instructions the Copy buttons put on your clipboard.</span></div>\n</div>\n\n<h3>Design system</h3>\n<div class=\"learn-defs\">\n  <div><b>Token</b><span>A named value used instead of a literal \u2014 <code>var(--vpBrand)</code> rather than <code>#092D5E</code>.</span></div>\n  <div><b>Palette token</b><span>What a value <em>is</em>. <code>--vpValmoBlue: #2A67FF</code>.</span></div>\n  <div><b>Semantic token</b><span>What a value is <em>for</em>. <code>--vpBrand: var(--vpValmoBlue)</code>. This is the layer screens use.</span></div>\n  <div><b>The kit</b><span>The single stylesheet holding the foundations and every component rule. Ships as <code>assets/kit.css</code>.</span></div>\n  <div><b>Crystal</b><span>Meesho's design system, the source of the type scale and most of the palette.</span></div>\n  <div><b>Mier B02</b><span>The panel's actual typeface. Registered at 400 (Book), 600 (Demi) and 700 (Bold) \u2014 there is no 500.</span></div>\n  <div><b>Fidelity</b><span>How closely a screen matches the live product, measured rather than judged.</span></div>\n</div>\n\n<h3>Repo and build</h3>\n<div class=\"learn-defs\">\n  <div><b>The seed</b><span><code>source/data-seed.json</code> \u2014 the catalogue itself. Every screen's markup lives inside it.</span></div>\n  <div><b>Export</b><span>The script that turns the seed into the website. Deterministic: same input, same bytes.</span></div>\n  <div><b>Generated</b><span>Any file the export writes. Never hand-edited.</span></div>\n  <div><b>Import</b><span>Folding an edited screen file back into the seed, with <code>scripts/import_screen.py</code>.</span></div>\n  <div><b>CI</b><span>The automated checks that run on every pull request. Continuous integration.</span></div>\n  <div><b>Preview deployment</b><span>A complete copy of the site built from a pull request, at its own link, for review.</span></div>\n  <div><b>Repository</b><span>The project folder on GitHub, with full history.</span></div>\n  <div><b>Commit</b><span>A saved change with a note attached.</span></div>\n  <div><b>Branch</b><span>A private copy of the project where you work without affecting anyone else.</span></div>\n  <div><b>Pull request (PR)</b><span>A proposal: \u201chere is what I changed, please review and merge\u201d.</span></div>\n</div>\n\n<h3>Version history</h3>\n<div class=\"learn-defs\">\n  <div><b>Revision</b><span>A past version of a screen you can load into the stage and look at.</span></div>\n  <div><b>screen scope</b><span>A change that touched only that one screen \u2014 a decision about it.</span></div>\n  <div><b>module scope</b><span>A change that touched a few screens.</span></div>\n  <div><b>sweep scope</b><span>A change that touched every screen \u2014 a foundation, the sidebar, the export.</span></div>\n</div>\n\n<h3>Valmo domain terms</h3>\n<p>Words like <i>captain</i>, <i>pilot</i>, <i>DC</i>, <i>BEU</i> and <i>AWB</i> belong here too, and a designer joining the team will need them. They are held back until someone who works with them daily has checked the definitions \u2014 a glossary that is confidently wrong teaches the wrong thing to exactly the person least able to spot it.</p>\n", "icon": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4.5 5.5h15M4.5 10h15M4.5 14.5h10M4.5 19h7\"/></svg>", "track": "Reference"}]}</script>

<script>
(function () {
  var state = { flows: [], screens: [], components: [], learn: [], icons: {}, activeFlow: null, activeScreenIndex: 0, db: null, view: "flows", versions: null, atVersion: null };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function toast(msg, opts) {
    opts = opts || {};
    var t = document.getElementById("toast");
    document.getElementById("toastMsg").textContent = msg;
    document.getElementById("toastSub").textContent = opts.sub || "";
    t.classList.add("show");
    clearTimeout(t._h);
    if (!opts.persistent) {
      t._h = setTimeout(function () { t.classList.remove("show"); }, 3200);
    }
  }
  function dismissToast() {
    var t = document.getElementById("toast");
    clearTimeout(t._h);
    t.classList.remove("show");
  }
  document.getElementById("toastClose").addEventListener("click", dismissToast);
  // it covers the page, so give it the two ways out people expect from one
  document.getElementById("toast").addEventListener("click", function (e) {
    if (e.target.id === "toast") dismissToast();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && document.getElementById("toast").classList.contains("show")) dismissToast();
  });

  var COPIED_TOAST_OPTS = { sub: "Paste it into a new Claude CODE chat and start working.", persistent: true };

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast("Copied — paste into a new Claude CODE chat", COPIED_TOAST_OPTS); },
        function () { fallbackCopy(text); });
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast("Copied — paste into a new Claude CODE chat", COPIED_TOAST_OPTS); }
    catch (e) { toast("Copy failed — select and copy manually"); }
    document.body.removeChild(ta);
  }

  var SOT_REPO = "https://github.com/yashparashar-meesho/Valmo-captain-panel-SoT.git";
  var SOT_REPO_SLUG = "yashparashar-meesho/Valmo-captain-panel-SoT";

  // Service Area is a map module: the pull ships the baked raster so the screen is
  // correct and self-contained offline, and this last step turns on the live map.
  function mapNote(ids) {
    var maps = ids.filter(function (i) { return i.indexOf("service-area") === 0; });
    if (!maps.length) return [];
    return [
      "",
      "Last step — the map. " + (maps.length > 1 ? "These screens are" : "This screen is") +
        " a map module, and what you just fetched renders the map as a baked static image " +
        "(assets/icons/img_sa_basemap.jpg). That is deliberate: it makes the screen correct " +
        "and self-contained with no network. The service-area boundary, the DC pins and the " +
        "shipment markers are real overlays on top of it, and the layer checkboxes already work.",
      "To turn that static image into a live, pannable Leaflet map, fetch three more files " +
        "into `<folder>/assets/vendor/`: `leaflet.js`, `leaflet.css` and `sa-map.js` (same " +
        "`gh api ... /contents/assets/vendor/<file>` call as the icons). Nothing else changes " +
        "— the screen already links them, so they light up as soon as they exist. `sa-map.js` " +
        "reads the overlays already in the page, projects them back to real lat/lng and hands " +
        "them to Leaflet with OpenStreetMap tiles.",
      "If you skip this, or the machine is offline, the screen still renders exactly as " +
        "fetched — the baked map stays and nothing breaks. Mention to me which of the two you " +
        "ended up with."
    ];
  }

  /* If you are reading an old revision, the copy must hand over that revision.
     Fetching main while the stage shows something else is a silent mismatch:
     you would look at one screen and receive another, and never be told. */
  function pinToVersion(text) {
    var sha = state.atVersion;
    if (!sha) return text;
    var short = sha.slice(0, 7);
    text = text.replace(/(\/contents\/[^\s`"]+?)( --jq)/g, "$1?ref=" + sha + "$2");
    text = text.replace(/git clone --depth 1 --filter=blob:none --sparse/g,
                        "git clone --filter=blob:none --sparse");
    text = text.replace(/then `git -C <tmp> sparse-checkout set/g,
                        "then `git -C <tmp> checkout " + sha + "` and `git -C <tmp> sparse-checkout set");
    return "IMPORTANT \u2014 this is revision " + short + ", not the current version. Every " +
      "fetch below is pinned to that commit with ?ref=" + short + ", so what you get is what I " +
      "was looking at. If you want the current version instead, say so and drop the ref.\n\n" +
      text +
      "\n\nNote on fallback method B: it reads the deployed page, which is always the current " +
      "version, so it cannot give you revision " + short + ". If you end up on method B, tell me " +
      "\u2014 you will have the latest rather than what I asked for.";
  }

  function pullCommand(screen) {
    var url = window.location.href;
    var lines = [
      'Pull screen "' + screen.name + '" (doc id: ' + screen.id + ') for the Valmo Partner captain panel.',
      "Primary method — fetch only this screen's files, not the whole repo (this repo is private and will keep growing with more flows/screens, so don't `git clone` it — that pulls every screen and component every time regardless of what was actually asked for):",
      "1. Ask me which folder to save into — use the AskUserQuestion tool if you have it (a real question box with an input, not just a plain chat message), so this is a consistent, clear prompt every time.",
      "2. Create `<folder>/screens/`, `<folder>/assets/icons/` and `<folder>/assets/fonts/` subfolders (that mirrors the repo's own layout, which is what the screen file's relative icon and font paths expect).",
      "3. Fetch just `screens/" + screen.id + ".html` from the private repo `" + SOT_REPO_SLUG + "` — with the `gh` CLI (already authenticated the same way it would be for a git clone): `gh api repos/" + SOT_REPO_SLUG + "/contents/screens/" + screen.id + ".html --jq .content | base64 -d > <folder>/screens/" + screen.id + ".html`. If `gh` isn't available but plain `git` is, use a sparse+shallow clone instead so you still only pull this one file plus its icons, fonts and stylesheet, not the whole repo: `git clone --depth 1 --filter=blob:none --sparse " + SOT_REPO + " <tmp>` then `git -C <tmp> sparse-checkout set screens/" + screen.id + ".html assets/icons assets/fonts assets/kit.css`, copy what you need out, then delete `<tmp>`. If neither works, stop and fall back to method B below, and tell me you're doing so and why.",

  function flowPullCommand(flow, screens) {
    var url = window.location.href;

    var order = screens.map(function (s) { return s.id; }).join(" → ");
    var pathList = screens.map(function (s) { return "screens/" + s.id + ".html"; }).join(" ");
    var lines = [
      'Pull the entire "' + flow.name + '" flow (all ' + screens.length + ' screens, in order: ' + order + ') for the Valmo Partner captain panel.',
