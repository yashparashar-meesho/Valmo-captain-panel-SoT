<meta charset="utf-8">
<title>Slipstream — start where the last person finished</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- The catalog chrome's own typeface. Loaded non-render-blocking on purpose: if
     Google Fonts is slow, blocked by a proxy, or simply unreachable offline, a plain
     stylesheet link holds up first paint until it times out. This paints immediately
     in the fallback stack and upgrades when (if) the font arrives. -->
<link rel="stylesheet" media="print" onload="this.media='all'; this.onload=null"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"></noscript>
<style>
  /* ============================================================
     FLOW LEDGER — catalog chrome, v2

     Light only, and deliberately so: this catalogs a light product, and a
     dark chrome would fight the screens it frames.

     Identity comes from what it documents. The accent is Valmo Blue (#2A67FF)
     on Valmo navy (#092D5E) — the panel's own colours — and the headings are
     set in Mier B02, the panel's real typeface, which already ships in
     assets/fonts for the kit. IBM Plex Sans carries the UI, Plex Mono the ids
     and tokens. Nothing here is borrowed from a generic dashboard palette.

     The page is a cool grey-blue so a white stage floats off it; the stage
     carries the only heavy shadow on the page, because it is the only thing
     that matters.
     ============================================================ */
  :root {
    --bg:          #E8ECF3;
    --bg-deep:     #DFE5EF;
    --surface:     #FFFFFF;
    --sunken:      #F4F6FA;
    --ink:         #0A1E3C;
    --ink-2:       #40536F;
    --muted:       #6B7C96;
    --faint:       #93A1B8;
    --line:        #DDE3ED;
    --line-2:      #C8D2E0;
    --navy:        #092D5E;
    --blue:        #2A67FF;
    --blue-ink:    #FFFFFF;
    --blue-soft:   #EDF2FF;
    --blue-line:   #C7DCFF;
    --amber:       #EC7600;
    --amber-soft:  #FFEDDE;
    --green:       #1A7D3A;
    --violet:      #5B3FD6;
    --violet-soft: #EEEAFD;

    --r-xs: 4px;
    --r-sm: 6px;
    --r:    10px;
    --r-lg: 14px;

    --sh-1: 0 1px 2px rgba(9,45,94,.05), 0 2px 6px rgba(9,45,94,.05);
    --sh-2: 0 1px 2px rgba(9,45,94,.05), 0 8px 20px rgba(9,45,94,.09);
    --sh-pop: 0 8px 24px rgba(9,45,94,.14), 0 24px 60px rgba(9,45,94,.16);
    /* the stage is the hero: three layers so the falloff reads as depth, not blur */
    --sh-stage: 0 2px 4px rgba(9,45,94,.05),
                0 16px 32px rgba(9,45,94,.12),
                0 44px 80px rgba(9,45,94,.10);

    --ui:   "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --display: "Mier B02", "Mier Fallback", "IBM Plex Sans", system-ui, sans-serif;

    --spine-w: 268px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font: 400 14px/1.5 var(--ui);
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--blue-line); color: var(--navy); }

  :focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
    border-radius: var(--r-xs);
  }

  .app {
    display: grid;
    grid-template-columns: var(--spine-w) 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ---------------------------------------------------------- spine
     One rail is the whole navigation. Flows, Components and Foundations are
     sections of a single tree rather than three modes behind a switcher, so
     everything the catalog holds is visible at once and a screen is one
     click from anywhere. */
  .spine {
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .spine-brand {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--line);
  }
  .spine-brand h1 {
    font: 700 19px/1.2 var(--display);
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--navy);
  }
  /* No draft on the name either - it either flew in from the splash or it was
     already introduced on a previous visit. The shell's own landing is what
     gives the page its arrival now; the lockup just rides along with it. */

  /* Arrival. The three regions of the shell settle in over half a second, the
     rail first and the work area last, each moving a few pixels towards where
     it belongs rather than appearing from nowhere. It reads as the page
     landing instead of being switched on.

     Only a `from` keyframe: the end state is whatever the stylesheet already
     says, so nothing is left behind when the animation finishes. That matters
     here - `backwards` rather than `both` means no residual `transform` stays
     on these containers, and a transformed ancestor would quietly become the
     containing block for anything positioned inside the stage.

     These three elements are part of the static shell and are never
     re-created, so this plays once on load and never on a re-render. */
  @media (prefers-reduced-motion: no-preference) {
    html.landing .spine  { animation: land-in-rail .5s  cubic-bezier(.16,.84,.26,1)      backwards; }
    html.landing .topbar { animation: land-in-top  .5s  cubic-bezier(.16,.84,.26,1) .07s backwards; }
    html.landing .main   { animation: land-in-work .58s cubic-bezier(.16,.84,.26,1) .14s backwards; }
  }
  @keyframes land-in-rail { from { opacity: 0; transform: translateX(-10px); } }
  @keyframes land-in-top  { from { opacity: 0; transform: translateY(-8px); } }
  @keyframes land-in-work { from { opacity: 0; transform: translateY(12px); } }

  /* The arrival, when it is someone's first time.

     Not a splash in the usual sense - nothing is hidden behind it and nothing
     is waited for. The name simply starts large and centred, says what it
     means, and then flies to the exact spot it occupies in the rail while the
     shell lands around it. The tool is already built underneath the whole
     time; this is the transition into it, not a gate in front of it.

     Shown once per person. `?splash` replays it - useful when showing the
     tool to someone rather than using it. */
  /* The ground is the catalogue itself, held out of focus. A solid panel said
     "wait here"; this says "it is already built, you are just not looking at
     it yet" - which is the true thing, since the whole tool is rendered
     underneath before any of this runs. The blur pulls to zero as the name
     travels, so arriving and focusing are the same movement.

     A wash over the blur, not instead of it: 56px type over a blurred table is
     still type over a table, and the wash is what makes it read as a surface. */
  .splash {
    position: fixed; inset: 0; z-index: 400;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(232, 236, 243, .82);
  }
  .splash[hidden] { display: none !important; }
  .splash.clearing { background: rgba(232, 236, 243, 0); transition: background .5s ease; }

  /* Blur only - no scale. A scale here was hiding the soft edges `filter:
     blur()` leaves at the viewport border, but the rail heading lives inside
     .app, so scaling back to 1 moved the very thing the lockup flies onto:
     measured, the target drifted 12.1px across and 6.8px down mid-flight,
     which is exactly the offset that was visible on landing. The wash covers
     those edges instead. */
  html.splash-on .app { filter: blur(15px); }
  .app { transition: filter .58s ease; }
  .sp-lockup { text-align: center; }
  .sp-name {
    margin: 0;
    font: 700 56px/1.1 var(--display);
    letter-spacing: -0.022em;
    color: var(--navy);
    transform-origin: top left;
  }
  .sp-tag {
    margin: 14px 0 0;
    font: 400 15px/1.5 var(--ui);
    color: var(--muted);
    white-space: nowrap;
  }
  .sp-skip {
    position: fixed; right: 20px; bottom: 18px;
    font: 500 11.5px/1 var(--ui); color: var(--faint);
    background: none; border: 0; cursor: pointer;
  }
  .sp-skip:hover { color: var(--muted); }

  /* the same motion as the rail, at splash scale */
  .sp-name.draft { animation: sp-draft .8s cubic-bezier(.16,.84,.26,1) .2s backwards; }
  .sp-tag.draft  { animation: sp-draft .8s cubic-bezier(.16,.84,.26,1) .5s backwards; }
  @keyframes sp-draft {
    from { opacity: 0; transform: translateX(-34px); filter: blur(9px); }
  }

  /* one shimmer through the line, the same seamless tile as the rail */
  .sp-tag.sweep {
    background: linear-gradient(90deg,
      var(--muted) 0%, var(--muted) 30%,
      var(--blue) 50%,
      var(--muted) 70%, var(--muted) 100%);
    background-size: 200% 100%;
    background-repeat: repeat;
    background-position: 100% 0;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    animation: tag-sweep 1.4s linear 1;
  }

  /* the fly home. The transform is measured at run time from the real rail
     heading, so it lands exactly on it rather than near it. */
  .sp-name.fly, .sp-tag.fly { transition: transform .6s cubic-bezier(.22,1,.36,1); }
  .sp-tag { transform-origin: top left; }
  .splash.gone  { pointer-events: none; }
  /* The rail heading is held invisible while its larger twin is in flight, and
     revealed at the instant that twin reaches it - so the change is a handoff
     at rest, not a fade. Both are never on screen at once, and the text is
     never seen disappearing. */
  html.handoff .spine-brand h1,
  html.handoff .spine-tag { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    .sp-name.draft, .sp-tag.draft, .sp-tag.sweep { animation: none; }
    .sp-tag.sweep { background: none; -webkit-text-fill-color: var(--muted); color: var(--muted); }
    .sp-name.fly, .sp-tag.fly, .app { transition: none; }
    html.splash-on .app { filter: none; }
  }

  /* What the name means, under the name. Plain type: the splash introduces the
     name and the line, so there is nothing left for the rail to announce -
     doing it here as well would be the same job done twice, directly above
     every link someone is trying to click.

     `tag-sweep` below is kept because the splash shimmer uses it. Running the
     shimmer more than once means the loop point has to be invisible, so the
     gradient is a seamless tile: muted at both ends, repeated, moved exactly
     one tile width per pass, so the last frame of a pass is identical to the
     first frame of the next. 90deg rather than a diagonal, because a tiled
     diagonal shows its seam. */
  .spine-tag {
    margin: 5px 0 0;
    font: 400 11.5px/1.45 var(--ui);
    color: var(--muted);
    white-space: nowrap;
  }
  @keyframes tag-sweep { to { background-position: -100% 0; } }

  .spine-search {
    margin: 14px 16px 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 10px;
    background: var(--sunken);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    color: var(--muted);
    font: 400 13px var(--ui);
    cursor: pointer;
    text-align: left;
    width: calc(100% - 32px);
    transition: border-color .12s ease, background .12s ease;
  }
  .spine-search:hover { border-color: var(--line-2); background: #fff; }
  .spine-search svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--faint); }
  .spine-search .lbl { flex: 1; }
  .spine-search kbd {
    font: 500 10.5px/1 var(--mono);
    color: var(--faint);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-xs);
    padding: 3px 5px;
  }

  /* The three sections are a fixed menu, not entries in the scrolling list.
     Flows grows every time a module is added; when Components and Foundations
     lived under it they were pushed further down each time and eventually off
     the bottom. Here they cannot move, and only the open section's tree scrolls. */
  .spine-tabs {
    flex-shrink: 0;
    padding: 12px 12px 10px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .spine-tabs button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 10px;
    border: 0;
    border-radius: var(--r-sm);
    background: none;
    font: 500 13px/1 var(--ui);
    color: var(--ink-2);
    cursor: pointer;
    text-align: left;
    transition: background .12s ease, color .12s ease;
  }
  .spine-tabs button:hover { background: var(--sunken); color: var(--ink); }
  .spine-tabs button.active { background: var(--navy); color: #fff; }
  .spine-tabs button .ic { width: 15px; height: 15px; flex-shrink: 0; opacity: .85; }
  .spine-tabs button .lbl { flex: 1; }
  .spine-tabs button .n {
    font: 400 11px/1 var(--mono);
    color: var(--faint);
  }
  .spine-tabs button.active .n { color: rgba(255,255,255,.65); }

  /* Deliberately quiet. The navigation below already asks for a lot of attention,
     so this reads as a version line under the wordmark rather than another
     destination - findable when looked for, invisible when not. */
  .spine-ver {
    display: flex; align-items: center; gap: 7px;
    margin: 7px 0 0; padding: 4px 6px 4px 0;
    border: 0; background: none; cursor: pointer; text-align: left;
    font: 400 11.5px/1 var(--ui); color: var(--muted);
    transition: color .12s ease;
  }
  .spine-ver:hover { color: var(--ink); }
  .spine-ver .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--blue); flex-shrink: 0; }
  /* same treatment the module rows give their screen count, sized for this line */
  .spine-ver .n {
    flex-shrink: 0;
    min-width: 17px; height: 17px;
    display: grid; place-items: center;
    padding: 0 5px;
    border-radius: 100px;
    background: var(--sunken);
    font: 500 9.5px/1 var(--mono);
    color: var(--muted);
    transition: background .12s ease, color .12s ease;
  }
  .spine-ver:hover .n { background: var(--blue-soft); color: var(--blue); }

  .spine-nav {
    flex: 1;
    overflow-y: auto;
    padding: 12px 12px 24px;
    scrollbar-width: thin;
  }
  .spine-nav::-webkit-scrollbar { width: 8px; }
  .spine-nav::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; border: 2px solid var(--surface); }

  .spine-kicker {
    font: 600 10px/1 var(--ui);
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--faint);
    padding: 2px 10px 8px;
  }

  .spine-list { list-style: none; margin: 4px 0 0; padding: 0; }

  /* A module is a heavier thing than a screen inside it, and the rail was not
     saying so: same weight, same ink, four pixels apart. Modules now carry the
     page's own ink and a numbered blue chip; screens sit smaller, lighter and
     further in, under a rule that visibly belongs to the module above. */
  .spine-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    margin-top: 2px;
    border-radius: var(--r-sm);
    cursor: pointer;
    color: var(--ink);
    font: 500 13.5px/1.35 var(--ui);
    position: relative;
    transition: background .12s ease, color .12s ease;
  }
  /* space before the next module, so a module and its screens read as one block */
  .spine-item + .spine-item { margin-top: 6px; }
  .spine-screens + .spine-item { margin-top: 10px; }
  .spine-item:hover { background: var(--sunken); }
  .spine-item.active { background: var(--blue-soft); color: var(--navy); font-weight: 600; }
  .spine-item.active::before {
    content: "";
    position: absolute; left: -12px; top: 4px; bottom: 4px;
    width: 3px; border-radius: 0 3px 3px 0;
    background: var(--blue);
  }
  /* the index is an anchor, not a footnote - it carries colour so the eye can
     count modules without reading them */
  .spine-item .n {
    flex-shrink: 0;
    width: 20px; height: 20px;
    display: grid; place-items: center;
    border-radius: var(--r-xs);
    background: var(--blue-soft);
    color: var(--blue);
    font: 600 10px/1 var(--mono);
  }
  .spine-item.active .n { background: var(--blue); color: #fff; }
  .spine-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spine-item .count {
    font: 500 10.5px/1 var(--mono);
    color: var(--muted);
    flex-shrink: 0;
    background: var(--sunken);
    border-radius: 100px;
    padding: 3px 6px;
  }
  .spine-item.active .count { background: var(--blue); color: #fff; }

  /* a flow's screens, revealed under the open flow */
  .spine-screens { list-style: none; margin: 4px 0 2px; padding: 0 0 0 20px; position: relative; }
  .spine-screens::before {
    content: "";
    position: absolute; left: 20px; top: 0; bottom: 8px;
    width: 1.5px; border-radius: 2px;
    background: var(--blue-line);
  }
  .spine-screen {
    display: flex; align-items: center; gap: 9px;
    padding: 6px 10px 6px 16px;
    border-radius: var(--r-sm);
    cursor: pointer;
    color: var(--muted);
    font: 400 12.5px/1.35 var(--ui);
    position: relative;
    transition: background .12s ease, color .12s ease;
  }
  .spine-screen:hover { background: var(--sunken); color: var(--ink); }
  .spine-screen.active { color: var(--blue); font-weight: 500; }
  .spine-screen::before {
    content: "";
    position: absolute; left: -3.5px; top: 50%; transform: translateY(-50%);
    width: 8px; height: 1.5px; border-radius: 2px;
    background: var(--blue-line);
    transition: background .12s ease;
  }
  .spine-screen.active::before { background: var(--blue); }
  .spine-screen .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .rail-empty { padding: 10px; color: var(--faint); font-size: 12.5px; }

  /* ---------------------------------------------------------- main column */
  .col { display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

  .topbar {
    height: 56px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 26px;
    border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,.72);
    backdrop-filter: saturate(1.4) blur(8px);
  }
  .crumb {
    display: flex; align-items: center; gap: 8px;
    font: 400 13px var(--ui); color: var(--muted);
    min-width: 0;
  }
  .crumb .sep { color: var(--line-2); }
  .crumb strong { font-weight: 600; color: var(--ink); }
  .crumb .id {
    font: 400 11px/1 var(--mono);
    color: var(--muted);
    background: var(--sunken);
    border: 1px solid var(--line);
    border-radius: var(--r-xs);
    padding: 4px 6px;
  }
  .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  .main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 44px 44px;
    scroll-behavior: smooth;
  }

  /* ---- walking a flow: the whole view fits the viewport ----
     The strip and the summary take the height they need; the prototype takes
     everything left over. Nothing about the screen under review is below the
     fold, so there is no page scroll here at all. */
  .main.stage-view {
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding-bottom: 20px;
  }

  /* ---------------------------------------------------------- the stage
     The live screen, floating. Everything else on this page is chrome around
     it, so it gets the frame, the shadow and the width. */
  /* One left-aligned column holds the strip, the summary and the stage, so all
     three share an edge. 70% of the work area - a proportion, not a pixel cap,
     so it grows with the monitor instead of stranding the stage in the middle. */
  .work-col {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }

  .stage-outer { display: flex; flex: 1; min-height: 0; }

  .stage {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid rgba(9,45,94,.09);
    border-radius: var(--r-lg);
    box-shadow: var(--sh-stage);
    overflow: hidden;
  }

  .stage-bar {
    height: 38px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #FFFFFF 0%, #FAFBFD 100%);
  }
  .stage-dots { display: flex; gap: 6px; flex-shrink: 0; }
  .stage-dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line-2); display: block; }
  .stage-bar .title {
    flex: 1;
    text-align: center;
    font: 400 11.5px/1 var(--mono);
    color: var(--faint);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .stage-bar .walk { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  /* spelled out rather than a lone glyph: on the stage bar an icon alone reads as
     decoration, and this is the control people look for most after the arrows */
  .stage-fs {
    display: inline-flex; align-items: center; gap: 5px;
    height: 24px; padding: 0 10px;
    margin-left: 4px;
    border: 1px solid var(--line);
    border-radius: 100px;
    background: var(--surface);
    color: var(--ink-2);
    font: 500 11.5px/1 var(--ui);
    cursor: pointer;
    white-space: nowrap;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .stage-fs:hover { background: var(--navy); color: #fff; border-color: var(--navy); }
  .stage-nav {
    width: 24px; height: 24px;
    display: grid; place-items: center;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-2);
    font-size: 13px; line-height: 1;
    cursor: pointer;
    padding: 0;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .stage-nav:not(:disabled):hover { background: var(--navy); color: #fff; border-color: var(--navy); }
  .stage-nav:disabled { opacity: .3; cursor: default; }

  .stage-canvas {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    background: #fff;
  }
  .stage-frame {
    position: absolute; top: 0; left: 0;
    transform-origin: top left;
    border: 0;
    background: #fff;
  }

  /* ---------------------------------------------------------- filmstrip */
  .filmstrip {
    display: flex;
    gap: 10px;
    flex-shrink: 0;
    margin: 0 0 12px;
    padding: 2px 2px 6px;
    overflow-x: auto;
    scrollbar-width: thin;
  }
  .film {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 13px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    cursor: pointer;
    font: 400 12.5px/1 var(--ui);
    color: var(--ink-2);
    box-shadow: var(--sh-1);
    transition: border-color .12s ease, color .12s ease, box-shadow .12s ease, transform .12s ease;
  }
  .film:hover { border-color: var(--blue-line); color: var(--ink); transform: translateY(-1px); box-shadow: var(--sh-2); }
  .film.active {
    border-color: var(--blue);
    color: var(--navy);
    font-weight: 500;
    box-shadow: 0 0 0 3px var(--blue-soft), var(--sh-1);
  }
  .film .n {
    width: 19px; height: 19px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--sunken);
    color: var(--muted);
    font: 500 10.5px/1 var(--mono);
    flex-shrink: 0;
  }
  .film.active .n { background: var(--blue); color: #fff; }

  /* ---------------------------------------------------------- meta card */
  .metacard { flex-shrink: 0; margin: 0 0 14px; }
  .metacard .inner {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 13px 18px;
    box-shadow: var(--sh-1);
  }
  .metacard h3 {
    margin: 0 0 4px;
    font: 700 16px/1.3 var(--display);
    color: var(--navy);
    letter-spacing: -0.005em;
  }
  .metacard .desc { margin: 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.6; max-width: 76ch; }
  .metacard .rows { display: flex; flex-wrap: wrap; gap: 10px 28px; }
  .metacard .rows > div { min-width: 0; }
  .metacard .k {
    font: 600 10px/1 var(--ui);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--faint);
    display: block;
    margin-bottom: 6px;
  }

  .pillrow { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    font: 400 11.5px/1 var(--ui);
    padding: 5px 9px;
    border-radius: 100px;
    background: var(--sunken);
    border: 1px solid var(--line);
    color: var(--ink-2);
  }
  .pill.state { background: var(--blue-soft); border-color: var(--blue-line); color: var(--navy); }

  .badge {
    font: 400 11px/1 var(--mono);
    color: var(--muted);
    background: var(--sunken);
    border: 1px solid var(--line);
    border-radius: var(--r-xs);
    padding: 4px 6px;
  }

  /* ---------------------------------------------------------- buttons */
  .btn {
    font: 500 12.5px/1 var(--ui);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 13px;
    border-radius: var(--r-sm);
    border: 1px solid var(--line-2);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
    transition: border-color .12s ease, background .12s ease, color .12s ease, box-shadow .12s ease;
  }
  .btn:hover { border-color: var(--navy); }
  .btn.primary {
    background: var(--navy);
    border-color: var(--navy);
    color: #fff;
  }
  .btn.primary:hover { background: #0C3A78; border-color: #0C3A78; box-shadow: var(--sh-2); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { background: var(--sunken); color: var(--ink); border-color: var(--line); }
  .btn.small { height: 28px; padding: 0 10px; font-size: 12px; }
  .btn.danger:hover { border-color: #B3462C; color: #B3462C; }

  /* ---------------------------------------------------------- section heads */
  .flow-header { margin: 0 0 20px; }
  .flow-header h2 {
    margin: 0 0 6px;
    font: 700 24px/1.2 var(--display);
    letter-spacing: -0.015em;
    color: var(--navy);
  }
  .flow-header p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 78ch; line-height: 1.6; }

  .rail-label {
    font: 600 10.5px/1 var(--ui);
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .empty-state {
    max-width: 560px;
    margin: 12vh auto;
    text-align: center;
  }
  .empty-state h2 { font: 700 20px/1.3 var(--display); color: var(--navy); margin: 0 0 8px; }
  .empty-state p { color: var(--muted); font-size: 13.5px; line-height: 1.65; margin: 0 0 18px; }

  /* ---------------------------------------------------------- components grid */
  .comp-grid { display: flex; flex-wrap: wrap; gap: 16px; margin: 0 0 8px; }
  .comp-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    box-shadow: var(--sh-1);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: box-shadow .14s ease, transform .14s ease, border-color .14s ease;
  }
  .comp-card:hover { box-shadow: var(--sh-2); transform: translateY(-2px); border-color: var(--line-2); }
  .comp-card.size-fill { width: 100%; }
  .comp-card.size-hug { max-width: 100%; }
  .comp-card .comp-preview {
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 22px;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .comp-card.size-hug .comp-preview { justify-content: flex-start; }
  .comp-card.size-fill .comp-preview > .vp-scope { width: 100%; }
  .comp-card.size-hug .comp-preview > .vp-scope { width: max-content; }
  .comp-card .comp-meta { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 7px; }
  .comp-card .comp-meta h4 { margin: 0; font: 600 14px/1.3 var(--ui); color: var(--ink); }
  .comp-card .comp-meta .cat { font: 400 11px/1 var(--mono); color: var(--faint); }
  .comp-card .comp-meta p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.55; }
  .comp-card .comp-meta .footer { display: flex; gap: 7px; margin-top: 4px; flex-wrap: wrap; }

  /* ---------------------------------------------------------- foundations */
  .found-tabs { display: flex; gap: 6px; margin: 0 0 20px; }
  .found-tabs button {
    font: 500 12.5px/1 var(--ui);
    height: 30px; padding: 0 12px;
    border-radius: 100px;
    border: 1px solid var(--line-2);
    background: var(--surface);
    color: var(--ink-2);
    cursor: pointer;
    transition: all .12s ease;
  }
  .found-tabs button:hover { border-color: var(--navy); }
  .found-tabs button.on { background: var(--navy); border-color: var(--navy); color: #fff; }

  .typo-sheet, .color-group, .sp-role {
    margin: 0 0 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    box-shadow: var(--sh-1);
    overflow: hidden;
  }
  .typo-row {
    display: flex;
    align-items: center;
    gap: 26px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
  }
  .typo-row:last-child { border-bottom: none; }
  .typo-meta { width: 210px; flex-shrink: 0; display: flex; flex-direction: column; gap: 3px; }
  .typo-name { font: 600 13px/1.3 var(--ui); color: var(--ink); }
  .typo-cls { font: 400 11px/1.4 var(--mono); color: var(--blue); }
  .typo-spec { font: 400 11px/1.4 var(--mono); color: var(--faint); }
  .typo-sample { flex: 1; min-width: 0; color: var(--ink); overflow: hidden; }

  .color-group h3, .sp-role h3 {
    margin: 0;
    padding: 15px 20px;
    border-bottom: 1px solid var(--line);
    font: 700 14px/1.3 var(--display);
    color: var(--navy);
  }
  .sp-role p { margin: 0; padding: 12px 20px 0; color: var(--muted); font-size: 12.5px; line-height: 1.6; }
  .color-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(188px, 1fr));
    gap: 12px;
    padding: 18px 20px 20px;
  }
  .color-chip { display: flex; gap: 11px; align-items: center; min-width: 0; }
  .color-chip .sw {
    width: 40px; height: 40px;
    border-radius: var(--r-sm);
    border: 1px solid rgba(9,45,94,.12);
    flex-shrink: 0;
    box-shadow: inset 0 1px 2px rgba(9,45,94,.06);
  }
  .color-chip .meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .color-chip .nm { font: 500 12.5px/1.3 var(--ui); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .color-chip .hx { font: 400 11px/1.4 var(--mono); color: var(--muted); }
  .color-chip .tk { font: 400 10.5px/1.4 var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .sp-rows { padding: 8px 20px 16px; }
  .sp-row {
    display: flex; align-items: center; gap: 14px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  .sp-row:last-child { border-bottom: none; }
  .sp-row code { font: 400 11.5px/1 var(--mono); color: var(--blue); width: 250px; flex-shrink: 0; }
  .sp-row .px { font: 400 11.5px/1 var(--mono); color: var(--muted); width: 52px; flex-shrink: 0; text-align: right; }
  .sp-bar { height: 12px; border-radius: 3px; background: var(--blue); opacity: .8; }
  .sp-bar.neg { background: var(--amber); }

  /* The version timeline. Markers are anchored to the first line of each title,
     not centred on the row: rows differ in height because titles wrap, so
     centring puts every dot at a different offset from its own text. The
     connector is drawn per row as two segments that meet at the marker, so it
     stays joined whatever the rows do. */
  .evo { list-style: none; margin: 0 0 16px; padding: 0; }
  .evo-row {
    position: relative;
    display: flex; align-items: flex-start; gap: 14px;
    padding: 9px 0 9px 28px;
  }
  .evo-dot {
    position: absolute; left: 3px; top: 15px;
    width: 11px; height: 11px; border-radius: 50%;
    background: #fff; border: 2px solid var(--blue-line);
    z-index: 1;
  }
  .evo-row:first-child .evo-dot { background: var(--blue); border-color: var(--blue); }
  /* downward segment, on every row but the last */
  .evo-row::before {
    content: ""; position: absolute; left: 7.5px; top: 20px; bottom: 0;
    width: 1.5px; background: var(--blue-line);
  }
  .evo-row:last-child::before { display: none; }
  /* upward segment, on every row but the first */
  .evo-row::after {
    content: ""; position: absolute; left: 7.5px; top: 0; height: 21px;
    width: 1.5px; background: var(--blue-line);
  }
  .evo-row:first-child::after { display: none; }

  .evo-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .evo-meta b { font: 500 13.5px/1.45 var(--ui); color: var(--ink); }
  .evo-meta em { font: 400 11px/1 var(--mono); color: var(--faint); font-style: normal; }
  .evo-now {
    flex-shrink: 0; margin-top: 2px;
    font: 600 9.5px/1 var(--ui); letter-spacing: .08em; text-transform: uppercase;
    color: var(--blue); background: var(--blue-soft); border: 1px solid var(--blue-line);
    border-radius: 100px; padding: 5px 9px;
  }
  .evo-open { flex-shrink: 0; margin-top: 1px; }

  /* ---------------------------------------------------------- Learn index */
  .learn-index { max-width: 1120px; margin: 0 auto; padding-bottom: 48px; }
  .learn-index-head { margin-bottom: 30px; }
  .learn-index-head h1 {
    margin: 0 0 6px; font: 700 30px/1.2 var(--display);
    letter-spacing: -.02em; color: var(--navy);
  }
  .learn-index-head p { margin: 0; font: 400 14.5px/1.7 var(--ui); color: var(--muted); max-width: 62ch; }

  .learn-track { margin-bottom: 30px; }
  .learn-track-head {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 14px; padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }
  .learn-track-head h2 {
    margin: 0; font: 600 11px/1 var(--ui);
    letter-spacing: .1em; text-transform: uppercase; color: var(--blue);
    flex-shrink: 0;
  }
  .learn-track-head span { font: 400 12.5px/1.5 var(--ui); color: var(--faint); }

  /* stacks horizontally while there is room, vertically when there is not */
  .learn-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
    gap: 14px;
  }

  .learn-card {
    position: relative;
    display: flex; flex-direction: column; gap: 9px;
    text-align: left;
    padding: 18px 18px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--sh-1);
    cursor: pointer;
    font: inherit;
    overflow: hidden;
    transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
  }
  /* a soft wash that only shows on approach, so a grid of fourteen stays calm */
  .learn-card::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(135deg, var(--blue-soft) 0%, rgba(237,242,255,0) 58%);
    opacity: 0;
    transition: opacity .14s ease;
    pointer-events: none;
  }
  .learn-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--sh-2);
    border-color: var(--blue-line);
  }
  .learn-card:hover::before { opacity: 1; }

  .lc-top { display: flex; align-items: center; justify-content: space-between; }
  .lc-ic {
    width: 38px; height: 38px;
    display: grid; place-items: center;
    border-radius: 10px;
    background: var(--blue-soft);
    color: var(--blue);
    transition: background .14s ease, color .14s ease;
  }
  .lc-ic svg { width: 20px; height: 20px; display: block; }
  .learn-card:hover .lc-ic { background: var(--navy); color: #fff; }
  .lc-n { font: 500 11px/1 var(--mono); color: var(--faint); }

  .lc-title { font: 700 15.5px/1.4 var(--display); color: var(--navy); letter-spacing: -.005em; }
  /* the same label on the card, sized down to sit beside a 15.5px title */
  .lc-badge {
    position: relative;
    display: inline-block;
    overflow: hidden;
    vertical-align: middle;
    margin-left: 8px;
    transform: translateY(-1px);
    font: 600 8.5px/1 var(--ui);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #fff;
    background: var(--navy);
    border-radius: 100px;
    padding: 4px 8px;
    white-space: nowrap;
  }

  .lc-sum { font: 400 12.5px/1.6 var(--ui); color: var(--muted); flex: 1; }
  .lc-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 3px; padding-top: 11px; border-top: 1px solid var(--line);
  }
  .lc-aud {
    font: 600 9.5px/1 var(--ui); letter-spacing: .08em; text-transform: uppercase;
    color: var(--amber); background: var(--amber-soft, #FFEDDE);
    border-radius: 100px; padding: 4px 8px;
  }
  /* "Important" is about the guide, not the reader, so it gets its own accent
     rather than borrowing the audience tag's amber - and violet, because amber
     and red already mean warning everywhere else in the catalogue. */
  .lc-flag {
    font: 600 9.5px/1 var(--ui); letter-spacing: .08em; text-transform: uppercase;
    color: var(--violet); background: var(--violet-soft);
    border-radius: 100px; padding: 4px 8px;
  }
  .lc-tags { display: flex; align-items: center; gap: 6px; }
  .lc-go {
    font: 500 11.5px/1 var(--ui); color: var(--blue);
    opacity: 0; transform: translateX(-4px);
    transition: opacity .14s ease, transform .14s ease;
  }
  .learn-card:hover .lc-go { opacity: 1; transform: none; }
  .lc-top, .lc-title, .lc-sum, .lc-foot { position: relative; }

  @media (prefers-reduced-motion: reduce) {
    .learn-card:hover { transform: none; }
    .lc-go { opacity: 1; transform: none; }
  }

  /* ---------------------------------------------------------- Learn
     Prose, so it is set for reading: one measured column, a real scale, and
     figures that use the same tokens as everything else in the catalog. */
  .learn { max-width: 760px; margin: 0 auto; padding-bottom: 40px; }
  .learn-head { margin-bottom: 26px; }
  /* "One-time setup" - a label about the task, not the reader, so it is filled
     rather than tinted. It shimmers four times on arrival and then stays still;
     a badge that never stops moving is an irritation, not an invitation. */
  .learn-badge {
    position: relative;
    display: inline-block;
    overflow: hidden;
    vertical-align: middle;
    margin-left: 12px;
    transform: translateY(-3px);
    font: 600 10px/1 var(--ui);
    letter-spacing: .09em;
    text-transform: uppercase;
    color: #fff;
    background: var(--navy);
    border-radius: 100px;
    padding: 6px 11px;
    white-space: nowrap;
  }
  .shimmer::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(100deg,
      rgba(255,255,255,0) 25%,
      rgba(255,255,255,.55) 50%,
      rgba(255,255,255,0) 75%);
    transform: translateX(-110%);
    animation: lb-shimmer 1.45s ease-in-out .4s 4;
  }
  @keyframes lb-shimmer { to { transform: translateX(110%); } }
  @media (prefers-reduced-motion: reduce) { .shimmer::after { animation: none; } }

  .learn-aud {
    display: inline-block; margin-bottom: 10px;
    font: 600 10px/1 var(--ui); letter-spacing: .09em; text-transform: uppercase;
    color: var(--blue); background: var(--blue-soft);
    border: 1px solid var(--blue-line); border-radius: 100px; padding: 5px 9px;
  }
  .learn h1 { margin: 0; font: 700 30px/1.25 var(--display); letter-spacing: -.02em; color: var(--navy); }
  .learn h3 {
    margin: 34px 0 12px; font: 700 17px/1.3 var(--display); color: var(--navy);
    padding-top: 22px; border-top: 1px solid var(--line);
  }
  .learn h4 { margin: 0 0 7px; font: 600 14.5px/1.4 var(--ui); color: var(--ink); }
  .learn p { margin: 0 0 14px; font: 400 14.5px/1.75 var(--ui); color: var(--ink-2); }
  .learn p.lead { font-size: 16.5px; line-height: 1.65; color: var(--ink); margin-bottom: 20px; }
  .learn b, .learn strong { color: var(--ink); font-weight: 600; }
  .learn a { color: var(--blue); text-decoration: none; border-bottom: 1px solid var(--blue-line); }
  .learn a:hover { border-bottom-color: var(--blue); }
  .learn code {
    font: 400 12.5px/1 var(--mono); color: var(--navy);
    background: var(--sunken); border: 1px solid var(--line);
    border-radius: var(--r-xs); padding: 2px 5px;
  }
  .learn-code {
    font: 400 12.5px/1.75 var(--mono); color: var(--ink);
    background: var(--sunken); border: 1px solid var(--line);
    border-radius: var(--r); padding: 16px 18px; margin: 0 0 16px;
    overflow-x: auto; white-space: pre;
  }
  .learn-code { position: relative; padding-right: 92px; }
  .code-copy {
    position: absolute; top: 9px; right: 9px;
    display: inline-flex; align-items: center; gap: 5px;
    height: 26px; padding: 0 9px;
    border: 1px solid var(--line-2); border-radius: var(--r-sm);
    background: var(--surface); color: var(--muted);
    font: 500 11px/1 var(--ui); cursor: pointer;
    transition: color .12s ease, border-color .12s ease, background .12s ease;
  }
  .code-copy svg { width: 13px; height: 13px; }
  .code-copy:hover { color: var(--navy); border-color: var(--navy); }
  .code-copy.ok { color: var(--green, #1A7D3A); border-color: var(--green, #1A7D3A); background: #fff; }

  .learn-rules { margin: 0 0 16px; padding: 0; list-style: none; }
  .learn-rules li {
    position: relative; padding: 0 0 0 20px; margin-bottom: 10px;
    font: 400 14.5px/1.7 var(--ui); color: var(--ink-2);
  }
  .learn-rules li::before {
    content: ""; position: absolute; left: 2px; top: 10px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--blue-line);
  }

  .learn-ol { margin: 0 0 16px; padding-left: 20px; }
  .learn-ol li {
    font: 400 14.5px/1.7 var(--ui); color: var(--ink-2);
    margin-bottom: 9px; padding-left: 4px;
  }
  .learn-ol li::marker { color: var(--blue); font-weight: 600; font-size: 13px; }
  .learn-grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .learn-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .learn-cell {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 14px 16px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .learn-cell b { font: 600 13.5px/1.3 var(--ui); color: var(--ink); }
  .learn-cell span { font: 400 12.5px/1.6 var(--ui); color: var(--muted); }
  .learn-cell.good { border-color: var(--blue-line); background: var(--blue-soft); }
  .learn-cell.warn { border-color: var(--vpOrangeBorder, #FFD2AB); background: var(--amber-soft, #FFEDDE); }

  /* the scope filter a guide can opt into: chips, no container. A bar with its
     own background reads as chrome and boxes the page in; chips read as a choice. */
  /* a crumb segment that goes somewhere */
  .crumb-up {
    font: 600 13px/1 var(--ui); color: var(--muted);
    background: none; border: 0; padding: 0; cursor: pointer;
  }
  .crumb-up:hover { color: var(--blue); text-decoration: underline; }

  .vk-filter { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 20px; }
  .vk-chip {
    font: 600 12.5px/1 var(--ui); color: var(--muted);
    background: transparent; border: 1px solid var(--line);
    border-radius: 99px; padding: 8px 14px; cursor: pointer;
  }
  .vk-chip:hover { border-color: var(--blue-line); color: var(--navy); }
  .vk-chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }

  /* a trap, told as what happened then what to do */
  .learn-trap {
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--amber);
    border-radius: var(--r); padding: 16px 18px; margin-bottom: 12px;
  }
  .learn-trap.ok { border-left-color: var(--blue); }
  .learn-trap p { font-size: 13.5px; margin-bottom: 9px; }
  .learn-trap p:last-child { margin-bottom: 0; }
  .learn-trap .fix { color: var(--ink); }

  .learn-note {
    font: 400 13.5px/1.7 var(--ui) !important; color: var(--muted) !important;
    background: var(--sunken); border-left: 3px solid var(--line-2);
    border-radius: 0 var(--r-sm) var(--r-sm) 0; padding: 12px 16px; margin-bottom: 16px !important;
  }
  .learn-defs { display: grid; gap: 10px; margin-bottom: 16px; }
  .learn-defs > div {
    display: grid; grid-template-columns: 130px 1fr; gap: 14px; align-items: start;
    padding: 11px 14px; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--r);
  }
  .learn-defs b { font: 600 13px/1.5 var(--ui); color: var(--navy); }
  .learn-defs span { font: 400 13px/1.6 var(--ui); color: var(--ink-2); }
  @media (max-width: 700px) { .learn-defs > div { grid-template-columns: 1fr; gap: 4px; } }

  .learn-trap .learn-code { margin: 9px 0 0; font-size: 12px; background: #fff; }
  .learn-fig { margin: 0 0 20px; }
  .learn-fig svg {
    display: block; width: 100%; height: auto;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  }
  .learn-fig figcaption {
    margin-top: 9px; font: 400 12.5px/1.6 var(--ui); color: var(--muted); text-align: center;
  }
  .learn-fig .dg-h { font: 600 10px var(--ui); letter-spacing: .09em; fill: var(--muted); text-anchor: middle; }
  .learn-fig .dg-t { font: 600 12px var(--ui); fill: var(--ink); text-anchor: middle; }
  .learn-fig .dg-s { font: 400 10.5px var(--ui); fill: var(--muted); text-anchor: middle; }
  /* on a navy block. A CSS fill beats the element's own fill attribute, which is
     how the labels on the dark blocks ended up navy-on-navy and unreadable. */
  .learn-fig .dg-t.inv { fill: #FFFFFF; }
  .learn-fig .dg-h.inv { fill: #C7DCFF; }
  .learn-fig .dg-s.inv { fill: #C7DCFF; }

  .learn-next {
    display: flex; justify-content: space-between; gap: 12px;
    margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--line);
  }

  @media (max-width: 900px) {
    .learn-grid3, .learn-two { grid-template-columns: 1fr; }
  }

  /* ---------------------------------------------------------- command palette
     The tree covers browsing; this covers knowing what you want. */
  .pal {
    position: fixed; inset: 0; z-index: 90;
    background: rgba(9,45,94,.28);
    backdrop-filter: blur(3px);
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding-top: 12vh;
  }
  .pal.show { display: flex; }
  .pal-box {
    width: min(620px, calc(100vw - 40px));
    background: var(--surface);
    border-radius: var(--r-lg);
    box-shadow: var(--sh-pop);
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .pal-box input {
    width: 100%;
    border: 0;
    border-bottom: 1px solid var(--line);
    padding: 17px 20px;
    font: 400 15px var(--ui);
    color: var(--ink);
    outline: none;
    background: none;
  }
  .pal-box input::placeholder { color: var(--faint); }
  .pal-list { max-height: 50vh; overflow-y: auto; padding: 7px; }
  .pal-row {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 12px;
    border-radius: var(--r-sm);
    cursor: pointer;
    font-size: 13px;
    color: var(--ink);
  }
  .pal-row .kind {
    font: 500 9.5px/1 var(--ui);
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--sunken);
    border: 1px solid var(--line);
    border-radius: 100px;
    padding: 4px 7px;
    flex-shrink: 0;
  }
  .pal-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pal-row .ctx { font: 400 11px/1 var(--mono); color: var(--faint); flex-shrink: 0; }
  .pal-row.sel { background: var(--blue-soft); }
  .pal-row.sel .kind { background: #fff; border-color: var(--blue-line); color: var(--blue); }
  .pal-lead {
    padding: 10px 14px 11px; margin-bottom: 4px;
    border-bottom: 1px solid var(--line);
    font: 400 12px/1.5 var(--ui); color: var(--muted);
  }
  .pal-empty { padding: 26px; text-align: center; color: var(--faint); font-size: 13px; }

  /* ---------------------------------------------------------- version history */
  .stage-fs .vcount {
    font: 500 10px/1 var(--mono);
    background: var(--sunken); color: var(--muted);
    border-radius: 100px; padding: 3px 5px; margin-left: 1px;
  }
  .stage-fs:hover .vcount { background: rgba(255,255,255,.16); color: #fff; }
  .vpast { color: var(--amber); font: 400 11.5px/1 var(--ui); }
  .vpast .vback {
    background: none; border: 0; padding: 0 0 0 2px;
    color: var(--blue); font: 500 11.5px/1 var(--ui); cursor: pointer; text-decoration: underline;
  }

  .vlist { list-style: none; margin: 0; padding: 0; max-height: 46vh; overflow-y: auto; }
  .vrow {
    display: flex; align-items: flex-start; gap: 11px;
    padding: 11px 12px;
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: background .12s ease;
  }
  .vrow:hover { background: var(--sunken); }
  .vrow.on { background: var(--blue-soft); }
  .vmain { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .vmain b { font: 500 13px/1.4 var(--ui); color: var(--ink); }
  .vmain em { font: 400 11px/1 var(--mono); color: var(--faint); font-style: normal; }
  /* the badge says how wide the change was, so a sweep is not mistaken for a
     decision someone made about this screen */
  .vscope {
    flex-shrink: 0; margin-top: 1px;
    font: 500 9.5px/1 var(--ui); letter-spacing: .06em; text-transform: uppercase;
    padding: 4px 7px; border-radius: 100px;
    border: 1px solid var(--line); background: var(--sunken); color: var(--muted);
  }
  .vscope.screen { background: var(--blue-soft); border-color: var(--blue-line); color: var(--blue); }
  .vscope.now { background: var(--navy); border-color: var(--navy); color: #fff; }
  .vscope.sweep { color: var(--faint); }

  /* ---------------------------------------------------------- overlays kept from v1 */
  .overlay {
    position: fixed; inset: 0; z-index: 80;
    background: rgba(9,45,94,.30);
    backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center;
  }
  .overlay.show { display: flex; }
  .panel {
    width: min(560px, calc(100vw - 40px));
    background: var(--surface);
    border-radius: var(--r-lg);
    box-shadow: var(--sh-pop);
    padding: 22px;
    max-height: 86vh; overflow-y: auto;
  }
  .panel h3 { margin: 0 0 4px; font: 700 17px/1.3 var(--display); color: var(--navy); }
  .panel .sub { margin: 0 0 16px; color: var(--muted); font-size: 12.5px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font: 600 10.5px/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
  .field textarea, .field input {
    width: 100%;
    border: 1px solid var(--line-2);
    border-radius: var(--r-sm);
    padding: 9px 11px;
    font: 400 13px var(--ui);
    color: var(--ink);
    background: var(--surface);
    resize: vertical;
  }
  .field textarea:focus, .field input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  .field .hint { font-size: 11.5px; color: var(--faint); margin-top: 5px; }
  .panel .row { display: flex; gap: 12px; }
  .panel .row .field { flex: 1; }
  .panel-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  /* Centred rather than tucked at the bottom: this reports something that just
     happened and is worth reading before carrying on. It is deliberately not a
     dialog - there is nothing to decide, so there is no confirm button, only a
     way to close it. The scrim is light enough that the page stays legible. */
  .toast {
    /* centred on the work area rather than the window - the spine is not what
       this is about, and centring across it throws the card off to the left */
    position: fixed; top: 0; right: 0; bottom: 0; left: var(--spine-w);
    z-index: 95;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(9, 45, 94, 0.18);
    backdrop-filter: blur(2px);
  }
  .toast.show { display: flex; }
  .toast-card {
    position: relative;
    width: min(440px, calc(100vw - 40px));
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--sh-pop);
    padding: 26px 26px 24px;
    text-align: center;
    animation: toast-in .16s ease-out;
  }
  @keyframes toast-in {
    from { opacity: 0; transform: translateY(6px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }
  .toast-mark {
    width: 40px; height: 40px;
    margin: 0 auto 14px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--blue-soft);
    color: var(--blue);
  }
  .toast-mark svg { width: 20px; height: 20px; }
  .toast-msg { font: 600 15px/1.4 var(--ui); color: var(--ink); }
  .toast-sub { font: 400 13px/1.6 var(--ui); color: var(--muted); margin-top: 6px; }
  .toast-sub:empty { display: none; }
  .toast-close {
    position: absolute; top: 10px; right: 10px;
    width: 26px; height: 26px;
    display: grid; place-items: center;
    background: none; border: 0; border-radius: var(--r-sm);
    color: var(--faint); cursor: pointer; font-size: 13px; line-height: 1;
  }
  .toast-close:hover { background: var(--sunken); color: var(--ink); }

  .fs-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg);
    display: none; flex-direction: column;
  }
  .fs-overlay.show { display: flex; }
  .fs-bar {
    height: 48px; flex-shrink: 0;
    display: flex; align-items: center; gap: 12px;
    padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .fs-bar .name { font: 600 13px var(--ui); color: var(--ink); }
  .fs-close {
    margin-left: auto;
    font: 500 12.5px/1 var(--ui);
    height: 30px; padding: 0 12px;
    border-radius: var(--r-sm);
    border: 1px solid var(--line-2);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  .fs-close:hover { border-color: var(--navy); }
  .fs-frame { flex: 1; width: 100%; border: 0; background: #fff; }

  .status-line { font-size: 12px; color: var(--faint); }

  /* narrow screens: the spine folds away so the stage keeps the width */
  @media (max-width: 1000px) {
    .app { grid-template-columns: 1fr; }
    .spine { display: none; }
    .main { padding: 16px 16px 40px; }
    .main.stage-view { overflow-y: auto; }
    .toast { left: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }

  /* ============ vp- component kit (Valmo Partner clone) ============ */

  /* ============ FOUNDATIONS / TYPOGRAPHY ============================
     Mier B02 + the Crystal type scale, measured off
     crystal.meeshosupplyassets.com -> Foundation/Typography.

     This is the ONLY place type is defined. Pages and components must use a
     .vp-<style> class (or the matching token) and must not declare their own
     font-family / font-size / font-weight.

     Font files: assets/fonts/*.woff2. The path is relative to the page, so the
     export rewrites it to ../assets/fonts for files under screens/ and
     components/ (same asymmetry the icons have).
     ------------------------------------------------------------------ */
  @font-face { font-family: "Mier B02"; src: url("assets/fonts/Mier_B02-Book.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Mier B02"; src: url("assets/fonts/Mier_B02-Demi.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: swap; }
  @font-face { font-family: "Mier B02"; src: url("assets/fonts/Mier_B02-Bold.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }

  /* If the Mier files never arrive - pulled without assets/fonts, offline, a blocked
     CDN - the page must not reflow. Measured against Mier, system-ui sets ~10.4-13.4%
     wide and Arial ~4%, which is enough to overflow a table row or push the page title
     into the Download button. This fallback is Arial (or a metric-compatible clone)
     scaled to Mier's advance widths, so a failed font load costs a change of typeface
     and nothing else. The live panel does the same thing, under the same name. */
  @font-face {
    font-family: "Mier Fallback";
    src: local("Arial"), local("Helvetica Neue"), local("Helvetica"),
         local("Liberation Sans"), local("Nimbus Sans"), local("Albany AMT");
    size-adjust: 96%;
    font-display: swap;
  }

  .vp-scope {
    --vpFont: "Mier B02", "Mier Fallback", system-ui, sans-serif;
    /* weight size/line-height - one token per Crystal style */
    --vpDisplay1:    600 28px/36px var(--vpFont);
    /* Display2Valmo - the numeric display style, and the one deliberate addition to
       Crystal. Used for hero figures (e.g. "+₹10,368.00"). Crystal's Display1 is also
       28px but 600/36px, so nothing covered a bold 28px figure.
       Line-height is set equal to the size (28px) on purpose: the live panel ships 20px,
       which is smaller than the glyph size and risks clipping numerals, and Display1's
       36px adds leading a standalone figure doesn't want. */
    --vpDisplay2Valmo: 700 28px/28px var(--vpFont);
    /* Display3Banner / Display3BannerValue - Growth Dashboard runs 21px at two weights
       that Crystal doesn't have (it only defines 21/700 as Heading1). Measured live. */
    --vpDisplay3Banner:      600 21px/28px var(--vpFont);
    --vpDisplay3BannerValue: 400 21px/28px var(--vpFont);
    /* Body17Valmo - stat-summary figures on Payments and Loss Management render at
       17px regular. Crystal has 17px only as Heading3 (700), so nothing covered it. */
    --vpBody17Valmo:      400 17px/24px var(--vpFont);
    --vpHeading1:    700 21px/28px var(--vpFont);
    --vpHeading2:    700 19px/24px var(--vpFont);
    --vpHeading3:    700 17px/24px var(--vpFont);
    --vpHeading4:    700 15px/20px var(--vpFont);
    --vpHeading5:    600 13px/20px var(--vpFont);
    --vpHeading6:    600 13px/20px var(--vpFont);
    --vpHeading7:    600 12px/16px var(--vpFont);
    /* Crystal ships Heading8 as 11px on a 28px line-height (2.5x, evidently a slip);
       corrected here to 16px to match the other 11px styles (Body4, ButtonText4). */
    --vpHeading8:    600 11px/16px var(--vpFont);
    --vpBody1:       400 15px/20px var(--vpFont);
    --vpBody2:       400 13px/20px var(--vpFont);
    /* ButtonText13BoldValmo - small bold text. The live panel uses 13/700 widely (links,
       compact button labels, small emphatic headings); Crystal stops at 13/600, so
       mapping these to Demi lost the weight. Line-height 20px matches every other
       13px style in the scale. */
    --vpButtonText13BoldValmo: 700 13px/20px var(--vpFont);

    /* ---- 14px family (Valmo) -------------------------------------------------
       Crystal has no 14px style at all, yet 14px is the standard size for table
       content across Payments, Pilot Management and Pilot Rate Card - 212 elements,
       94% of everything the library previously failed to cover. Live renders these at
       browser-default line-heights (19.6 / 21 / normal); we set 20px for all three,
       consistent with every other 13-15px style in the scale. */
    --vpBody14Valmo:     400 14px/20px var(--vpFont);
    /* same 14px Book on a tighter 16px line - live's breadcrumbs. The coverage
       audit matched size+weight only, so this line-height was never surfaced. */
    --vpBody14TightValmo: 400 14px/16px var(--vpFont);
    /* status tags in the rail: live sets 12px on an 18px line, which no
       existing 12px style covers (Body3 is 12/16) and which is what makes
       the tag 26px tall and the nav row 54px. */
    --vpBody12TagValmo:   400 12px/18px var(--vpFont);
    /* the demi companion to Body12TagValmo - live's "Current" pill. Heading7
       is the only other 12px demi style and sits on a 16px line. */
    --vpButtonText12TagValmo: 600 12px/18px var(--vpFont);
    --vpButtonText14DemiValmo: 600 14px/20px var(--vpFont);
    --vpButtonText14BoldValmo: 700 14px/20px var(--vpFont);
    --vpBody3:       400 12px/16px var(--vpFont);
    --vpBody4:       400 11px/16px var(--vpFont);
    --vpBody5:       400 10px/16px var(--vpFont);
    --vpBody6:       400  9px/12px var(--vpFont);
    --vpButtonText1: 600 15px/20px var(--vpFont);
    --vpButtonText2: 600 13px/20px var(--vpFont);
    --vpButtonText3: 600 12px/16px var(--vpFont);
    --vpButtonText4: 600 11px/16px var(--vpFont);
  }

  .vp-scope .vp-display1    { font: var(--vpDisplay1); }
  .vp-scope .vp-display2valmo { font: var(--vpDisplay2Valmo); }
  .vp-scope .vp-display3banner      { font: var(--vpDisplay3Banner); }
  .vp-scope .vp-display3bannervalue { font: var(--vpDisplay3BannerValue); }
  .vp-scope .vp-body17valmo      { font: var(--vpBody17Valmo); }
  .vp-scope .vp-heading1    { font: var(--vpHeading1); }
  .vp-scope .vp-heading2    { font: var(--vpHeading2); }
  .vp-scope .vp-heading3    { font: var(--vpHeading3); }
  .vp-scope .vp-heading4    { font: var(--vpHeading4); }
  .vp-scope .vp-heading5    { font: var(--vpHeading5); }
  .vp-scope .vp-heading6    { font: var(--vpHeading6); }
  .vp-scope .vp-heading7    { font: var(--vpHeading7); }
  .vp-scope .vp-heading8    { font: var(--vpHeading8); text-transform: uppercase; }
  .vp-scope .vp-body1       { font: var(--vpBody1); }
  .vp-scope .vp-body2       { font: var(--vpBody2); }
  .vp-scope .vp-buttontext13boldvalmo { font: var(--vpButtonText13BoldValmo); }
  .vp-scope .vp-body14valmo     { font: var(--vpBody14Valmo); }
  .vp-scope .vp-body14tightvalmo { font: var(--vpBody14TightValmo); }
  .vp-scope .vp-body12tagvalmo { font: var(--vpBody12TagValmo); }
  .vp-scope .vp-buttontext12tagvalmo { font: var(--vpButtonText12TagValmo); }
  .vp-scope .vp-buttontext14demivalmo { font: var(--vpButtonText14DemiValmo); }
  .vp-scope .vp-buttontext14boldvalmo { font: var(--vpButtonText14BoldValmo); }
  .vp-scope .vp-body3       { font: var(--vpBody3); }
  .vp-scope .vp-body4       { font: var(--vpBody4); }
  .vp-scope .vp-body5       { font: var(--vpBody5); }
  .vp-scope .vp-body6       { font: var(--vpBody6); text-transform: uppercase; }
  .vp-scope .vp-buttontext1 { font: var(--vpButtonText1); }
  .vp-scope .vp-buttontext2 { font: var(--vpButtonText2); }
  .vp-scope .vp-buttontext3 { font: var(--vpButtonText3); }
  .vp-scope .vp-buttontext4 { font: var(--vpButtonText4); text-transform: uppercase; }
  .vp-scope {
    /* ============ FOUNDATIONS / COLOR ================================
       The palette. Every colour in the kit resolves to one of these, the
       same way every font declaration resolves to a type token.

       Crystal's own palette, read off Foundation/Colors, minus its four
       "blue" shades - those are purple (#3C29B7) and Valmo does not use
       them. Valmo's blue ramp stands in their place.
       ------------------------------------------------------------------ */
    /* base */
    --vpWhite:            #FFFFFF;
    --vpBlack:            #000000;
    /* grey */
    --vpGreyLight01:      #E6EBF2;
    --vpGreyLight02:      #F2F5FA;
    --vpGainsboro:        #DCDCDC;
    --vpSantasGray:       #9D9DA6;
    --vpGreyMid01:        #C3C9D4;
    --vpGreyMid02:        #8E96A3;
    --vpGreyDark01:       #5A5E66;
    --vpGreyDark02:       #272829;
    /* red */
    --vpRedBg:            #FFEEED;
    --vpRedBorder:        #FFCBC9;
    --vpBlushPink:        #FFAFAC;
    --vpRedAction:        #F44240;
    /* orange */
    --vpOrangeBg:         #FFEDDE;
    --vpOrangeBorder:     #FFD2AB;
    --vpOrangeAction:     #EC7600;
    /* green */
    --vpGreenBg:          #E7FBE0;
    --vpGreenBorder:      #C2EAB4;
    --vpGreenAction:      #43A92C;
    --vpEmeraldGreen:     #038D63;
    /* yellow */
    --vpYellowBg:         #FFF7D6;
    --vpPaleAmber:        #FFD78A;
    --vpYellowBorder:     #FFDB4C;
    --vpYellowAction:     #F7BE00;
    --vpAmberBrown:       #BF7900;
    /* pink */
    --vpPinkBg:           #FEEFF5;
    --vpPinkBorder:       #F991C6;
    --vpPinkAction:       #F43397;
    /* graph */
    --vpGraphPrimary:     #6E9DEE;
    --vpGraphSecondary:   #CB91E8;
    --vpGraphTertiary:    #E8D381;

    /* Valmo Blue - replaces Crystal's blue shades */
    --vpValmoPrimaryDark: #092D5E;
    --vpValmoBlue:        #2A67FF;
    --vpValmoBlueT1:      #6E9DEE;
    --vpValmoBlue2:       #C5D7FF;
    --vpValmoBlueT2:      #C7DCFF;
    --vpValmoBlueBg:      #E3EDFF;

    /* Valmo-only: live uses these and neither palette carries them */
    --vpValmoNavy:        #072042;   /* the sidebar rail - darker than PrimaryDark */
    --vpValmoPageBg:      #EAEAF2;   /* the page ground behind every panel */
    --vpValmoBlueT3:      #DDE7FE;   /* segmented-control active fill */
    --vpValmoNavyMid:     #0D2B52;   /* map side-panel toggle */
    --vpValmoGreenDeep:   #1A7D3A;   /* positive metric hint */
    --vpValmoInk:         #353543;   /* live's table + control text, a touch bluer than greyDark02 */

    /* ---- semantic aliases -------------------------------------------
       What a thing is *for*, pointing at what it *is*. Rules reference
       these; only this block names a raw colour. */
    --vpNavy:         var(--vpValmoNavy);
    --vpBrand:        var(--vpValmoPrimaryDark);
    --vpPageBg:       var(--vpValmoPageBg);
    --vpSurface:      var(--vpWhite);
    --vpHeadBg:       var(--vpGreyLight02);
    --vpBorder:       var(--vpGreyLight01);
    --vpBorderStrong: var(--vpGreyMid01);   /* stroke on outlined controls */
    --vpText:         var(--vpGreyDark02);
    --vpMuted:        var(--vpGreyDark01);
    --vpPeach:        var(--vpOrangeBg);
    --vpSegActive:    var(--vpValmoBlueT3);
    
    /* ============ FOUNDATIONS / SPACING ==============================
       From Figma "<temp> Claude feeding - spacing", Final Palate 16 Jan.
       Two layers, the same shape as the colour foundation:

         scale     what a distance IS - a 4px step ladder, plus negatives for
                   deliberate pull-ins and overlaps
         semantic  what a distance is FOR. Six roles, and a rule of thumb for
                   each, taken from the mobile explainer in that file:

           margin  screen edge to content - the page's outer gutter
           inline  between items sitting side by side, in a row
           stack   between items stacked one above the other
           verPad  inside a container, top and bottom
           horPad  inside a container, left and right
           secGap  between whole sections, where a divider usually sits

       Only the steps Figma actually publishes per role exist as tokens: a role
       cannot be given a distance the design system never sanctioned for it.
       ------------------------------------------------------------------ */
    --vpSpaceN16: -16px;
    --vpSpaceN12: -12px;
    --vpSpaceN8:   -8px;
    --vpSpaceN4:   -4px;
    --vpSpace0:     0px;
    --vpSpace4:     4px;
    --vpSpace8:     8px;
    --vpSpace12:   12px;
    --vpSpace16:   16px;
    --vpSpace20:   20px;
    --vpSpace24:   24px;
    --vpSpace28:   28px;
    --vpSpace32:   32px;
    --vpSpace36:   36px;
    --vpSpace40:   40px;

    /* margins - Figma publishes only 00 and 16 */
    --vpSpacingMargin00:  var(--vpSpace0);
    --vpSpacingMargin16:  var(--vpSpace16);
    /* inline */
    --vpSpacingInlineN16: var(--vpSpaceN16);
    --vpSpacingInlineN12: var(--vpSpaceN12);
    --vpSpacingInlineN08: var(--vpSpaceN8);
    --vpSpacingInlineN04: var(--vpSpaceN4);
    --vpSpacingInline00:  var(--vpSpace0);
    --vpSpacingInline04:  var(--vpSpace4);
    --vpSpacingInline08:  var(--vpSpace8);
    --vpSpacingInline12:  var(--vpSpace12);
    --vpSpacingInline16:  var(--vpSpace16);
    /* stack */
    --vpSpacingStackN16:  var(--vpSpaceN16);
    --vpSpacingStackN12:  var(--vpSpaceN12);
    --vpSpacingStackN08:  var(--vpSpaceN8);
    --vpSpacingStackN04:  var(--vpSpaceN4);
    --vpSpacingStack00:   var(--vpSpace0);
    --vpSpacingStack04:   var(--vpSpace4);
    --vpSpacingStack08:   var(--vpSpace8);
    --vpSpacingStack12:   var(--vpSpace12);
    --vpSpacingStack16:   var(--vpSpace16);
    --vpSpacingStack20:   var(--vpSpace20);
    --vpSpacingStack24:   var(--vpSpace24);
    /* vertical padding */
    --vpSpacingVerPad00:  var(--vpSpace0);
    --vpSpacingVerPad04:  var(--vpSpace4);
    --vpSpacingVerPad08:  var(--vpSpace8);
    --vpSpacingVerPad12:  var(--vpSpace12);
    --vpSpacingVerPad16:  var(--vpSpace16);
    --vpSpacingVerPad20:  var(--vpSpace20);
    /* horizontal padding - Figma has no 00 here */
    --vpSpacingHorPad04:  var(--vpSpace4);
    --vpSpacingHorPad08:  var(--vpSpace8);
    --vpSpacingHorPad12:  var(--vpSpace12);
    --vpSpacingHorPad16:  var(--vpSpace16);
    --vpSpacingHorPad20:  var(--vpSpace20);
    /* section gaps / dividers */
    --vpSpacingSecGap00:  var(--vpSpace0);
    --vpSpacingSecGap04:  var(--vpSpace4);
    --vpSpacingSecGap08:  var(--vpSpace8);
    --vpSpacingSecGap12:  var(--vpSpace12);
    --vpSpacingSecGap16:  var(--vpSpace16);

    /* Valmo additions to the ladder. Live does not sit on a 4px grid - these are
       the exact distances it measures, so the clone can stay pixel-true while still
       routing every value through the foundation. 15 steps. */
    --vpSpaceN1: -1px;  --vpSpace1: 1px;  --vpSpace2: 2px;  --vpSpace3: 3px;  --vpSpace5: 5px;  --vpSpace6: 6px;  --vpSpace7: 7px;  --vpSpace9: 9px;  --vpSpace10: 10px;  --vpSpace11: 11px;  --vpSpace13: 13px;  --vpSpace14: 14px;  --vpSpace15: 15px;  --vpSpace18: 18px;  --vpSpace22: 22px;  --vpSpace30: 30px;

    --vpSpacingInline20: var(--vpSpace20);
    /* inline - Valmo steps live needs */
    --vpSpacingInline02: var(--vpSpace2); --vpSpacingInline05: var(--vpSpace5); --vpSpacingInline06: var(--vpSpace6); --vpSpacingInline07: var(--vpSpace7); --vpSpacingInline09: var(--vpSpace9); --vpSpacingInline10: var(--vpSpace10); --vpSpacingInline22: var(--vpSpace22);
    --vpSpacingStack28: var(--vpSpace28);
    --vpSpacingStack32: var(--vpSpace32);
    /* stack - Valmo steps live needs */
    --vpSpacingStackN01: var(--vpSpaceN1); --vpSpacingStack01: var(--vpSpace1); --vpSpacingStack02: var(--vpSpace2); --vpSpacingStack03: var(--vpSpace3); --vpSpacingStack05: var(--vpSpace5); --vpSpacingStack06: var(--vpSpace6); --vpSpacingStack09: var(--vpSpace9); --vpSpacingStack10: var(--vpSpace10); --vpSpacingStack13: var(--vpSpace13); --vpSpacingStack14: var(--vpSpace14); --vpSpacingStack15: var(--vpSpace15); --vpSpacingStack18: var(--vpSpace18);
    /* verPad - Valmo steps live needs */
    --vpSpacingVerPad01: var(--vpSpace1); --vpSpacingVerPad02: var(--vpSpace2); --vpSpacingVerPad05: var(--vpSpace5); --vpSpacingVerPad06: var(--vpSpace6); --vpSpacingVerPad07: var(--vpSpace7); --vpSpacingVerPad09: var(--vpSpace9); --vpSpacingVerPad10: var(--vpSpace10); --vpSpacingVerPad11: var(--vpSpace11); --vpSpacingVerPad13: var(--vpSpace13); --vpSpacingVerPad14: var(--vpSpace14); --vpSpacingVerPad22: var(--vpSpace22); --vpSpacingVerPad30: var(--vpSpace30);
    /* horPad - Valmo steps live needs */
    --vpSpacingHorPad00: var(--vpSpace0); --vpSpacingHorPad01: var(--vpSpace1); --vpSpacingHorPad02: var(--vpSpace2); --vpSpacingHorPad05: var(--vpSpace5); --vpSpacingHorPad06: var(--vpSpace6); --vpSpacingHorPad10: var(--vpSpace10); --vpSpacingHorPad11: var(--vpSpace11); --vpSpacingHorPad14: var(--vpSpace14); --vpSpacingHorPad18: var(--vpSpace18); --vpSpacingHorPad30: var(--vpSpace30);

    /* ---- navigation ---------------------------------------------------
       The rail is its own colour world - white type and pale tints on navy,
       where the rest of the panel is dark type on white. Every value here was
       measured off live's sidebar; the nav component uses only these.

       The two alpha tints are given as literals because CSS cannot feed a
       var() into rgba(). Both are palette colours at 20%: live states them in
       oklab, and converting the OPAQUE oklab is what gives an exact hex -
       reading the composited pixel back is lossy at that opacity. */
    --vpNavBg:         var(--vpValmoNavy);      /* #072042 rail */
    --vpNavText:       var(--vpWhite);          /* nav rows, account name, Log Out */
    --vpNavTextDim:    var(--vpGreyLight01);    /* BEU pill text, "Captain Panel" */
    --vpNavAvatarBg:   var(--vpGreyLight01);
    --vpNavPillBorder: var(--vpWhite);          /* 1px ring on the BEU pill */
    --vpNavActiveBar:  var(--vpValmoBlue2);     /* #C5D7FF 4px selected edge */
    --vpNavActiveBg:   rgba(197, 215, 255, 0.2);  /* ValmoBlue2 @ 20% */
    --vpNavDivider:    rgba(195, 201, 212, 0.2);  /* GreyMid01  @ 20% */
    /* base type for the whole scope: any text a component rule does not cover still
       lands inside the library instead of the browser default 16px */
    font: var(--vpBody2);
    color: var(--vpText);
  }
  .vp-scope * { box-sizing: border-box; }

  .vp-shell { display: flex; background: var(--vpPageBg); min-height: 100vh; }
  .vp-sidebar {
    /* measured against the live panel: 250px, var(--vpValmoNavy), no padding, 48px rows */
    width: 250px;
    flex-shrink: 0;
    background: var(--vpNavBg);
    color: var(--vpWhite);
    padding: var(--vpSpacingVerPad00);
    display: flex;
    flex-direction: column;
  }
  .vp-sidebar .vp-acct {
    display: flex;
    align-items: center;
    gap: var(--vpSpacingInline12);
    padding: var(--vpSpacingVerPad20);
    border-bottom: 1px solid var(--vpNavDivider);
  }
  .vp-sidebar .vp-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--vpNavAvatarBg);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; flex-shrink: 0;
  }
  .vp-sidebar .vp-avatar img { width: 40px; height: 40px; object-fit: cover; }
  .vp-sidebar .vp-acct-name { font: var(--vpHeading5); text-transform: uppercase; color: var(--vpNavText); }
  /* live: 54x22 pill, 1px white border, 4px radius, 2px 4px padding, 4px gap */
  .vp-sidebar .vp-beu { font: var(--vpBody3); color: var(--vpNavTextDim);
    display: inline-flex; align-items: center; gap: var(--vpSpacingInline04);
    border: 1px solid var(--vpNavPillBorder); border-radius: 4px; padding: var(--vpSpacingVerPad02) var(--vpSpacingHorPad04); }
  /* the shipped chevron is navy (#092D5E), invisible on the navy rail - inverted to white */
  .vp-sidebar .vp-beu img { width: 16px; height: 16px; display: block; filter: brightness(0) invert(1); }
  .vp-sidebar .vp-acct > div { display: flex; flex-direction: column; align-items: flex-start; gap: var(--vpSpacingStack04); }

  .vp-navlist { display: flex; flex-direction: column; padding: var(--vpSpacingVerPad00); }
  .vp-navitem { font: var(--vpBody2);
    position: relative;
    display: flex;
    align-items: center;
    gap: var(--vpSpacingInline12);
    min-height: 48px;
    box-sizing: border-box;
    padding: var(--vpSpacingVerPad14) var(--vpSpacingHorPad20);
    color: var(--vpWhite);
  }
  .vp-navitem .ic { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }
  .vp-navitem .lbl { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* selected module: pale tint plus a 4px bar down the left edge */
  .vp-navitem.active { font: var(--vpHeading5); background: var(--vpNavActiveBg); color: var(--vpNavText); }
  .vp-navitem.active::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 4px; background: var(--vpNavActiveBar);
  }
  .vp-navitem.divider-after { border-bottom: 1px solid var(--vpNavDivider); margin-bottom: var(--vpSpacingStack08); }

  .vp-sidebar-footer { margin-top: auto; }
  /* live gives the footer more air than the nav rows above it: the Log Out block is
     65px (an 8px-padded 48px row) and the logo block 68px (20px padding all round),
     against 48px for an ordinary nav item. */
  .vp-sidebar-footer .vp-navitem { font: var(--vpBody2); height: 65px; padding: var(--vpSpacingVerPad22) var(--vpSpacingHorPad20);
    border-top: 1px solid var(--vpNavDivider); }
  .vp-sidebar-footer .vp-logo-row { font: var(--vpBody2);
    display: flex; align-items: center; gap: var(--vpSpacingInline12);
    height: 68px; box-sizing: border-box; padding: var(--vpSpacingVerPad20);
    color: var(--vpNavTextDim);
    border-top: 1px solid var(--vpNavDivider);
    /* live dims this whole row (logo + label) with opacity .6 - the wordmark
       ships as fill="white", so on the navy rail full strength reads bright
       white where live reads muted blue-grey. Same on the label. */
    opacity: 0.6;
  }
  .vp-sidebar-footer .vp-logo-row img { width: 100px; height: 27px; object-fit: contain; }

  /* status tag at the right end of a nav row - live marks the module whose data
     changed under the captain ("Area Updated"). The row grows 48 -> 54px around it. */
  .vp-navtag { font: var(--vpBody12TagValmo);
    display: inline-flex; align-items: center; flex-shrink: 0; box-sizing: border-box;
    padding: var(--vpSpacingVerPad04) var(--vpSpacingHorPad10);
    border-radius: 4px; margin-left: auto;
    background: var(--vpOrangeBg); color: var(--vpOrangeAction);
  }
  /* live sizes the label to its own text and lets the leftover space fall between
     the label and the tag. Stretching the label instead leaves it 0.3px short of
     "Service Area", which the ellipsis then eats a character to fit. */
  .vp-navitem:has(.vp-navtag) .lbl { flex: 0 0 auto; }

  .vp-badge-new { display: inline-block; width: 34px; height: 16px; flex-shrink: 0; }
  .vp-badge-new img { display: block; width: 100%; height: 100%; }

    /* live: 218x42 on a #c3c9d4 stroke, 6px radius, 8px 16px padding */
    .vp-select { font: var(--vpBody14Valmo); color: var(--vpValmoInk);
      display: inline-flex; align-items: center; justify-content: space-between;
      gap: var(--vpSpacingInline08); min-width: 218px; height: 42px; box-sizing: border-box;
      border: 1px solid var(--vpBorderStrong); border-radius: 6px;
      padding: var(--vpSpacingVerPad08) var(--vpSpacingHorPad16);
      background: var(--vpWhite); cursor: pointer; }
  .vp-select .chev { width: 24px; height: 24px; display: block; flex-shrink: 0; color: var(--vpMuted); font-size: 11px; }

  /* 16px gutter all round - live panels start at x=266 against a 250px rail */
  .vp-content { flex: 1; padding: var(--vpSpacingVerPad16); min-width: 0; display: flex; flex-direction: column; }
  /* Pilot Management runs a 12px gutter where the payments pages run 16px */
  .vp-content-tight { padding: var(--vpSpacingVerPad12) var(--vpSpacingHorPad12); }
  /* live's crumb row measures 16 + 17 + 16 = 49. The 17 is its inner box, one pixel
     taller than the 16px line it holds; declare it so the row lands where live's does. */
  .vp-crumb { font: var(--vpBody14TightValmo); color: var(--vpMuted);
    display: flex; align-items: center; gap: var(--vpSpacingInline08); padding: var(--vpSpacingVerPad16) var(--vpSpacingHorPad00); min-height: 49px;
    box-sizing: border-box; }
  .vp-crumb a { color: var(--vpBrand); text-decoration: none; }
  /* live separates crumbs with chevron-right.svg at 16px, not a "/" character */
  .vp-crumb img { width: 16px; height: 16px; display: block; flex-shrink: 0; }
  /* Page header band. Full-bleed: negative margins cancel .vp-content's 20px 24px
     padding so it runs from the nav edge to the right edge of the page and sits flush
     with the top; the padding is then put back inside so the title stays aligned with
     the page content below it. Used at the top of every page. */
  /* live: padding 12px 16px, and NO bottom border or shadow - checked on Payments,
     Payment Details, Service Area, Loss Management, Cash Pendency and DC Capacity;
     none of them stroke the band. So the stroke is opt-in: add .vp-pagebar-bordered
