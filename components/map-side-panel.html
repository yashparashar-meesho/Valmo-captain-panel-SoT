<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Map Side Panel — Valmo Partner component</title>
<!-- no external fonts: Mier B02 is local, with a metric-matched fallback -->
<style>body{margin:0;padding:24px;background:#eaeaf2;}</style>
<link rel="stylesheet" href="../assets/kit.css">
</head>
<body>
<div class="vp-scope">
<div class="vp-maparea" style="min-height:240px;">
  <div class="vp-mappanel" data-collapsed="0" style="position:relative;top:0;left:0;">
    <h4>Panel title<span class="vp-expand-ic"></span></h4>
    <div class="p-sub">Supporting line under the title</div>
  </div>
  <div class="vp-panel-toggle" onclick="var p=this.previousElementSibling;var col=p.style.display==='none';p.style.display=col?'':'none';this.style.left=col?'377px':'12px';this.innerHTML=col?'&#8249;':'&#8250;';">&#8249;</div>
</div>
</div>
<script>
document.addEventListener("error", function (e) {
  var el = e.target;
  if (el && el.tagName === "IMG") { el.style.visibility = "hidden"; }
}, true);
</script>
</body>
</html>
