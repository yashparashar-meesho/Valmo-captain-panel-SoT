<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Metric Card — Valmo Partner component</title>
<!-- no external fonts: Mier B02 is local, with a metric-matched fallback -->
<style>body{margin:0;padding:24px;background:#eaeaf2;}</style>
<link rel="stylesheet" href="../assets/kit.css">
</head>
<body>
<div class="vp-scope">
<div style="width:340px;"><div class="vp-metriccard missed"><div class="head"><span class="nm">Pilot Rate Card</span><button class="vp-langbtn" type="button"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0.6 L9 5 L1 9.4 Z"/></svg><span>हिंदी</span></button></div><div class="pair"><div><div class="k">Current</div><div class="v">₹16.20<span class="vp-statchip bad">Not Good<svg viewBox="0 0 12 12" aria-hidden="true" fill="none"><path d="M2.4 11V1" stroke="#F44240" stroke-width="1.2" stroke-linecap="round"/><path d="M2.4 1.6h6.2l-1.5 2 1.5 2H2.4z" fill="#F44240"/></svg></span></div></div><div><div class="k">Target</div><div class="v">₹15.70</div></div></div><div class="more"><span>View Details</span><svg viewBox="0 0 8 14" fill="none" aria-hidden="true" width="8" height="14"><path d="M1 1l6 6-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div></div>
</div>
<script>
document.addEventListener("error", function (e) {
  var el = e.target;
  if (el && el.tagName === "IMG") { el.style.visibility = "hidden"; }
}, true);
</script>
</body>
</html>
