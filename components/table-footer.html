<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Table Footer — Valmo Partner component</title>
<!-- no external fonts: Mier B02 is local, with a metric-matched fallback -->
<style>body{margin:0;padding:24px;background:#eaeaf2;}</style>
<link rel="stylesheet" href="../assets/kit.css">
</head>
<body>
<div class="vp-scope">
<div class="vp-tablefoot" style="background:var(--vpSurface);">
  <span class="note"><svg class="vp-info-ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><circle cx="12" cy="7.6" r="0.6" fill="currentColor"></circle></svg>Only last 3 months data is being displayed here, for older data visit <a href="#">Valmo Support</a></span>
  <div class="vp-pagination"><span class="pg arrow">&#8249;</span><span class="pg active">1</span><span class="pg">2</span><span class="pg">3</span><span class="pg arrow">&#8250;</span></div>
</div>
</div>
<script>
document.addEventListener("error", function (e) {
  var el = e.target;
  if (el && el.tagName === "IMG") { el.style.visibility = "hidden"; }
}, true);
</script>
</body>
</html>
