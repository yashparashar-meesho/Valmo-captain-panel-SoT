<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Metric Row — Valmo Partner component</title>
<!-- no external fonts: Mier B02 is local, with a metric-matched fallback -->
<style>body{margin:0;padding:24px;background:#eaeaf2;}</style>
<link rel="stylesheet" href="../assets/kit.css">
</head>
<body>
<div class="vp-scope">
<div style="max-width:321px;">
  <div class="vp-kv"><span class="lbl">Current Pincodes</span><span class="val">560087, 560035, 560102, 560103</span></div>
  <div class="vp-kv"><span class="lbl">Daily 3p + Valmo Order Count<span class="vp-info-dot">i</span></span><span class="val">1150/day</span></div>
  <div class="vp-metric-hint">Increase your orders upto this by improving DC performance</div>
</div>
</div>
<script>
document.addEventListener("error", function (e) {
  var el = e.target;
  if (el && el.tagName === "IMG") { el.style.visibility = "hidden"; }
}, true);
</script>
</body>
</html>
