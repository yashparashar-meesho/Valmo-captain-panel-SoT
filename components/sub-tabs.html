<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sub Tabs — Valmo Partner component</title>
<!-- no external fonts: Mier B02 is local, with a metric-matched fallback -->
<style>body{margin:0;padding:24px;background:#eaeaf2;}</style>
<link rel="stylesheet" href="../assets/kit.css">
</head>
<body>
<div class="vp-scope">
<div class="vp-subtabbar">
        <div class="vp-tab active">My Service Area</div>
        <div class="vp-tab" data-goto="service-area-find-shipment">Find Shipment Location</div>
        <div class="vp-tab" data-goto="service-area-misrouted">Misrouted Shipment</div>
      </div>
</div>
<script>
document.addEventListener("error", function (e) {
  var el = e.target;
  if (el && el.tagName === "IMG") { el.style.visibility = "hidden"; }
}, true);
</script>
</body>
</html>
