<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Map Markers — Valmo Partner component</title>
<!-- no external fonts: Mier B02 is local, with a metric-matched fallback -->
<style>body{margin:0;padding:24px;background:#eaeaf2;}</style>
<link rel="stylesheet" href="../assets/kit.css">
</head>
<body>
<div class="vp-scope">
<div style="display:flex;align-items:flex-end;gap:34px;padding:30px 16px 16px;border-radius:8px;">
  <div style="position:relative;width:56px;height:46px;"><div class="vp-dcpin" style="left:50%;top:100%;"><img src="../assets/icons/ic_blue_marker.svg" alt=""><span class="code">UXV</span></div></div>
  <div style="position:relative;width:86px;height:46px;"><div class="vp-dcpin mine" style="left:50%;top:100%;"><img src="../assets/icons/ic_blue_marker.svg" alt=""><span class="code">My DC (BEU)</span></div></div>
  <div style="position:relative;width:26px;height:46px;"><div class="vp-shiptri" style="left:50%;top:60%;"></div></div>
  <div style="position:relative;width:26px;height:46px;"><div class="vp-shipdot diff-dc" style="left:50%;top:60%;"></div></div>
  <div style="position:relative;width:26px;height:46px;"><div class="vp-shipdot outside" style="left:50%;top:60%;"></div></div>
  <div style="position:relative;width:26px;height:46px;"><div class="vp-shipdot rto" style="left:50%;top:60%;"></div></div>
</div>
</div>
<script>
document.addEventListener("error", function (e) {
  var el = e.target;
  if (el && el.tagName === "IMG") { el.style.visibility = "hidden"; }
}, true);
</script>
</body>
</html>
