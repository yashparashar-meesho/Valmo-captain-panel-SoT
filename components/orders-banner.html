<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Orders Banner — Valmo Partner component</title>
<!-- no external fonts: Mier B02 is local, with a metric-matched fallback -->
<style>body{margin:0;padding:24px;background:#eaeaf2;}</style>
<link rel="stylesheet" href="../assets/kit.css">
</head>
<body>
<div class="vp-scope">
<div class="vp-gdbanner"><div class="cap">Your Orders (Out of Max Orders):</div><div class="line"><span class="sm">Getting</span><span class="big">7583</span><span class="sm">out of</span><span class="big">7058</span><span class="sm">Total Orders</span><span class="pill">You are expected to see 6% lesser orders in coming weeks due to poor RTO and rate card</span></div></div>
</div>
<script>
document.addEventListener("error", function (e) {
  var el = e.target;
  if (el && el.tagName === "IMG") { el.style.visibility = "hidden"; }
}, true);
</script>
</body>
</html>
