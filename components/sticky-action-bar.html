<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sticky Action Bar — Valmo Partner component</title>
<!-- no external fonts: Mier B02 is local, with a metric-matched fallback -->
<style>body{margin:0;padding:24px;background:#eaeaf2;}</style>
<link rel="stylesheet" href="../assets/kit.css">
</head>
<body>
<div class="vp-scope">
<div style="position:relative;max-width:900px;"><div class="vp-dcc-actionbar"><div class="sum"><div><div class="k">New Delivery Capacity</div><div class="v">-</div></div><div><div class="k">New Pickup Capacity</div><div class="v">-</div></div></div><button class="vp-btn vp-btn-primary" type="button">Save Delivery &amp; Pickup Capacity</button></div></div>
</div>
<script>
document.addEventListener("error", function (e) {
  var el = e.target;
  if (el && el.tagName === "IMG") { el.style.visibility = "hidden"; }
}, true);
</script>
</body>
</html>
