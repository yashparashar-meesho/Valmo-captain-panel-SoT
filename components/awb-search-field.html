<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AWB Search Field — Valmo Partner component</title>
<!-- no external fonts: Mier B02 is local, with a metric-matched fallback -->
<style>body{margin:0;padding:24px;background:#eaeaf2;}</style>
<link rel="stylesheet" href="../assets/kit.css">
</head>
<body>
<div class="vp-scope">
<div style="max-width:321px;">
  <div class="vp-awbfield">
    <div class="inp">Enter AWB number</div>
    <div class="go"><img src="../assets/icons/ic_chevron_right.svg" alt=""></div>
  </div>
</div>
</div>
<script>
document.addEventListener("error", function (e) {
  var el = e.target;
  if (el && el.tagName === "IMG") { el.style.visibility = "hidden"; }
}, true);
</script>
</body>
</html>
