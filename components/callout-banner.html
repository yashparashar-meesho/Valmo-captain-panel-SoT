<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Callout Banner — Valmo Partner component</title>
<!-- no external fonts: Mier B02 is local, with a metric-matched fallback -->
<style>body{margin:0;padding:24px;background:#eaeaf2;}</style>
<link rel="stylesheet" href="../assets/kit.css">
</head>
<body>
<div class="vp-scope">
<div class="vp-banner" style="width:100%;">
  <div class="vp-illo"><img src="../assets/icons/ic_3078c1ee85.png" alt=""></div>
  <div><h4>Add and manage pilots here</h4><p>Ask pilots to complete onboarding on the Valmo Partner App first, before you can add them here.</p><button class="vp-btn vp-btn-primary" style="margin-top:8px;">+ Add Pilots</button></div>
</div>
</div>
<script>
document.addEventListener("error", function (e) {
  var el = e.target;
  if (el && el.tagName === "IMG") { el.style.visibility = "hidden"; }
}, true);
</script>
</body>
</html>
