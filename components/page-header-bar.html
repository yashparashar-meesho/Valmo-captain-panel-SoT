<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Page Header Bar — Valmo Partner component</title>
<!-- no external fonts: Mier B02 is local, with a metric-matched fallback -->
<style>body{margin:0;padding:24px;background:#eaeaf2;}</style>
<link rel="stylesheet" href="../assets/kit.css">
</head>
<body>
<div class="vp-scope">
<div class="vp-pagebar" style="margin:0;"><h3>Payments</h3></div>
<div class="vp-pagebar" style="margin:12px 0 0;"><h3>Pilot Management</h3><button class="vp-btn vp-btn-primary">+ Add Pilots</button></div>
<div class="vp-pagebar vp-pagebar-col" style="margin:12px 0 0;">
  <div class="vp-crumb"><a href="#">Payments</a><img src="../assets/icons/ic_chevron_right.svg" alt=""><span>Payment Details</span></div>
  <div class="vp-pagebar-row"><h3>Payment Details (17 Aug - 23 Aug)</h3></div>
</div>
<div class="vp-pagebar vp-pagebar-bordered" style="margin:12px 0 0;"><h3>With the optional bottom stroke</h3></div>
</div>
<script>
document.addEventListener("error", function (e) {
  var el = e.target;
  if (el && el.tagName === "IMG") { el.style.visibility = "hidden"; }
}, true);
</script>
</body>
</html>
