<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Accordion Row — Valmo Partner component</title>
<!-- no external fonts: Mier B02 is local, with a metric-matched fallback -->
<style>body{margin:0;padding:24px;background:#eaeaf2;}</style>
<link rel="stylesheet" href="../assets/kit.css">
</head>
<body>
<div class="vp-scope">
<div class="vp-accordion" style="width:300px;">
  <details class="vp-accrow-details" open>
    <summary class="vp-accrow"><span class="lft"><span class="chevron">&#9662;</span> Base Pay</span><span>+&#8377;33,980.00</span></summary>
    <div class="vp-accrow-body">
      <div class="vp-accrow-line"><span>7470 Deliveries @&#8377;4.50/Delivery</span><span>+&#8377;33,615.00</span></div>
      <div class="vp-accrow-line"><span>73 Pickups @&#8377;5.00/Pickup</span><span>+&#8377;365.00</span></div>
    </div>
  </details>
  <details class="vp-accrow-details">
    <summary class="vp-accrow"><span class="lft"><span class="chevron">&#9662;</span> Adjustments</span><span>+&#8377;725.44</span></summary>
    <div class="vp-accrow-body">
      <div class="vp-accrow-line"><span>Consumable Payout</span><span>+&#8377;1,076.00</span></div>
      <div class="vp-accrow-line"><span>TDS @ 1%</span><span>-&#8377;350.56</span></div>
    </div>
  </details>
</div>
</div>
<script>
document.addEventListener("error", function (e) {
  var el = e.target;
  if (el && el.tagName === "IMG") { el.style.visibility = "hidden"; }
}, true);
</script>
</body>
</html>
