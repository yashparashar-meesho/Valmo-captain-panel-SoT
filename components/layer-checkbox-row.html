<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Layer Checkbox Row — Valmo Partner component</title>
<!-- no external fonts: Mier B02 is local, with a metric-matched fallback -->
<style>body{margin:0;padding:24px;background:#eaeaf2;}</style>
<link rel="stylesheet" href="../assets/kit.css">
</head>
<body>
<div class="vp-scope">
<div style="max-width:321px;">
  <div class="vp-layerrow" data-target="same-dc" onclick="var c=this.querySelector('.vp-cbx');c.classList.toggle('on');this.classList.toggle('off');var t=this.getAttribute('data-target'),m=this.closest('.vp-maparea');if(t&&m){var el=m.querySelector('[data-lyr=\''+t+'\']');if(el)el.style.display=c.classList.contains('on')?'':'none';}"><span class="vp-cbx on"></span><span class="lbl">Delivered within polygon by same DC (2)</span><span class="vp-legend-tri"></span></div>
  <div class="vp-layerrow" data-target="diff-dc" onclick="var c=this.querySelector('.vp-cbx');c.classList.toggle('on');this.classList.toggle('off');var t=this.getAttribute('data-target'),m=this.closest('.vp-maparea');if(t&&m){var el=m.querySelector('[data-lyr=\''+t+'\']');if(el)el.style.display=c.classList.contains('on')?'':'none';}"><span class="vp-cbx on"></span><span class="lbl">Delivered within polygon by different DC (2)</span><span class="vp-legend-dot diff-dc"></span></div>
  <div class="vp-layerrow off" data-target="outside" onclick="var c=this.querySelector('.vp-cbx');c.classList.toggle('on');this.classList.toggle('off');var t=this.getAttribute('data-target'),m=this.closest('.vp-maparea');if(t&&m){var el=m.querySelector('[data-lyr=\''+t+'\']');if(el)el.style.display=c.classList.contains('on')?'':'none';}"><span class="vp-cbx"></span><span class="lbl">Delivered outside polygon (169)</span><span class="vp-legend-dot outside"></span></div>
  <div class="vp-layerrow off" data-target="rto" onclick="var c=this.querySelector('.vp-cbx');c.classList.toggle('on');this.classList.toggle('off');var t=this.getAttribute('data-target'),m=this.closest('.vp-maparea');if(t&&m){var el=m.querySelector('[data-lyr=\''+t+'\']');if(el)el.style.display=c.classList.contains('on')?'':'none';}"><span class="vp-cbx"></span><span class="lbl">Not delivered and RTO marked (49)</span><span class="vp-legend-dot rto"></span></div>
  <div class="vp-layerrow off" data-target="arrows" onclick="var c=this.querySelector('.vp-cbx');c.classList.toggle('on');this.classList.toggle('off');var t=this.getAttribute('data-target'),m=this.closest('.vp-maparea');if(t&&m){var el=m.querySelector('[data-lyr=\''+t+'\']');if(el)el.style.display=c.classList.contains('on')?'':'none';}"><span class="vp-cbx"></span><span class="lbl">Arrow to misrouted DC from shipments inside your area (42)</span><img src="../assets/icons/ic_dashed_lines.svg" style="width:18px;" alt=""></div>
</div>
</div>
<script>
document.addEventListener("error", function (e) {
  var el = e.target;
  if (el && el.tagName === "IMG") { el.style.visibility = "hidden"; }
}, true);
</script>
</body>
</html>
