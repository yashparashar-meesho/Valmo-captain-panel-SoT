<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Collapsible Section — Valmo Partner component</title>
<!-- no external fonts: Mier B02 is local, with a metric-matched fallback -->
<style>body{margin:0;padding:24px;background:#eaeaf2;}</style>
<link rel="stylesheet" href="../assets/kit.css">
</head>
<body>
<div class="vp-scope">
<div class="vp-areahistory">
            <div class="vp-inlinealert amber"><img src="../assets/icons/ic_info_amber.svg" alt=""><div>Your service area has been Updated on 10 Aug&#8217;26 by Area Manager</div></div>
            <div class="vp-collapse open">
              <div class="vp-collapse-head" onclick="var c=this.parentNode;var b=this.nextElementSibling;var open=b.style.display!=='none';b.style.display=open?'none':'';c.className=open?'vp-collapse':'vp-collapse open';">Area Update History<img class="chev" src="../assets/icons/ic_chevron_down.svg" alt=""></div>
              <div class="vp-collapse-body">
              <div class="vp-optrow current"><span class="vp-sel on"></span>Area On 10th Aug, 7:01PM<span class="vp-currentpill"><span>Current</span></span></div>
              <div class="vp-optnote">The shipments will land in 5 to 10 days from this date.</div>
              <div class="vp-optsep"></div>
              <div class="vp-optrow past" onclick="var b=this.parentNode,rows=b.querySelectorAll('.vp-optrow.past'),i=0,me=0,was=this.className.indexOf('on')>-1;for(i=0;i&lt;rows.length;i++){if(rows[i]===this)me=i;rows[i].className='vp-optrow past';var s=rows[i].querySelector('.vp-cbx');if(s)s.className='vp-cbx';}if(!was){this.className='vp-optrow past on';var s2=this.querySelector('.vp-cbx');if(s2)s2.className='vp-cbx on';}b.className=was?'vp-collapse-body':'vp-collapse-body comparing';var m=this.closest('.vp-maparea');if(m){var ps=m.querySelectorAll('[data-area]');for(i=0;i&lt;ps.length;i++)ps[i].style.display=(i===0||(!was&amp;&amp;i===me+1))?'':'none';}"><span class="vp-cbx"></span>Area on 10th Aug, 7:00PM<span class="vp-expand-ic amber"><i></i><i></i><i></i><i></i></span></div>
              <div class="vp-optrow past" onclick="var b=this.parentNode,rows=b.querySelectorAll('.vp-optrow.past'),i=0,me=0,was=this.className.indexOf('on')>-1;for(i=0;i&lt;rows.length;i++){if(rows[i]===this)me=i;rows[i].className='vp-optrow past';var s=rows[i].querySelector('.vp-cbx');if(s)s.className='vp-cbx';}if(!was){this.className='vp-optrow past on';var s2=this.querySelector('.vp-cbx');if(s2)s2.className='vp-cbx on';}b.className=was?'vp-collapse-body':'vp-collapse-body comparing';var m=this.closest('.vp-maparea');if(m){var ps=m.querySelectorAll('[data-area]');for(i=0;i&lt;ps.length;i++)ps[i].style.display=(i===0||(!was&amp;&amp;i===me+1))?'':'none';}"><span class="vp-cbx"></span>Area on 10th Aug, 6:59PM<span class="vp-expand-ic amber"><i></i><i></i><i></i><i></i></span></div>
              <div class="vp-optrow past" onclick="var b=this.parentNode,rows=b.querySelectorAll('.vp-optrow.past'),i=0,me=0,was=this.className.indexOf('on')>-1;for(i=0;i&lt;rows.length;i++){if(rows[i]===this)me=i;rows[i].className='vp-optrow past';var s=rows[i].querySelector('.vp-cbx');if(s)s.className='vp-cbx';}if(!was){this.className='vp-optrow past on';var s2=this.querySelector('.vp-cbx');if(s2)s2.className='vp-cbx on';}b.className=was?'vp-collapse-body':'vp-collapse-body comparing';var m=this.closest('.vp-maparea');if(m){var ps=m.querySelectorAll('[data-area]');for(i=0;i&lt;ps.length;i++)ps[i].style.display=(i===0||(!was&amp;&amp;i===me+1))?'':'none';}"><span class="vp-cbx"></span>Area on 10th Aug, 6:57PM<span class="vp-expand-ic amber"><i></i><i></i><i></i><i></i></span></div>
              </div>
            </div>
          </div>
</div>
<script>
document.addEventListener("error", function (e) {
  var el = e.target;
  if (el && el.tagName === "IMG") { el.style.visibility = "hidden"; }
}, true);
</script>
</body>
</html>
