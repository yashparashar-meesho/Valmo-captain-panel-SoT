<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sidebar Navigation — Valmo Partner component</title>
<!-- no external fonts: Mier B02 is local, with a metric-matched fallback -->
<style>body{margin:0;padding:24px;background:#eaeaf2;}</style>
<link rel="stylesheet" href="../assets/kit.css">
</head>
<body>
<div class="vp-scope">
<div class="vp-sidebar" style="min-height:400px;">
  <div class="vp-acct">
    <div class="vp-avatar"><img src="../assets/icons/ic_66aed9e0a5.svg" alt=""></div>
    <div><div class="vp-acct-name">Yash P</div><span class="vp-beu">BEU<img src="../assets/icons/ic_chevron_down.svg" alt=""></span></div>
  </div>
  <div class="vp-navlist">
    <div class="vp-navitem"><img class="ic" src="../assets/icons/ic_7220aba916.svg" alt=""><span class="lbl">Valmo Support</span></div>
    <div class="vp-navitem"><img class="ic" src="../assets/icons/ic_499fa6adb6.svg" alt=""><span class="lbl">Payments</span></div>
    <div class="vp-navitem"><img class="ic" src="../assets/icons/ic_c96a29e781.svg" alt=""><span class="lbl">DC Capacity</span><span class="vp-badge-new"><img src="../assets/icons/ic_139e5b8758.svg" alt="NEW"></span></div>
    <div class="vp-navitem"><img class="ic" src="../assets/icons/ic_82a75bf38b.svg" alt=""><span class="lbl">Growth Dashboard</span><span class="vp-badge-new"><img src="../assets/icons/ic_139e5b8758.svg" alt="NEW"></span></div>
    <div class="vp-navitem"><img class="ic" src="../assets/icons/ic_eda39bed0f.svg" alt=""><span class="lbl">Service Area</span><span class="vp-navtag">Area Updated</span></div>
    <div class="vp-navitem"><img class="ic" src="../assets/icons/ic_9e4feb432c.svg" alt=""><span class="lbl">Loss Management</span></div>
    <div class="vp-navitem"><img class="ic" src="../assets/icons/ic_5d34a47f1f.svg" alt=""><span class="lbl">Cash Pendency</span><span class="vp-badge-new"><img src="../assets/icons/ic_139e5b8758.svg" alt="NEW"></span></div>
    <div class="vp-navitem"><img class="ic" src="../assets/icons/ic_8ad2411e3d.svg" alt=""><span class="lbl">Pilot Rate Card</span><span class="vp-badge-new"><img src="../assets/icons/ic_139e5b8758.svg" alt="NEW"></span></div>
    <div class="vp-navitem active"><img class="ic" src="../assets/icons/ic_94023365dd.svg" alt=""><span class="lbl">Pilot Management</span><span class="vp-badge-new"><img src="../assets/icons/ic_139e5b8758.svg" alt="NEW"></span></div>
  </div>
</div>
</div>
<script>
document.addEventListener("error", function (e) {
  var el = e.target;
  if (el && el.tagName === "IMG") { el.style.visibility = "hidden"; }
}, true);
</script>
</body>
</html>
