<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Empty State Card — Valmo Partner component</title>
<!-- no external fonts: Mier B02 is local, with a metric-matched fallback -->
<style>body{margin:0;padding:24px;background:#eaeaf2;}</style>
<link rel="stylesheet" href="../assets/kit.css">
</head>
<body>
<div class="vp-scope">
<div style="max-width:321px;">
  <div class="vp-emptycard">
    <img class="illo" src="../assets/icons/img_find_shipment.png" alt="">
    <h5>Find Shipment Location in 3 Easy Steps</h5>
    <div class="vp-emptystep"><img src="../assets/icons/ic_package_search.svg" alt="">Enter AWB number</div>
    <div class="vp-emptystep"><img src="../assets/icons/ic_place_marker.svg" alt="">View shipment location</div>
    <div class="vp-emptystep"><img src="../assets/icons/ic_dashed_lines.svg" alt="">Check Misrouting eligibility</div>
  </div>
</div>
</div>
<script>
document.addEventListener("error", function (e) {
  var el = e.target;
  if (el && el.tagName === "IMG") { el.style.visibility = "hidden"; }
}, true);
</script>
</body>
</html>
