<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Date Range Field — Valmo Partner component</title>
<!-- no external fonts: Mier B02 is local, with a metric-matched fallback -->
<style>body{margin:0;padding:24px;background:#eaeaf2;}</style>
<link rel="stylesheet" href="../assets/kit.css">
</head>
<body>
<div class="vp-scope">
<div style="max-width:321px;">
  <div class="vp-daterange">
    <span class="rng"><img src="../assets/icons/ic_calendar.svg" alt="">20 Aug 26 - 27 Aug 26</span>
    <span class="edit">Edit Date Range<img src="../assets/icons/ic_pencil.svg" alt=""></span>
  </div>
</div>
</div>
<script>
document.addEventListener("error", function (e) {
  var el = e.target;
  if (el && el.tagName === "IMG") { el.style.visibility = "hidden"; }
}, true);
</script>
</body>
</html>
