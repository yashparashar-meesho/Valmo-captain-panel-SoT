<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Status Dot — Valmo Partner component</title>
<!-- no external fonts: Mier B02 is local, with a metric-matched fallback -->
<style>body{margin:0;padding:24px;background:#eaeaf2;}</style>
<link rel="stylesheet" href="../assets/kit.css">
</head>
<body>
<div class="vp-scope">
<div style="display:flex;gap:24px;align-items:center;"><span class="vp-gdd-dot"></span><span class="vp-gdd-dot bad"></span></div>
</div>
<script>
document.addEventListener("error", function (e) {
  var el = e.target;
  if (el && el.tagName === "IMG") { el.style.visibility = "hidden"; }
}, true);
</script>
</body>
</html>
