<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stat Summary Bar — Valmo Partner component</title>
<!-- no external fonts: Mier B02 is local, with a metric-matched fallback -->
<style>body{margin:0;padding:24px;background:#eaeaf2;}</style>
<link rel="stylesheet" href="../assets/kit.css">
</head>
<body>
<div class="vp-scope">
<div class="vp-statbar" style="width:100%;">
  <div class="stat"><div class="lbl">Total Base Pay</div><div class="val">+&#8377;289,562.00</div></div>
  <div class="stat"><div class="lbl">Total Adjustments</div><div class="val">+&#8377;26,916.88</div></div>
  <div class="stat"><div class="lbl">Total Losses</div><div class="val">-&#8377;9,406.00</div></div>
  <div class="stat"><div class="lbl">Total Earnings</div><div class="val">+&#8377;307,072.88</div></div>
</div>
</div>
<script>
document.addEventListener("error", function (e) {
  var el = e.target;
  if (el && el.tagName === "IMG") { el.style.visibility = "hidden"; }
}, true);
</script>
</body>
</html>
