<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Notice Bar — Valmo Partner component</title>
<!-- no external fonts: Mier B02 is local, with a metric-matched fallback -->
<style>body{margin:0;padding:24px;background:#eaeaf2;}</style>
<link rel="stylesheet" href="../assets/kit.css">
</head>
<body>
<div class="vp-scope">
<div class="vp-dcc-notice"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6.4" stroke="#8A6D1F" stroke-width="1.2"/><path d="M8 4.6V8l2.2 1.4" stroke="#8A6D1F" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>The updated capacities will be effective from tomorrow and the updated volume will arrive at your DC in 5-7 days</span></div>
</div>
<script>
document.addEventListener("error", function (e) {
  var el = e.target;
  if (el && el.tagName === "IMG") { el.style.visibility = "hidden"; }
}, true);
</script>
</body>
</html>
