# versions.json is the one generated file that cannot be rebuilt from source/,
# because it is derived from git history rather than from the catalogue. That
# is why it is not part of the reproducible-export check in verify.yml: CI runs
# after the merge commit exists, so regenerating during a pull request would
# always produce a file that differs from the one committed, and the diff check
# would fail on every PR.
#
# So it is rebuilt here instead - after the merge, when the history it
# describes is final - and committed back if it changed. Without this the
# ledger's own version history silently freezes at whatever commit last
# happened to touch it, which is exactly what happened between #30 and #33:
# three merges missing, and the catalogue still confidently reporting "5".
name: versions

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  # never let two pushes race to commit the same file
  group: versions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build_versions.py walks the full history with --follow; a shallow
          # clone would silently produce a truncated list rather than an error
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild versions.json from git history
        run: python3 scripts/build_versions.py

      - name: Commit it if anything moved
        run: |
          if git diff --quiet -- versions.json; then
            echo "versions.json is already current."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit \
            -m "Rebuild version history" \
            -m "Generated from git history after the merge, so the catalogue's own history can never lag behind the commits it describes." \
            -m "[skip ci]"
          git push
